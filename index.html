  for (let i = 0; bits.length < total * 8; i++) push([0xec, 0x11][i % 2], 8);
  const dat = new Uint8Array(total);
  for (let i = 0; i < total; i++){
    let v = 0; for (let j = 0; j < 8; j++) v = (v << 1) | bits[i * 8 + j];
    dat[i] = v;
  }
  /* ── 블록 분할 · RS · 인터리브 ── */
  const blocks = []; let p = 0;
  for (let i = 0; i < cap.g1n; i++){ blocks.push(dat.slice(p, p + cap.g1d)); p += cap.g1d; }
  for (let i = 0; i < cap.g2n; i++){ blocks.push(dat.slice(p, p + cap.g2d)); p += cap.g2d; }
  const ecs = blocks.map(b => rsEncode(b, cap.ec));
  const out = [];
  const maxD = Math.max(...blocks.map(b => b.length));
  for (let i = 0; i < maxD; i++) blocks.forEach(b => { if (i < b.length) out.push(b[i]); });
  for (let i = 0; i < cap.ec; i++) ecs.forEach(e => out.push(e[i]));

  /* ── 기능 패턴 ── */
  const N = 17 + ver * 4;
  const m = Array.from({length: N}, () => new Int8Array(N).fill(0));
  const fn = Array.from({length: N}, () => new Int8Array(N).fill(0));
  const put = (r, c, v) => { m[r][c] = v; fn[r][c] = 1; };
  /* 패턴은 계산식 대신 그림 그대로 둔다 — 예전에 max() 식으로 만들었다가
     흰 고리와 검은 고리를 뒤집어 스캐너가 코드를 아예 찾지 못했다.
     분리자(패턴 밖 한 줄)는 흰색이므로 -1..7 범위를 돌며 0 으로 채운다. */
  const finder = (r0, c0) => {
    for (let i = -1; i <= 7; i++) for (let j = -1; j <= 7; j++){
      const r = r0 + i, c = c0 + j;
      if (r < 0 || r >= N || c < 0 || c >= N) continue;
      const inside = i >= 0 && i <= 6 && j >= 0 && j <= 6;
      put(r, c, inside ? QR_FINDER[i][j] : 0);
    }
  };
  finder(0, 0); finder(0, N - 7); finder(N - 7, 0);
  for (let i = 8; i < N - 8; i++){ put(6, i, i % 2 === 0 ? 1 : 0); put(i, 6, i % 2 === 0 ? 1 : 0); }
  const ac = QR_ALIGN[ver], last = ac[ac.length - 1];
  ac.forEach(r => ac.forEach(c => {
    if ((r === 6 && c === 6) || (r === 6 && c === last) || (r === last && c === 6)) return;
    for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++)
      put(r + i, c + j, QR_ALIGN_PAT[i + 2][j + 2]);
  }));
  /* 포맷·버전 정보 자리를 먼저 잡아 데이터가 침범하지 않게 한다 */
  for (let i = 0; i <= 8; i++){ if (!fn[8][i]) put(8, i, 0); if (!fn[i][8]) put(i, 8, 0); }
  for (let i = N - 8; i < N; i++){ if (!fn[8][i]) put(8, i, 0); if (!fn[i][8]) put(i, 8, 0); }
  if (ver >= 7) for (let i = 0; i < 18; i++){
    const a = N - 11 + i % 3, b = Math.floor(i / 3);
    put(b, a, 0); put(a, b, 0);
  }
  /* ── 데이터 배치 (지그재그, 오른쪽에서 왼쪽으로) ── */
  let bi = 0;
  const bitAt = k => (k >> 3) < out.length ? (out[k >> 3] >> (7 - (k & 7))) & 1 : 0;
  let up = true;
  for (let col = N - 1; col >= 1; col -= 2){
    if (col === 6) col = 5;                      // 세로 타이밍 열은 건너뛴다
    for (let k = 0; k < N; k++){
      const r = up ? N - 1 - k : k;
      for (let d = 0; d < 2; d++){
        const c = col - d;
        if (fn[r][c]) continue;
        m[r][c] = bitAt(bi++);
      }
    }
    up = !up;
  }
  /* ── 마스크 8개를 실제로 그려 보고 벌점이 가장 낮은 것을 고른다 ── */
  let best = null;
  for (let mk = 0; mk < 8; mk++){
    const t = m.map(row => Int8Array.from(row));
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++)
      if (!fn[r][c] && QR_MASKS[mk](r, c)) t[r][c] ^= 1;
    const fmt = qrFormat(ecl, mk);
    const bit = i => (fmt >> i) & 1;
    for (let i = 0; i <= 5; i++) t[i][8] = bit(i);
    t[7][8] = bit(6); t[8][8] = bit(7); t[8][7] = bit(8);
    for (let i = 9; i < 15; i++) t[8][14 - i] = bit(i);
    for (let i = 0; i < 8; i++) t[8][N - 1 - i] = bit(i);
    for (let i = 8; i < 15; i++) t[N - 15 + i][8] = bit(i);
    t[N - 8][8] = 1;                             // 항상 검정인 모듈
    if (ver >= 7){
      const vb = qrVerBits(ver);
      for (let i = 0; i < 18; i++){
        const b = (vb >> i) & 1, a = N - 11 + i % 3, q = Math.floor(i / 3);
        t[q][a] = b; t[a][q] = b;
      }
    }
    const pen = qrPenalty(t, N);
    if (!best || pen < best.pen) best = {pen, m: t};
  }
  return {N, m: best.m, ver, ecl};
}
/** 격자를 canvas 에 그린다 (여백 4모듈은 표준 필수) */
function qrDraw(cv, text, ecl){
  const q = qrEncode(text, ecl);
  if (!q) return null;
  const quiet = 4, side = q.N + quiet * 2;
  cv.width = side; cv.height = side;
  const g = cv.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, side, side);
  g.fillStyle = '#000';
  for (let r = 0; r < q.N; r++) for (let c = 0; c < q.N; c++)
    if (q.m[r][c]) g.fillRect(c + quiet, r + quiet, 1, 1);
  return q;
}

function download(name, text, mime){
  const b = new Blob(['﻿' + text], {type: (mime || 'text/plain') + ';charset=utf-8'});
  const u = URL.createObjectURL(b), a = document.createElement('a');
  a.href = u; a.download = name; document.body.appendChild(a); a.click();
  a.remove(); setTimeout(() => URL.revokeObjectURL(u), 1000);
  DB.meta.lastExport = nowISO(); save();
}
function splitCSVLine(line){
  const out = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++){
    const c = line[i];
    if (q){
      if (c === '"' && line[i + 1] === '"'){ cur += '"'; i++; }
      else if (c === '"') q = false;
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ','){ out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur); return out;
}
function importText(text){
  text = String(text).trim();
  if (!text) return toast('내용이 비어 있습니다');
  let incoming = [];
  if (text[0] === '{' || text[0] === '['){
    try{
      const j = JSON.parse(text);
      incoming = (Array.isArray(j) ? j : j.items || []).map(normalize);
    }catch(e){ return toast('JSON 형식 오류'); }
  } else {
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    const head = splitCSVLine(lines[0]).map(s => s.trim());
    const isFull = head.includes('name_ko') || head[0] === 'id';
    (isFull ? lines.slice(1) : lines).forEach(l => {
      const c = splitCSVLine(l);
      if (c.length < 2) return;
      if (isFull){
        const o = {}; head.forEach((h, i) => o[h] = (c[i] ?? '').trim());
        incoming.push(normalize(o));
      } else {
        const [lo, hi] = parseRange(c[6]);
        incoming.push(normalize({
          name_ko:(c[0] || '').trim(), type:(c[1] || '').trim(), abv:(c[2] || '').trim(),
          cask:(c[3] || '').trim(), purchase_date:(c[4] || '').trim(),
          purchase_price:parsePrice(c[5]), market_low:lo, market_high:hi,
          nose:(c[7] || '').trim(), taste:(c[8] || '').trim(), finish:(c[9] || '').trim(),
          /* 11번째 열은 내보낼 때 `rating_wb || rating_my` 를 쓴 파생값(__rating)이다.
             예전에는 이것을 rating_bible 로 되돌려 넣어, Whiskybase 점수가 Bible 점수로
             둔갑했다. 열 순서는 그대로 두고 받는 곳만 바로잡는다. */
          rating_wb:(c[10] || '').trim(),
          image_url:/^https?:/i.test((c[11] || '').trim()) ? c[11].trim() : '',
        }));
      }
    });
  }
  if (!incoming.length) return toast('가져올 항목이 없습니다');
  let add = 0, upd = 0;
  const touched = [];
  incoming.forEach(n => {
    const i = DB.items.findIndex(x => x.id === n.id ||
      (x.name_ko && x.name_ko === n.name_ko) || (x.name_en && n.name_en && x.name_en === n.name_en));
    if (i >= 0){
      DB.items[i] = {...DB.items[i], ...n, id: DB.items[i].id, updated_at: nowISO()};
      touched.push(DB.items[i]); upd++;
    } else { DB.items.unshift(n); touched.push(n); add++; }
  });
  save(); render(); closeSheet();
  toast(`가져오기 완료 — 신규 ${add}건, 갱신 ${upd}건`);
  /* 가져온 사진은 즉시 전부 규격을 맞춘다. 부팅 정규화(8장)에 맡기면
     많이 가져올수록 원본 URL 그대로 남아 목록의 병 크기가 들쭉날쭉해진다. */
  setTimeout(() => normalizeMissing(touched, {progress: true}), 600);
}

};
/** 서술 필드 길이 상한. 넘으면 **버린다** — 잘린 문장은 고치기가 더 번거롭다 */
const AI_MAXLEN = {nose: 300, taste: 300, finish: 300, cask: 200, tags: 120,
  name_en: 120, distillery: 80, country: 40, region: 60, notes: 300};

/** 이름 → AI 초안. 반환 {F, keys, raw} 또는 throw.
    want 가 주어지면 그 키만 요청한다(빈 칸만 채우기). */
async function aiFill(name, want){
  if (!aiOn()) throw new Error('AI 초안이 꺼져 있습니다 — 설정에서 API 키를 넣어 주세요');
  if (!navigator.onLine) throw new Error('오프라인입니다');
  const keys = (want && want.length ? want : Object.keys(AI_FIELDS))
    .filter(k => AI_FIELDS[k]);
  if (!keys.length) throw new Error('채울 빈 칸이 없습니다');

  const props = {};
  keys.forEach(k => { props[k] = {type: 'STRING', description: AI_FIELDS[k]}; });
  const prompt = [
    '당신은 위스키 데이터 정리 담당자다. 아래 위스키의 사양을 JSON 으로 채운다.',
    '',
    '위스키 이름: ' + name,
    '',
    '규칙:',
    '- **확실하지 않은 항목은 빈 문자열("")로 둔다.** 추측해 채우지 않는다.',
    '- 배치·빈티지 표기가 없으면 가장 표준적인 공식 병입(OB)을 기준으로 한다.',
    '- 숫자 항목은 숫자만 쓴다(단위·쉼표·물결표 없이).',
    '- 서술은 한국어로 짧게. 문장을 늘리지 않는다.',
    '- 목록이 지정된 항목은 그 목록의 값만 쓴다.',
  ].join('\n');

  const url = 'https://generativelanguage.googleapis.com/v1beta/models/'
    + encodeURIComponent(aiModel()) + ':generateContent?key=' + encodeURIComponent(aiKey());
  const res = await fetch(url, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      contents: [{parts: [{text: prompt}]}],
      generationConfig: {
        responseMimeType: 'application/json',
        responseSchema: {type: 'OBJECT', properties: props},
        /* 같은 병을 두 번 넣었을 때 다른 답이 나오면 사용자가 신뢰하지 않는다 */
        temperature: 0,
      },
    }),
  });
  const body = await res.text();
  if (!res.ok){
    /* 오류를 삼켜 '실패' 로만 적으면 원인을 알 수 없다 — 응답 문구를 그대로 올린다 */
    let msg = body.slice(0, 200);
    try{ msg = JSON.parse(body).error?.message || msg; }catch(e){}
    if (res.status === 429) msg = '무료 한도를 넘었습니다 — 잠시 뒤 다시 시도하세요';
    /* "API key not valid" 만 보여 주면 사용자는 무엇을 잘못했는지 알 수 없다.
       실제로 가장 흔한 실수는 **API 키 대신 프로젝트 이름을 붙여넣는 것**이다 —
       AI Studio 의 목록에서 프로젝트 이름(gen-lang-client-0000000000)이 눈에 잘 띄고
       키 쪽은 가려져 있다. 길이·접두어로 그 경우를 짚어 준다. */
    else if (/API key not valid|API_KEY_INVALID/i.test(msg)) msg += aiKeyHint();
    throw new Error(msg);
  }
  let obj;
  try{
    const txt = JSON.parse(body).candidates?.[0]?.content?.parts?.[0]?.text || '';
    obj = JSON.parse(txt);
  }catch(e){
    /* 부분 적용이 더 나쁘다 — 파싱이 깨지면 아무것도 채우지 않는다 */
    throw new Error('응답을 읽을 수 없습니다 (형식 오류)');
  }
  const F = {}, filled = new Set();
  keys.forEach(k => {
    let v = obj[k];
    if (v == null) return;
    v = String(v).trim();
    if (!v) return;
    if (AI_CHECK[k]) v = AI_CHECK[k](v);
    if (!v) return;
    if (AI_MAXLEN[k] && v.length > AI_MAXLEN[k]) return;   // 자르지 않고 버린다
    F[k] = v; filled.add(k);
  });
  return {F, keys: filled, raw: obj};
}

/* ── 술장별 지표 ────────────────────────────
   술장마다 물어볼 것이 다르다. 구매 술장은 "얼마 썼고 얼마 남았나", 위시 술장은
   "다 사면 얼마인가", 경험 술장은 "그중에 뭘 살까". 걸러 낸 같은 숫자가 아니라
   그 술장에만 있는 질문이라 따로 만든다. */

/** 지금 실제로 갖고 있는 것 — 미개봉 + 오픈. 비움은 구매 이력이지 보유가 아니다.
    구매 술장이 OWNED(비움 포함)라서 '보유' 를 따로 셀 필요가 생겼다 */
function nowHeld(a){ return a.filter(isHeld); }

/** 경험 술장의 구매 후보 — 마셔 봤고 아직 안 산 것, 평점 높은 순.
    ⚠ 같은 이름의 구매 항목이 있으면 뺀다. 마셔 본 병을 나중에 사면 이 앱은 기록을
    **두 개**로 만든다(초안이 구매 정보를 가져오지 않고 새 병으로 취급한다). 그냥 두면
    옛 경험 항목이 남아 **이미 산 술을 계속 사라고 추천한다.**
    이름 맞추기는 새로 만들지 않고 중복 구매 경고의 dupCandidates 를 쓴다 — squish 로
    정규화해 '라가불린 16년' 과 '라가불린 16' 을 같이 잡는다. */
function buyCandidates(a){
  const exp = a.filter(i => i.status === '경험');
  const bought = it => dupCandidates(it.name_ko || it.name_en || '', it.id)
    .some(d => OWNED.includes(d.status));
  const list = exp.filter(it => !bought(it))
    .sort((x, y) => bestScore(y) - bestScore(x));
  return {list, hidden: exp.length - list.length};
}

/** 위시 술장의 예상 지출 — 시장가 중간값 합산. 시장가가 없는 병은 셀 수 없다 */
function wishSpend(a){
  const w = a.filter(i => marketMid(i) > 0);
  return {
    sum: w.reduce((s, i) => s + marketMid(i), 0), n: w.length, miss: a.length - w.length,
    top: w.slice().sort((x, y) => marketMid(y) - marketMid(x))[0] || null
  };
}

/** 시음 기록의 장소 집계. 저장 형식이 "집 친구집" 이므로 라벨만 떼어 센다 */
function placeCounts(a){
  const m = {};
  a.forEach(i => (i.sessions || []).forEach(s => {
    const lab = String(s.place || '').trim().split(/\s+/)[0];
    if (lab) m[lab] = (m[lab] || 0) + 1;
  }));
  return Object.entries(m).sort((x, y) => y[1] - x[1]);
}

/* ── stats ──────────────────────────────────
   통계 본문을 **대상 집합을 받는 함수**로 뽑아냈다. 전에는 `openStats()` 안에서
   `DB.items` 를 직접 참조하는 150줄짜리 템플릿 하나였고, 그래서 화면에서 무엇을
   보고 있든 같은 숫자가 나왔다.
   시트·목록 위 요약 줄·데스크톱 사이드바가 **모두 이 함수를 쓴다** — 세 곳이 따로
   계산하면 어긋난다(실제로 사이드바의 '보유'가 openStats 와 다른 수를 보여 주고
   있었다). 계산식은 추출할 때 한 줄도 바꾸지 않았다. */
function statsFor(a, tab){
  const n = a.length;
  const priced = a.filter(i => Number(i.purchase_price));
  const buy = priced.reduce((s, i) => s + Number(i.purchase_price), 0);
  const mkt = a.reduce((s, i) => s + marketMid(i), 0);
  /* 손익은 구매가와 시장가가 '둘 다' 있는 병만 대상으로 한다.
     시장가가 비어 있는 한정판까지 넣으면 −100% 처럼 사실과 다른 수치가 나온다. */
  const both = priced.filter(i => marketMid(i) > 0);
  const buyBoth = both.reduce((s, i) => s + Number(i.purchase_price), 0);
  const diff = both.reduce((s, i) => s + marketMid(i), 0) - buyBoth;
  const scored = a.filter(i => bestScore(i));
  const avgSc = scored.length ? (scored.reduce((s, i) => s + bestScore(i), 0) / scored.length).toFixed(1) : '—';
  const withAbv = a.filter(i => Number(i.abv));
  const avgAbv = withAbv.length ? (withAbv.reduce((s, i) => s + Number(i.abv), 0) / withAbv.length).toFixed(1) : '—';
  const cnt = k => {
    const m = {};
    a.forEach(i => { const v = (i[k] || '').trim(); if (v) m[v] = (m[v] || 0) + 1; });
    return Object.entries(m).sort((x, y) => y[1] - x[1]);
  };
  const bars = arr => {
    const mx = arr[0] ? arr[0][1] : 1;
    return arr.slice(0, 6).map(([k, v]) =>
      `<div class="bar"><span class="nm">${esc(k)}</span>
       <span class="tr"><i style="width:${v / mx * 100}%"></i></span><span class="n">${v}</span></div>`).join('')
      || '<span class="hint">데이터 없음</span>';
  };
  const flavBars = () => {
    const m = {};
    a.forEach(i => String(i.flavors || '').split(',').filter(Boolean)
      .forEach(f => m[f] = (m[f] || 0) + 1));
    return bars(Object.entries(m).sort((x, y) => y[1] - x[1]));
  };

  /* 경험 술장 — 사지 않은 병이라 구매가·잔량·개봉일이 없다. 같은 KPI 격자를 대상만
     바꿔 보여 주면 열두 칸 중 여덟이 0원과 대시가 되고, 그 화면은 "통계가 고장났다"로
     읽힌다. 그래서 이 술장에만 있는 질문으로 바꾼다 — 그중에 뭘 살까. */
  if (tab === 'exp'){
    const bc = buyCandidates(a);
    const sess = a.reduce((s, i) => s + (i.sessions?.length || 0), 0);
    const scored2 = a.filter(i => bestScore(i));
    return `
      <div class="kpis">
        <div class="kpi"><div class="k">마셔 본 병</div><div class="v">${n}<u>병</u></div>
          <div class="s">시음 기록 ${sess}회</div></div>
        <div class="kpi"><div class="k">구매 후보</div><div class="v">${bc.list.length}<u>병</u></div>
          <div class="s">${bc.hidden ? `이미 구입 ${bc.hidden}병 제외` : '아직 사지 않은 것'}</div></div>
        <div class="kpi"><div class="k">평균 평점</div><div class="v">${
          scored2.length ? (scored2.reduce((s, i) => s + bestScore(i), 0) / scored2.length).toFixed(1) : '—'}</div>
          <div class="s">${scored2.length}병 기준</div></div>
        <div class="kpi"><div class="k">증류소</div><div class="v">${
          new Set(a.map(i => i.distillery).filter(Boolean)).size}<u>곳</u></div>
          <div class="s">마셔 본 증류소</div></div>
      </div>
      <h4 class="sec">구매 후보 — 평점순</h4>
      ${bc.list.length ? `<div class="rlist">${bc.list.slice(0, 10).map(it =>
        `<div><b>${esc(fullName(it))}</b><span>${bestScore(it) || '—'}</span></div>`).join('')}</div>`
        /* 비어 있는 이유가 두 가지다 — 기록이 없거나, 이미 다 샀거나.
           한 문구로 뭉개면 "평점을 넣으라"고 엉뚱한 말을 하게 된다 */
        : `<span class="hint">${bc.hidden
            ? '마셔 본 병을 이미 다 구입했습니다'
            : '마셔 본 병을 기록하면 살 만한 순서로 정리됩니다'}</span>`}
      <h4 class="sec">마셔 본 곳</h4><div class="bars">${bars(placeCounts(a))}</div>
      <h4 class="sec">맛 프로필</h4><div class="bars">${flavBars()}</div>
      <div class="note" style="margin-top:18px"><b>구매 후보</b>는 마셔 봤고 아직 사지 않은 병입니다.
        같은 이름으로 구매한 기록이 있으면 목록에서 빠집니다.</div>`;
  }

  /* 위시 술장 — 아직 안 산 것이므로 유일하게 의미 있는 돈은 **앞으로 쓸 돈**이다 */
  if (tab === 'wish'){
    const ws = wishSpend(a);
    const withAbv2 = a.filter(i => Number(i.abv));
    return `
      <div class="kpis">
        <div class="kpi"><div class="k">위시</div><div class="v">${n}<u>병</u></div>
          <div class="s">아직 사지 않은 병</div></div>
        <div class="kpi"><div class="k">예상 지출</div><div class="v">${wonShort(ws.sum) || 0}<u>원</u></div>
          <div class="s">시장가 있는 ${ws.n}병 합산${ws.miss ? ` · ${ws.miss}병 미기재` : ''}</div></div>
        <div class="kpi"><div class="k">평균 예상가</div><div class="v">${
          ws.n ? wonShort(Math.round(ws.sum / ws.n)) : 0}<u>원</u></div>
          <div class="s">${ws.n}병 기준</div></div>
        <div class="kpi"><div class="k">가장 비싼 병</div><div class="v">${
          ws.top ? wonShort(marketMid(ws.top)) : '—'}${ws.top ? '<u>원</u>' : ''}</div>
          <div class="s">${ws.top ? esc(fullName(ws.top)) : '시장가를 넣으면 보입니다'}</div></div>
      </div>
      <h4 class="sec">주종별</h4><div class="bars">${bars(cnt('cat'))}</div>
      <h4 class="sec">타입별</h4><div class="bars">${bars(cnt('type'))}</div>
      <h4 class="sec">맛 프로필</h4><div class="bars">${flavBars()}</div>
      <div class="note" style="margin-top:18px"><b>예상 지출</b>은 시장가 중간값의 합입니다 —
        실제 구매가는 다를 수 있고, 시장가를 넣지 않은 병은 빠져 있습니다.</div>`;
  }

  return `
    <div class="kpis">
      <!-- '보유 병수' 였는데 대상이 OWNED(비움 포함)라 라벨이 틀렸다 — 다 마신 병을
           보유로 세고 있었다. 구매 술장의 정의가 "내가 산 모든 병" 이므로 이름을
           맞추고, 지금 실제로 갖고 있는 수는 부제에 한 줄 더 붙인다.
           KPI 타일을 늘리지 않고 두 수를 같이 읽게 하는 것이 목적이다. -->
      <div class="kpi"><div class="k">구매 병수</div>
        <div class="v">${a.filter(i => OWNED.includes(i.status)).length}<u>병</u></div>
        <div class="s">${OWNED.map(s => s + ' ' + a.filter(i => i.status === s).length).join(' · ')}
          <br>지금 보유 ${nowHeld(a).length}병
          ${a.filter(i => i.status === '경험').length ? ` · 유경험(미보유) ${a.filter(i => i.status === '경험').length}병` : ''}</div></div>
      <div class="kpi"><div class="k">총 구매액</div><div class="v">${wonShort(buy) || 0}<u>원</u></div>
        <div class="s">${priced.length}병 기재${n - priced.length ? ` · ${n - priced.length}병 미기재` : ''}</div></div>
      <div class="kpi"><div class="k">추정 시장가</div><div class="v">${wonShort(mkt) || 0}<u>원</u></div>
        <div class="s">시장가 중간값 합산</div></div>
      <div class="kpi"><div class="k">평가 손익</div>
        ${buyBoth ? `<div class="v ${diff >= 0 ? 'up' : 'dn'}">${diff >= 0 ? '+' : '−'}${wonShort(Math.abs(diff)) || 0}<u>원</u></div>
          <div class="s">${(diff / buyBoth * 100).toFixed(1)}% · 구매가+시장가 모두 있는 ${both.length}병 기준</div>`
          : `<div class="v">—</div><div class="s">시장가를 입력하면 계산됩니다</div>`}</div>
      <div class="kpi"><div class="k">평균 평점</div><div class="v">${avgSc}</div><div class="s">${scored.length}병 기준</div></div>
      <div class="kpi"><div class="k">평균 도수</div><div class="v">${avgAbv}${avgAbv === '—' ? '' : '<u>%</u>'}</div>
        <div class="s">${withAbv.length ? '최고 ' + Math.max(...withAbv.map(i => Number(i.abv))).toFixed(1) + '%' : '도수 미기재'}</div></div>
    </div>
    ${(() => {
      const open = a.filter(i => i.status === '오픈');
      const sess = a.reduce((s, i) => s + (i.sessions?.length || 0), 0);
      const dist = new Set(a.map(i => i.distillery).filter(Boolean)).size;
      const avg = priced.length ? Math.round(buy / priced.length) : 0;
      return `<div class="kpis" style="margin-top:10px">
        <div class="kpi"><div class="k">개봉 중</div><div class="v">${open.length}<u>병</u></div>
          <div class="s">${open.length ? '평균 잔량 ' + Math.round(open.reduce((s,i)=>s+(Number(i.remaining_pct)||0),0)/open.length) + '%' : '개봉한 병 없음'}</div></div>
        <div class="kpi"><div class="k">시음 기록</div><div class="v">${sess}<u>회</u></div>
          <div class="s">${a.filter(i=>i.sessions?.length).length}병에 기록</div></div>
        <div class="kpi"><div class="k">증류소 다양성</div><div class="v">${dist}<u>곳</u></div>
          <div class="s">${n ? (n / Math.max(dist,1)).toFixed(1) + '병/증류소' : ''}</div></div>
        <div class="kpi"><div class="k">평균 구매가</div><div class="v">${wonShort(avg) || 0}<u>원</u></div>
          <div class="s">${priced.length}병 기준</div></div>
      </div>`;
    })()}
    ${(() => {
      /* 연도별 구매 추이 */
      const m = {};
      priced.forEach(i => { const y = String(i.purchase_date || '').slice(0, 4);
        if (y.length === 4){ m[y] = m[y] || {n:0, sum:0}; m[y].n++; m[y].sum += Number(i.purchase_price); } });
      const ys = Object.keys(m).sort();
      if (!ys.length) return '';
      const mx = Math.max(...ys.map(y => m[y].sum));
      return `<h4 class="sec">연도별 구매</h4><div class="bars">${ys.map(y =>
        `<div class="bar"><span class="nm">${y}년 · ${m[y].n}병</span>
         <span class="tr"><i style="width:${m[y].sum / mx * 100}%"></i></span>
         <span class="n" style="width:52px">${wonShort(m[y].sum)}</span></div>`).join('')}</div>`;
    })()}
    <h4 class="sec">주종별</h4><div class="bars">${bars(cnt('cat'))}</div>
    <h4 class="sec">맛 프로필</h4><div class="bars">${(() => {
      const m = {};
      a.forEach(i => String(i.flavors || '').split(',').filter(Boolean)
        .forEach(f => m[f] = (m[f] || 0) + 1));
      const e = Object.entries(m).sort((x, y) => y[1] - x[1]);
      return bars(e);

/** 접힌 요약 한 줄. 그 술장에서 **가장 먼저 볼 수치 2~3개**만 담는다 —
    여기에 다 넣으려 하면 한 줄이 깨지고, 한 줄이 깨지면 목록이 밀린다.
    시트·사이드바와 같은 원본(같은 헬퍼)에서 뽑으므로 세 곳의 수가 어긋날 수 없다. */
function statsLine(a, tab){
  const bit = (k, v) => `${k} <b>${v}</b>`;
  const p = [bit('', a.length + '병').trim()];
  if (tab === 'wish'){
    const ws = wishSpend(a);
    if (ws.n) p.push(bit('예상 지출', wonShort(ws.sum)));
  } else if (tab === 'exp'){
    const bc = buyCandidates(a);
    p.push(bit('구매 후보', bc.list.length));
    const sess = a.reduce((s, i) => s + (i.sessions?.length || 0), 0);
    if (sess) p.push(bit('시음', sess + '회'));
  } else {
    const held = nowHeld(a), open = a.filter(i => i.status === '오픈');
    const buy = a.reduce((s, i) => s + (Number(i.purchase_price) || 0), 0);
    p.push(bit('지금 보유', held.length));
    if (buy) p.push(bit('구매', wonShort(buy)));
    if (open.length) p.push(bit('평균 잔량',
      Math.round(open.reduce((s, i) => s + (Number(i.remaining_pct) || 0), 0) / open.length) + '%'));
  }
  return p.join(' · ');
}
function openStats(){
  /* 보고 있는 술장의 통계를 낸다. 전체 술장 탭이 곧 '전체로 보기' 라 별도 토글은 없다 */
  const a = DB.items.filter(i => inTab(i, V.tab));
  const lab = (TABS.find(t => t[0] === V.tab) || [, ''])[1];
  openSheet(`${lab} 술장 통계 · ${a.length}병`, statsFor(a, V.tab),
    `<button class="btn pri" data-act="close">닫기</button>`);
  $('#shFoot').onclick = closeSheet;
}

      }catch(e){ rows.push(['토큰 유효성', '❌ 네트워크 오류 ' + esc(e.message)]); }
    }
    if (tk && SYNC.repo && tokenAscii(tk)){
      try{
        const r = await fetch('https://api.github.com/repos/' + SYNC.repo, {
          headers:{Authorization:'Bearer ' + tk, Accept:'application/vnd.github+json'}});
        const j = await r.json().catch(() => ({}));
        if (r.ok){
          rows.push(['저장소 접근', `✅ OK (${j.private ? 'Private' : 'Public'}, 기본 브랜치 ${esc(j.default_branch)})`]);
          if (j.default_branch && j.default_branch !== SYNC.branch)
            rows.push(['⚠ 브랜치 불일치', `기본 브랜치가 <b>${esc(j.default_branch)}</b> 입니다 — 위 브랜치 칸을 바꿔 주세요`]);
          if (!j.permissions?.push)
            rows.push(['⚠ 쓰기 권한 없음', '토큰 설정에서 <b>Permissions → Contents</b> 를 '
              + '<b>Read and write</b> 로 바꿔 주세요 (읽기만 되면 업로드가 실패합니다)']);
        } else if (r.status === 403){
          /* 토큰은 유효한데 이 저장소에 권한이 없는 상태 — 401 과 원인이 다르다 */
          rows.push(['저장소 접근', `❌ 403 — ${esc(j.message || '')}<br>
            <b>토큰은 유효하지만 이 저장소 권한이 없습니다.</b> 토큰 설정에서<br>
            ① <b>Repository access</b> → Only select repositories 에 <b>${esc(SYNC.repo.split('/')[1] || '')}</b> 가 선택되어 있는지<br>
            ② <b>Permissions → Contents</b> 가 <b>Read and write</b> 인지 확인하세요.`]);
        } else if (r.status === 404){
          rows.push(['저장소 접근', `❌ 404 — 저장소를 찾을 수 없습니다<br>
            이름 오타이거나, <b>토큰의 Repository access 목록에 이 저장소가 선택되지 않았습니다</b><br>
            (저장소를 토큰보다 나중에 만들었다면 토큰 설정에서 다시 선택해야 합니다)`]);
        } else {
          rows.push(['저장소 접근', `❌ HTTP ${r.status} — ${esc(j.message || '')}`]);
        }
      }catch(e){ rows.push(['저장소 접근', '❌ 네트워크 오류 ' + esc(e.message)]); }
      try{
        const got = await ghReadFile(SYNC.path);
        if (got.missing) rows.push(['원격 데이터 파일', '아직 없음 — 첫 동기화 때 생성됩니다']);
        else{
          const kb = Math.round((got.size || got.text.length) / 1024);
          const how = got.via === 'raw' ? ' · raw 경로로 읽음(1MB 초과)' : '';
          if (!got.text){
            rows.push(['원격 데이터 파일', `❌ 본문을 읽지 못했습니다 (${kb}KB, encoding=${esc(got.encoding)}`
              + (got.rawStatus ? `, raw HTTP ${got.rawStatus}` : '') + ')']);
          } else {
            try{
              const rem = JSON.parse(got.text);
              if (Array.isArray(rem.items)){
                rows.push(['원격 데이터 파일', `✅ ${rem.items.length}병 · ${kb}KB${how}`
                  + ` · 갱신 ${esc(String(rem._updated || '?').slice(0, 19))}`]);
                if (rem.items.length > DB.items.length)
                  rows.push(['⚠ 주의', `원격이 이 기기(${DB.items.length}병)보다 많습니다(${rem.items.length}병). `
                    + '동기화하면 합쳐지며, <b>덮어쓰기는 누르지 마세요.</b>']);
              } else {
                /* JSON 이지만 우리 형식이 아닌 경우 — 무엇이 들었는지 보여준다 */
                rows.push(['원격 데이터 파일',
                  `⚠ items 배열이 없습니다 (${kb}KB${how})<br>`
                  + `최상위 키: <b>${esc(Object.keys(rem).slice(0, 8).join(', ') || '(없음)')}</b><br>`
                  + `<span style="color:var(--ink3)">앞 160자:</span> ${esc(got.text.slice(0, 160))}`]);
                rows.push(['조치', '경로가 다른 파일을 가리키는지 확인하세요. 내용이 우리 형식이 아니면 '
                  + '아래 <b>원격 덮어쓰기</b>로 이 기기 데이터를 올릴 수 있습니다 '
                  + '(이 기기가 최신일 때만 누르세요).']);
                rows.push(['복구', `<button class="mini am" id="syForce">원격 덮어쓰기 (이 기기 ${DB.items.length}병 → 원격)</button>`]);
              }
            }catch(e2){
              rows.push(['원격 데이터 파일',
                `❌ JSON 파싱 실패 (${kb}KB${how})<br>파일이 손상되었습니다. 아래 <b>원격 덮어쓰기</b>로 `
                + `이 기기의 ${DB.items.length}병으로 복구할 수 있습니다.<br>`
                + `<span style="color:var(--danger)">앞 120자:</span> ${esc(got.text.slice(0, 120))}`]);
              rows.push(['복구', `<button class="mini am" id="syForce">원격 덮어쓰기 (이 기기 → 원격)</button>`]);
            }
          }
        }
      }catch(e){ rows.push(['원격 데이터 파일', '❌ ' + esc(e.message)]); }
    }
    rows.push(['이 기기', `${DB.items.length}병 · 마지막 동기화 ${ago(SYNC.last)}`]);
    if (SYNC.err) rows.push(['마지막 오류', esc(SYNC.err)]);
    box.innerHTML = `<table class="spec" style="margin-top:12px">${
      rows.map(([k, v]) => `<tr><th>${k}</th><td>${v}</td></tr>`).join('')}</table>`;
    /* 원격 파일이 손상된 경우의 복구 — 이 기기 내용으로 강제 덮어쓴다 */
    const fb = $('#syForce');
    if (fb) fb.onclick = async () => {
      /* 갓 시드된 상태(예시 데이터만)로 원격을 밀어버리면 다른 기기의 기록이 날아간다 */
      const onlySeed = DB.items.every(i => String(i.tags || '').includes('예시'));
      if (onlySeed && !confirm(`⚠ 이 기기에는 예시 데이터 ${DB.items.length}병만 있습니다.\n`
        + '이대로 덮어쓰면 다른 기기의 기록이 사라질 수 있습니다.\n'
        + '정말 이 기기가 최신인가요?')) return;
      if (!confirm(`원격 파일을 이 기기의 ${DB.items.length}병으로 덮어씁니다.\n`
        + '다른 기기에만 있던 항목은 사라질 수 있습니다. 계속할까요?')) return;
      fb.disabled = true; fb.textContent = '덮어쓰는 중…';
      try{
        const cur = await ghReadFile(SYNC.path);
        const put = await gh(SYNC.path, {method:'PUT', body: JSON.stringify({
          message: '손상된 원격 파일 복구 (' + DB.items.length + '병)',
          content: b64enc(snapshot()), branch: SYNC.branch,
          ...(cur.missing ? {} : {sha: cur.sha}),
        })});
        SYNC.sha = put.content?.sha || ''; SYNC.err = ''; SYNC.last = nowISO(); saveSync();
        syncBadge('ok'); toast('원격 파일을 복구했습니다'); openData();
      }catch(e){ fb.disabled = false; fb.textContent = '다시 시도'; toast('복구 실패 — ' + String(e.message).slice(0, 50)); }
    };
  };
  if ($('#syTokDel')) $('#syTokDel').onclick = () => {
    try{ localStorage.removeItem(LS_TOK); }catch(e){}
    SYNC.err = ''; saveSync(); openData(); toast('토큰을 지웠습니다 — 새로 입력하세요');
  };
  if ($('#syOff')) $('#syOff').onclick = () => {
    if (!confirm('이 기기에서 동기화 연결을 해제할까요?\n저장된 데이터와 원격 파일은 지워지지 않습니다.')) return;
    try{ localStorage.removeItem(LS_TOK); }catch(e){}
    SYNC = {repo:'', path:'collection.json', branch:'main', sha:'', last:''};
    saveSync(); openData(); toast('연결을 해제했습니다');
  };
  /* ── AI 초안 설정 ── */
  $('#aiSave').onclick = () => {
    const k = $('#aiK').value.trim(), m = $('#aiM').value.trim() || AI_MODEL_DEFAULT;
    /* ⚠ 키 형태를 정규식으로 막지 않는다. 한때 `AIza…` 만 통과시켰는데
       **AI Studio 가 발급하는 `AQ.…` 형태의 실제 키를 막았다.** 발급 형태는 바뀐다 —
       내가 아는 형태로 걸러내면 새 형태를 쓰는 사용자가 이유도 모르고 막힌다.
       유효성은 **API 응답이 판정한다**(연결 확인 버튼이 그 일을 한다).
       공백·한글만 걸러 요청 자체가 깨지는 것을 막는다. */
    if (k && !tokenAscii(k)){
      toast('⚠ 키에 공백이나 한글이 섞여 있습니다 — 다시 복사해 붙여넣어 주세요', 5000);
      return;
    }
    try{
      /* 빈 칸이면 기존 키를 지우지 않는다 — 모델만 바꾸려는 경우가 있다 */
      if (k) localStorage.setItem(LS_AIKEY, k);
      localStorage.setItem(LS_AIMODEL, m);
    }catch(e){ toast('⚠ 저장 실패'); return; }
    /* 저장은 하되 의심스러우면 바로 말해 준다 — 연결 확인까지 가서야 알게 되면
       사용자는 무엇이 잘못됐는지 모른 채 한 번 더 헤맨다 */
    if (k && /^gen-lang-client-/.test(k))
      toast('⚠ 프로젝트 이름을 넣으신 것 같습니다 — AI Studio 목록에서 API 키 쪽을 복사하세요', 7000);
    else if (k && k.length < 30)
      toast(`⚠ ${k.length}자입니다 — API 키는 보통 39자 이상입니다. 다시 확인해 주세요`, 6000);
    else toast(aiOn() ? 'AI 초안을 켰습니다' : '모델을 저장했습니다');
    openData();
  };
  if ($('#aiKDel')) $('#aiKDel').onclick = () => {
    try{ localStorage.removeItem(LS_AIKEY); }catch(e){}
    openData(); toast('API 키를 지웠습니다 — AI 초안이 꺼졌습니다');
  };
  $('#aiTest').onclick = async () => {
    const box = $('#aiTestOut'), b = $('#aiTest');
    const line = (t, ok) => box.innerHTML = `<p class="hint" style="margin-top:10px;color:${
      ok ? 'var(--accent)' : 'var(--danger)'}">${t}</p>`;
    if (!aiKey()){ line('먼저 API 키를 저장하세요', false); return; }
    b.disabled = true; box.innerHTML = '<p class="hint" style="margin-top:10px"><span class="spin"></span> 확인 중…</p>';
    try{
      /* 실제 초안 호출과 같은 경로로 확인한다 — 따로 만든 확인은 통과해도 증명이 안 된다 */
      const r = await aiFill('Glenfiddich 12 Year Old', ['distillery','country','region']);
      const got = [...r.keys];
      line(got.length
        ? `연결 정상 — 시험 응답에서 ${got.length}개 항목을 받았습니다 (${esc(got.join(', '))})`
        : '연결은 됐지만 값이 비어 왔습니다 — 모델 이름을 확인하세요', got.length > 0);
    }catch(e){ line('실패 — ' + esc(String(e.message).slice(0, 300)), false); }
    b.disabled = false;
  };

  $('#impFile').onclick = () => $('#impInput').click();
  $('#impInput').onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    const fr = new FileReader();
    fr.onload = () => importText(String(fr.result));
    fr.readAsText(file, 'utf-8');
  };
  $('#impSeed').onclick = async () => {
    try{
      const r = await fetch('./whisky.json', {cache:'no-cache'});
      if (!r.ok) throw 0;
      importText(await r.text());
    }catch(e){ toast('whisky.json을 읽을 수 없습니다'); }
  };
  $('#impGo').onclick = () => importText($('#impText').value);
  $('#expJson').onclick = () => download(`whisky-backup-${today()}.json`, JSON.stringify(DB, null, 1), 'application/json');
  $('#expCsv').onclick = () => download(`whisky-${today()}.csv`, fullCSV(DB.items), 'text/csv');
  $('#expQuick').onclick = () => copy(DB.items.map(quickCSV).join('\r\n'));
  $('#normAll').onclick = async () => {
    const targets = DB.items.filter(i => !i.image_norm && (i.image_url || i.image_data));
    if (!targets.length && !DB.items.some(needsRetrofit)) return toast('맞출 대상이 없습니다');
    const b = $('#normAll'); b.disabled = true; b.textContent = '맞추는 중…';
    /* 옛 규격 재맞춤이 먼저다 — 뒤에 오는 normalizeMissing 이 새 규격으로 채운다 */
    const fixed = await retrofitThumbs({progress: true});
    const ok = targets.length ? await normalizeMissing(targets, {progress: true}) : 0;
    openData();
    if (!ok && !fixed) toast('출처 제한으로 맞출 수 없었습니다 — 원본을 그대로 표시합니다');
  };
  /* 저장소 보호 상태 — 비동기라 시트를 그린 뒤 채운다.
     보호되지 않는 상태를 조용히 두면 안 된다: 이 앱의 데이터는 서버에 없다. */
  (async () => {
    const line = $('#persistLine'); if (!line) return;
    const ok = await askPersist(), inf = await storageInfo();
    const cap = inf && inf.quota ? ` · 한도 ${(inf.quota / 1048576).toFixed(0)}MB` : '';
    line.innerHTML = ok === true
      ? `<br>저장소 보호 <b style="color:var(--ok)">켜짐</b> — 공간 부족으로 지워지지 않습니다${cap}`
      : ok === false
      ? `<br>저장소 보호 <b style="color:var(--warn)">꺼짐</b> — <b>앱으로 설치하면</b> 보호가 켜집니다${cap}`
      : `<br>이 브라우저는 저장소 보호를 지원하지 않습니다 — JSON 백업을 더 자주 받으세요${cap}`;
  })();
  $('#btnTheme').onclick = () => { setTheme(dark ? 'light' : 'dark'); openData(); };
  $('#btnDonate2').onclick = openDonate;
  $('#btnIntro').onclick = () => openIntro(0);
  $('#btnInstall').onclick = openInstall;
  $('#rmExamples').onclick = () => {
    const kill = DB.items.filter(i => String(i.tags || '').split(',').map(s => s.trim()).includes('예시'));
    DB.items = DB.items.filter(i => !kill.includes(i));
    tomb(kill);
    save(); render(); openData(); toast(`예시 ${kill.length}병을 삭제했습니다`);
  };
  $('#wipe').onclick = openWipe;
  const rb = $('#restoreTrash');
  if (rb) rb.onclick = restoreTrash;
}
/* ══════════════════════════════════════════
   전체 초기화 — 되돌릴 수 없는 작업이므로 4중 안전장치
   ① 영향 범위 명시(병수·구매합계·동기화 여부)
   ② 백업 내려받기 강제(또는 명시적 포기 체크)
   ③ '초기화' 단어 직접 입력
   ④ 삭제 후 14일간 되돌리기 스냅샷 보관
   ══════════════════════════════════════════ */
const trashInfo = () => {
  try{
    const t = JSON.parse(localStorage.getItem(LS_TRASH) || 'null');
    if (!t || !t.at) return null;
    const days = (Date.now() - new Date(t.at)) / 86400000;
    if (days > TRASH_DAYS) return null;
    return {at: t.at, days: Math.floor(days), n: t.n || 0};
  }catch(e){ return null; }
};
function openWipe(){
  const n = DB.items.length;
  const buy = DB.items.reduce((s, i) => s + (Number(i.purchase_price) || 0), 0);
  const photos = DB.items.filter(i => (i.images && i.images.length) || i.image_norm).length;
  openSheet('전체 초기화', `
    <div class="note dgr">
      <b style="color:var(--danger)">되돌리기 어려운 작업입니다.</b><br>
      이 기기의 <b>${n}병</b>${buy ? ` · 구매 합계 <b>${wonShort(buy)}원</b>` : ''}${photos ? ` · 사진 ${photos}장` : ''} 기록이 모두 삭제됩니다.
      ${syncOn() ? `<br><b style="color:var(--danger)">동기화가 연결되어 있어 폰·PC 등 다른 기기에서도 함께 삭제됩니다.</b>` : ''}
    </div>
    <h4 class="sec">1단계 · 백업</h4>
    <div class="stack">
      <button class="btn" id="wpBackup">백업 파일 내려받기 (권장)</button>
    </div>
    <label class="hint" style="display:flex;gap:7px;align-items:center;margin-top:9px;cursor:pointer">
      <input type="checkbox" id="wpNoBackup"> 백업 없이 진행합니다 (복구 불가를 이해합니다)
    </label>
    <h4 class="sec">2단계 · 확인 입력</h4>
    <div class="f wide">
      <label>아래 칸에 <b>초기화</b> 를 그대로 입력하세요</label>
      <input id="wpWord" placeholder="초기화" autocomplete="off" autocapitalize="off">
    </div>
    <p class="hint" id="wpHint" style="margin-top:10px">두 단계를 모두 마치면 삭제 버튼이 활성화됩니다.</p>
    <p class="hint">삭제 후 <b>${TRASH_DAYS}일간</b> 이 기기에서 되돌리기가 가능합니다
      (⚙️ 하단의 <b>초기화 되돌리기</b>).</p>`,
    `<button class="btn" data-act="cancel">취소</button>
     <button class="btn dgr" id="wpGo" style="flex:1;width:auto" disabled>영구 삭제</button>`);

  let backedUp = false;
  const sync = () => {
    const ok = (backedUp || $('#wpNoBackup').checked) && $('#wpWord').value.trim() === '초기화';
    $('#wpGo').disabled = !ok;
    $('#wpHint').innerHTML = ok
      ? '<b style="color:var(--danger)">삭제 버튼이 활성화되었습니다.</b>'
      : (!(backedUp || $('#wpNoBackup').checked)
          ? '1단계: 백업을 받거나 "백업 없이 진행"을 선택하세요.'
          : '2단계: <b>초기화</b> 를 정확히 입력하세요.');
  };
  $('#wpBackup').onclick = () => {
    download(`whisky-backup-${today()}.json`, JSON.stringify(DB, null, 1), 'application/json');
    backedUp = true; $('#wpBackup').textContent = '✅ 백업을 내려받았습니다'; sync();
  };
  $('#wpNoBackup').onchange = sync;
  $('#wpWord').oninput = sync;
  $('#shFoot').onclick = e => {
    if (e.target.closest('[data-act=cancel]')) return openData();
    if (e.target.id !== 'wpGo' || $('#wpGo').disabled) return;
    const gone = DB.items;
    const snap = JSON.stringify({items: gone, meta: DB.meta});
    DB = {items: [], meta: {}}; tomb(gone);
    save(); render();
    /* 저장소를 비운 뒤에 스냅샷을 넣어 용량 초과를 피한다 */
    try{ localStorage.setItem(LS_TRASH, JSON.stringify({at: nowISO(), n: gone.length, data: snap})); }

function restoreTrash(){
  const t = trashInfo();
  if (!t) return toast('되돌릴 스냅샷이 없습니다');
  if (!confirm(`${t.n}병을 되돌립니다 (삭제 ${t.days}일 전).\n현재 기록과 합쳐집니다. 계속할까요?`)) return;
  let old = null;
  try{ old = JSON.parse(JSON.parse(localStorage.getItem(LS_TRASH)).data); }catch(e){}
  if (!old || !Array.isArray(old.items)) return toast('스냅샷을 읽을 수 없습니다');
  const now = nowISO();
  const map = new Map(DB.items.map(i => [i.id, i]));
  for (const raw of old.items){
    const it = normalize(raw);
    /* 삭제 기록보다 나중 시각으로 되살려야 동기화가 다시 지우지 않는다 */
    it.updated_at = now;
    map.set(it.id, it);
    if (DB.meta.tombs) delete DB.meta.tombs[it.id];
  }
  DB.items = [...map.values()];
  save(); render();
  try{ localStorage.removeItem(LS_TRASH); }catch(e){}
  openData(); toast(`${old.items.length}병을 되돌렸습니다`);
}

/** 규격이 맞춰지지 않은 썸네일을 정규화. 대상 목록을 직접 받아 뒤에 남기지 않는다. */
async function normalizeMissing(list, opt){
  if (!navigator.onLine) return 0;
  const t = (list || DB.items).filter(i => !i.image_norm && (i.image_url || i.image_data));
  if (!t.length) return 0;
  const talk = opt?.progress && t.length > 3;
  let ok = 0;
  for (let i = 0; i < t.length; i++){
    if (talk) toast(`썸네일 규격 맞추는 중… ${i + 1}/${t.length}`);
    const n = await normalizeThumb(t[i].image_url || t[i].image_data);
    if (n){ t[i].image_norm = n; t[i].images = [n]; t[i].image_data = ''; t[i].thumb_ar = THUMB_FIT; ok++; }
  }
  if (ok){ save(); render(); }
  if (talk) toast(`썸네일 ${ok}장 정리 완료${t.length - ok ? ` · ${t.length - ok}장은 출처 제한` : ''}`);
  return ok;
}
/* 부팅은 시작을 늦추지 않도록 8장만 (나머지는 가져오기 직후·설정에서 일괄 처리) */
const autoNormalize = () => normalizeMissing(DB.items.slice(0, 8));

const needsRetrofit = it => it.thumb_ar !== THUMB_FIT && !!(it.image_norm || it.images?.length);
/** 저장 규격 이관 (4:5 → 3:4).
    이미 저장된 썸네일 자체를 원본으로 삼는다 — 네트워크가 필요 없고, 원격 원본을
    다시 받는 것보다 확실하다. noCrop 이라 어떤 사진도 잘려 나가지 않는다:
    3:4 에 가로가 넘치면 폭 기준으로 줄여 위아래를 여백(box.fill)으로 남긴다.
    실패한 장은 기존 것을 그대로 두어 사진을 잃지 않는다.

    updated_at 은 일부러 올리지 않는다. 파생 데이터 갱신일 뿐인데 시각을 올리면
    mergeSnapshot 이 이 항목을 '더 새것'으로 보고 다른 기기의 최근 편집을 덮어쓴다.
    대신 표식(thumb_ar)이 없는 항목을 매번 찾으므로, 동기화가 옛 썸네일을
    되돌려도 다음 부팅에 스스로 복구된다. */
async function retrofitThumbs(opt){
  const t = DB.items.filter(needsRetrofit);
  if (!t.length) return 0;
  const talk = opt?.progress && t.length > 3;
  let ok = 0, keep = 0, done = 0;
  for (const it of t){
    const src = it.images?.length ? it.images : [it.image_norm];
    const out = [];
    for (let k = 0; k < src.length; k++){
      const n = await normalizeThumb(src[k], k ? EXTRA_W : THUMB_W, k ? EXTRA_H : THUMB_H,
        {noCrop: true, q: 0.86});     // 재인코딩 손실을 줄이려 품질을 조금 올린다
      if (n){ out.push(n); ok++; } else { out.push(src[k]); keep++; }
    }
    it.images = out.filter(Boolean);
    it.image_norm = it.images[0] || '';
    it.thumb_ar = THUMB_FIT;
    /* 중간에 끊겨도 진행분이 남도록 나눠 저장한다 */
    if (++done % 8 === 0){
      save();
      if (talk) toast(`썸네일 ${THUMB_AR} 규격으로 맞추는 중… ${done}/${t.length}`);
    }
  }
  save(); render();
  if (talk) toast(`썸네일 ${ok}장을 3:4 로 맞췄습니다${keep ? ` · ${keep}장은 기존 유지` : ''}`);
  return ok;
}

/** 인앱 브라우저인가 — 카카오톡·네이버 등에서 링크를 열면 여기로 들어온다.
    이 안에서는 설치가 **아예 불가능하다**: Android 는 beforeinstallprompt 가
    발생하지 않고, iOS 는 공유 시트에 '홈 화면에 추가'가 없다.
    블로그·카톡으로 공유하는 앱이므로 이 경우가 실제로 가장 흔하다. */
function inApp(){
  const u = navigator.userAgent;
  if (/KAKAOTALK/i.test(u))            return '카카오톡';
  if (/NAVER\(inapp|NAVER /i.test(u))  return '네이버 앱';
  if (/Instagram/i.test(u))            return '인스타그램';
  if (/FBAN|FBAV/i.test(u))            return '페이스북';
  if (/Line\//i.test(u))               return '라인';

}

  try{
    if (!navigator.storage?.estimate) return null;
    const {usage, quota} = await navigator.storage.estimate();
    return {usage, quota};
  }catch(e){ return null; }
}
askPersist();

/* 인앱 브라우저 배너 — 카카오톡·블로그 링크로 들어온 사람이 가장 먼저 만나는 화면.
   그 안에서는 설치가 불가능하므로 기본 브라우저로 나가는 길을 여기서 준다.
   닫으면 그 세션에서는 다시 띄우지 않는다(플래그를 영속화하면 기기를 바꿔
   들어온 사람에게 두 번째 기회가 없다). */
(() => {
  const app = inApp();
  if (!app || isInstalled()) return;
  const bar = $('#inappBar'); if (!bar) return;
  const url = location.href.split('#')[0];
  const intent = 'intent://' + url.replace(/^https?:\/\//, '')
    + '#Intent;scheme=https;package=com.android.chrome;end';
  bar.innerHTML = `<span class="txt"><b>${esc(app)} 안에서는 앱으로 설치할 수 없습니다.</b>
      ${isIOS() ? 'Safari로 열면 홈 화면에 추가할 수 있습니다.'
                : '크롬으로 열면 버튼 한 번으로 설치됩니다.'}</span>
    ${isIOS() ? `<button class="go" id="iaHow">방법 보기</button>`
              : `<a class="go" href="${esc(intent)}">크롬으로 열기</a>`}
    <button class="x" id="iaX" aria-label="닫기">✕</button>`;
  bar.hidden = false;
  const how = $('#iaHow'); if (how) how.onclick = openInstall;
  $('#iaX').onclick = () => { bar.hidden = true; };
})();

if ('serviceWorker' in navigator && location.protocol.startsWith('http'))
  addEventListener('load', async () => {
    try{
      const reg = await navigator.serviceWorker.register('./sw.js');
      /* 새 버전 알림 — 코드가 network-first 라 다음 실행에 자동 반영되지만,
         사용자가 그 사실을 모르면 옛 화면을 보고 있다고 오해한다.
         이미 워커가 붙어 있을 때(=재방문)만 알린다. 첫 설치는 알릴 것이 없다. */
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing || reg.waiting;
        if (!nw || !navigator.serviceWorker.controller) return;
        nw.addEventListener('statechange', () => {
          if (nw.state === 'installed') toast('새 버전이 준비됐습니다 — 새로고침하면 적용됩니다', 6000);
        });
      });
    }catch(e){}
  });
</script>
