/* ── 시음 기록 ────────────────────────────── */
const dayssince = d => {
  if (!d) return '';
  const n = Math.floor((Date.now() - new Date(d + 'T00:00:00')) / 86400000);
  return n <= 0 ? '오늘' : n === 1 ? '어제' : n < 30 ? n + '일 경과'
    : n < 365 ? Math.floor(n / 30) + '개월 경과' : (n / 365).toFixed(1) + '년 경과';
};
/** 이미지 출처 표기.
    위키미디어 사진은 CC BY-SA 등 라이선스가 있어 **출처와 파일을 밝혀야 한다.**
    이름만 적어 두면 저작자를 찾아갈 수 없으므로 Commons 파일 페이지로 링크한다.
    직접 촬영한 사진은 이용자 본인 것이므로 표기하지 않는다. */
function creditHTML(it){
  if (!it.image_credit) return '';
  const c = String(it.image_credit);
  /* "Wikimedia Commons — <파일명>" 형태에서 파일명을 꺼내 파일 페이지를 만든다 */
  const m = c.match(/—\s*(.+\.(?:jpe?g|png|webp|gif))\s*$/i);
  const url = m ? 'https://commons.wikimedia.org/wiki/File:' + encodeURIComponent(m[1].replace(/ /g, '_'))
    : (/^https?:\/\//.test(c) ? c : '');
  return `<p class="credit">이미지 출처: ${url
      ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(c)}</a>`
      : esc(c)}${m ? ' · 각 파일의 라이선스(CC BY-SA 등)를 따릅니다' : ''}</p>`;
}
/** 며칠 전인지 — 시음 기록은 '언제'보다 '얼마나 지났나'가 더 잘 읽힌다 */
function daysAgo(d){
  if (!d) return '';
  const n = Math.round((new Date(today()) - new Date(d)) / 86400000);
  return n <= 0 ? '오늘' : n === 1 ? '어제' : n < 30 ? n + '일 전'
    : n < 365 ? Math.round(n / 30) + '개월 전' : (n / 365).toFixed(1) + '년 전';
}
/** 시음 기록 타임라인.
    같은 병을 여러 번 마신 기록이 쌓이면 '점수가 어떻게 변했는지'가 이 화면의 값이다.
    그래서 최신순으로 세로 레일에 걸고, 직전 기록과의 점수 차이를 함께 보여 준다.
    개봉일이 있으면 '개봉 N일 후'를 붙여 산화 흐름을 읽을 수 있게 한다. */
function sessionsHTML(it){
  if (!it.sessions.length)
    return `<p class="hint">아직 시음 기록이 없습니다 — 마신 날의 인상을 남겨 두면 나중에 비교하기 좋습니다.</p>`;
  const sorted = [...it.sessions].sort((a, b) => (b.at || '').localeCompare(a.at || ''));
  /* 점수 변화는 시간순(오래된 것부터)으로 계산해야 방향이 맞다 */
  const older = [...sorted].reverse();
  const delta = {};
  let prev = null;
  older.forEach(s => {
    const v = Number(s.score);
    if (!isNaN(v) && s.score !== '' && s.score != null){
      if (prev !== null) delta[s.at + '|' + (s.note || '').slice(0, 12)] = +(v - prev).toFixed(1);
      prev = v;
    }
  });
  return `<div class="tline">${sorted.map(s => {
    const key = s.at + '|' + (s.note || '').slice(0, 12);
    const d = delta[key];
    const since = it.opened_at && s.at && s.at >= it.opened_at
      ? Math.round((new Date(s.at) - new Date(it.opened_at)) / 86400000) : null;
    return `<div class="sitem">
      <div class="sh">
        <b>${esc(s.at || '')}</b>
        <span class="sago">${esc(daysAgo(s.at))}</span>
        ${s.score ? `<span class="sc">${esc(s.score)}</span>` : ''}
        ${d != null && d !== 0
          ? `<span class="sdel2 ${d > 0 ? 'up' : 'dn'}" title="직전 기록 대비">${d > 0 ? '▲' : '▼'}${Math.abs(d)}</span>`
          : ''}
        <button class="sdel" data-sdel="${esc(key)}" title="삭제">✕</button>
      </div>
      ${(s.place || s.mate || since !== null) ? `<div class="sm">${
        [s.place, s.mate, since !== null ? `개봉 ${since}일 후` : ''].filter(Boolean).map(esc).join(' · ')}</div>` : ''}
      ${s.note ? `<p>${esc(s.note)}</p>` : ''}
    </div>`;
  }).join('')}</div>`;
}

    <div class="tnote"><span class="lb">Nose · 향</span><p>${esc(it.nose) || '<span class="na">미기재</span>'}</p></div>

    const p = e.target.closest('[data-pour]');
    if (p){
      const ml = Number(p.dataset.pour);
      const size = Number(it.size_ml) || 700;
      const cur = Number(it.remaining_pct) || 0;
      const next = Math.max(0, Math.round((cur - ml / size * 100) * 10) / 10);
      it.remaining_pct = String(next);
      if (next <= 0){ it.status = '비움'; it.remaining_pct = '0'; }
      it.updated_at = nowISO();
      save(); render(); openDetail(it.id);

function openSession(id){
  const it = byId(id); if (!it) return;
  openSheet('시음 기록 · ' + fullName(it), `

      <div class="f wide"><label>인상 · 메모</label>

    </div>
    <label class="hint" style="display:flex;gap:7px;align-items:center;margin-top:11px;cursor:pointer">

    </label>
    <p class="hint">점수를 넣으면 <b>가장 최근 기록의 점수</b>가 목록의 평점으로 표시됩니다.</p>`,
    `<button class="btn" data-act="cancel">취소</button>

  $('#shFoot').onclick = e => {
    const a = e.target.closest('[data-act]'); if (!a) return;
    if (a.dataset.act === 'cancel') return openDetail(it.id);
    const s = {
      at: $('#ssAt').value || today(),
      score: $('#ssScore').value.trim(),
      place: $('#ssPlace').value.trim(),
      mate: $('#ssMate').value.trim(),
      note: $('#ssNote').value.trim(),
    };
    if (!s.score && !s.note && !s.place){ toast('점수·메모·장소 중 하나는 입력해 주세요'); return; }
    it.sessions.push(s);
    /* 최근 기록의 점수를 내 점수로 반영 */
    const latest = [...it.sessions].sort((x, y) => (y.at || '').localeCompare(x.at || ''))
      .find(x => x.score);
    if (latest) it.rating_my = latest.score;
    /* 미개봉이었다면 자동 개봉 처리 */
    if (it.status === '미개봉'){ it.status = '오픈'; it.opened_at = it.opened_at || s.at; it.remaining_pct = '100'; }

      const next = Math.max(0, Math.round((Number(it.remaining_pct) || 0) - 30 / size * 100));
      it.remaining_pct = String(next);
      if (next <= 0){ it.status = '비움'; it.remaining_pct = '0'; }
    }
    it.updated_at = nowISO();
    save(); render(); openDetail(it.id); toast('시음 기록을 저장했습니다');
  };
}

];
let introAt = 0;
function openIntro(step){
  /* 열리는 순간 '봤음'으로 남긴다 — X 나 뒤로가기로 닫아도 다시 뜨지 않는다.
     실수로 닫았을 때는 설정 → 시작 안내 다시 보기 로 들어온다. */
  introSeen();
  introAt = Math.max(0, Math.min(INTRO.length - 1, step || 0));
  const s = INTRO[introAt], last = introAt === INTRO.length - 1;
  const onlySeed = DB.items.length && DB.items.every(i => String(i.tags || '').includes('예시'));
  openSheet('술술다이어리 시작하기', `
    <div class="intro">
      <div class="idots">${INTRO.map((_, i) =>
        `<i class="${i === introAt ? 'on' : ''}"></i>`).join('')}</div>
      <h3 class="it">${s.t}</h3>
      <p class="id">${s.d}</p>
      <div class="note">${s.n}</div>
      ${last && onlySeed ? `<p class="hint">지금 보이는 ${DB.items.length}병은 <b>예시</b>입니다.
        설정에서 <b>예시 데이터 삭제</b>로 한 번에 지울 수 있습니다.</p>` : ''}
      ${last ? `<a class="ilink" href="${BLOG_GUIDE}" target="_blank" rel="noopener">
        자세한 사용법 보기 (블로그)</a>` : ''}
    </div>`,
    `${introAt ? '<button class="btn" id="iPrev">이전</button>' : ''}
     <button class="btn ${last ? 'pri' : ''}" id="iNext">${
       last ? '첫 병 등록하기' : '다음'}</button>`);
  $('#iPrev') && ($('#iPrev').onclick = () => openIntro(introAt - 1));
  $('#iNext').onclick = () => {
    if (!last) return openIntro(introAt + 1);
    introSeen();
    closeSheet();
    /* 앱을 쓰게 만드는 것이 먼저다 — 블로그는 보조 링크로만 둔다 */
    setTimeout(openWizard, 260);
  };
}
const introSeen = () => { try{ localStorage.setItem(LS_INTRO, '1'); }catch(e){} };

/** 백업 재촉 — 서버가 없는 앱의 유일한 실패 모드가 '백업을 안 함' 이다.
    조건을 좁게 잡는다: 병이 5개 이상이고, 30일 넘게 내보내지 않았고,
    동기화도 꺼져 있을 때만. 동기화가 켜져 있으면 원격에 사본이 있으므로
    재촉하지 않는다. 하루에 한 번을 넘지 않는다. */
const LS_NAG = 'wc.nag';
function backupNag(){
  if (syncOn() || DB.items.length < 5) return;
  const day = 86400000;
  const exp = DB.meta.lastExport ? Date.now() - new Date(DB.meta.lastExport) : Infinity;
  if (exp < 30 * day) return;
  try{
    const last = Number(localStorage.getItem(LS_NAG) || 0);
    if (Date.now() - last < day) return;
    localStorage.setItem(LS_NAG, String(Date.now()));
  }catch(e){ return; }
  const how = DB.meta.lastExport ? '30일 넘게 백업하지 않았습니다' : '아직 백업을 받지 않았습니다';
  toast(`${how} — 설정에서 전체 백업(JSON)을 받아 두세요`, 6500);
}
/** 첫 실행인가 — 예시만 있거나 비어 있고, 아직 안내를 보지 않은 경우 */
function needIntro(){
  try{ if (localStorage.getItem(LS_INTRO)) return false; }catch(e){ return false; }
  return !DB.items.length || DB.items.every(i => String(i.tags || '').includes('예시'));
}

function openEdit(id, draft){
  const isNew = !id;
  const base = isNew
    ? normalize({status:'미개봉', size_ml:'700', purchase_date: today(), remaining_pct:'100',
        bottler:'Official (OB)', ...(draft ? draft.fields : {})})
    : {...byId(id)};
  if (!base) return;
  const it = base;
  const dk = new Set(draft ? [...draft.keys] : []);

  const inp = (k, lbl, t, wide, opts) => {
    const v = it[k] ?? '';
    let ctl;
    if (t === 'select')
      ctl = `<select name="${k}">${(opts.includes(v) ? opts : [v, ...opts].filter(Boolean))
        .map(o => `<option${o === v ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
    else if (t === 'textarea') ctl = `<textarea name="${k}" rows="2">${esc(v)}</textarea>`;
    else if (t === 'price')
      ctl = `<input name="${k}" value="${esc(v)}" inputmode="numeric" placeholder="120000 또는 12만">`;
    else if (t === 'range')
      ctl = `<div class="rng"><input name="${k}" type="range" min="0" max="100" step="5"
          value="${esc(v === '' ? '100' : v)}"><output>${esc(v === '' ? '100' : v)}%</output></div>`;
    else if (t === 'flavors')
      ctl = `<div class="chips fchips" data-flav style="flex-wrap:wrap">${FLAVORS.map(f =>
          `<button type="button" class="chip${String(v).split(',').includes(f) ? ' on' : ''}"
            data-flav="${esc(f)}">${esc(f)}</button>`).join('')}
          <input type="hidden" name="${k}" value="${esc(v)}"></div>`;
    else ctl = `<input name="${k}" type="${t}" value="${esc(v)}"${t === 'number' ? ' inputmode="decimal" step="any"' : ''}>`;
    return `<div class="f${wide ? ' wide' : ''}${dk.has(k) ? ' drafted' : ''}" data-fk="${k}">
      <label>${lbl}${dk.has(k) ? '<i class="dpill">초안</i>' : ''}</label>${ctl}</div>`;

  }

/* ══════════════════════════════════════════
   썸네일 정규화 — 모든 병 사진을 같은 크기·같은 비율로
   ① 배경 여백 자동 트리밍 → ② 3:4 흰 캔버스 중앙 배치 → ③ 동일 배율

   규격은 3:4 (336×448). 4:5(360×450) 에서 옮겨온 값이며, 448×0.9=403px 은
   옛 규격의 병 높이(450×0.9=405px)와 거의 같아 이관 시 확대 없이 재배치된다.
   THUMB_FIT 은 항목별 이관 표식이다 — 맞춤 규칙을 바꾸면 이 값을 올려야
   retrofitThumbs 가 기존 썸네일을 다시 맞춘다(THUMB_AR 은 화면 표시용 이름). */
const THUMB_AR = '3:4';
const THUMB_FIT = '3:4/fill';
/* FILL 을 0.98 로 둔 이유: 병을 프레임 높이에 거의 꽉 채우되, trimBox 의
   경계 판정이 1px 어긋나도 마개가 잘리지 않도록 위아래 1% 만 남긴다.
   흰 캔버스 위의 1% 는 눈에 보이지 않으므로 CSS 확대 보정이 필요 없다. */
const THUMB_W = 336, THUMB_H = 448, THUMB_FILL = 0.98;
const MAX_SHOTS = 5;                 // 병당 사진 최대 장수
/* 2번째 이후 사진은 조금 작게 저장해 용량을 아낀다. 본 사진과 같은 3:4 여야
   추가 사진 프레임(.cand/.exs/.prev)에서 위아래 흰 띠가 생기지 않는다 */
const EXTRA_W = 288, EXTRA_H = 384;

function fileToDataURL(file){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej; fr.onload = () => res(String(fr.result));
    fr.readAsDataURL(file);
  });
}
function loadImg(src, cors){
  return new Promise((res, rej) => {
    const im = new Image();
    if (cors) im.crossOrigin = 'anonymous';
    im.onload = () => res(im);
    im.onerror = rej;
    im.src = src;
  });
}
/** 균일한 배경 여백을 찾아 잘라낼 영역 계산 */
function trimBox(d, w, h){
  const at = (x, y) => (y * w + x) * 4;
  const cor = [[0,0],[w-1,0],[0,h-1],[w-1,h-1]].map(([x,y]) => {
    const i = at(x, y); return [d[i], d[i+1], d[i+2], d[i+3]];
  });
  const bg = [0,1,2].map(k => Math.round(cor.reduce((s, c) => s + c[k], 0) / 4));
  const bgA = cor.reduce((s, c) => s + c[3], 0) / 4;
  const TH = 44;
  const isContent = bgA < 60
    ? i => d[i+3] >= 60                                   // 투명 배경(PNG)
    : i => d[i+3] >= 60 &&
      (Math.abs(d[i]-bg[0]) + Math.abs(d[i+1]-bg[1]) + Math.abs(d[i+2]-bg[2])) > TH;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++){
    for (let x = 0; x < w; x++){
      if (isContent(at(x, y))){
        if (x < x0) x0 = x; if (x > x1) x1 = x;
        if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
    }
  }
  /* 배경색을 함께 돌려준다 — 잘라낸 뒤 남는 여백을 이 색으로 칠해야
     어두운 사진에서 병만 오려낸 경우에 흰 띠가 생기지 않는다.
     투명 배경(PNG)은 흰색이 맞다. */
  const fill = bgA < 60 ? '#ffffff' : `rgb(${bg[0]},${bg[1]},${bg[2]})`;
  if (x1 < 0) return {x:0, y:0, w, h, fill};
  const pad = Math.round(Math.max(w, h) * 0.012);
  x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad);
  x1 = Math.min(w - 1, x1 + pad); y1 = Math.min(h - 1, y1 + pad);
  return {x:x0, y:y0, w:x1 - x0 + 1, h:y1 - y0 + 1, fill};
}
/** src(URL 또는 data URI) → 정규화된 3:4 썸네일 data URI. 실패 시 null
    W/H 를 넘기면 그 규격으로 만든다(추가 사진은 조금 작게 저장)
    opt.noCrop: 가로가 넘쳐도 잘라내지 않고 폭 기준으로 줄여 전체를 담는다
    opt.q: JPEG 품질(기본 0.8) */
async function normalizeThumb(src, W, H, opt){
  W = W || THUMB_W; H = H || THUMB_H;
  const noCrop = !!(opt && opt.noCrop);
  if (!src) return null;
  const local = src.startsWith('data:') || src.startsWith(location.origin);
  let im = null;
  try{ im = await loadImg(src, !local); }
  catch(e){
    if (local) return null;
    try{ im = await loadImg(src, false); }catch(e2){ return null; }
  }
  if (!im.naturalWidth) return null;
  const M = 760;
  const s0 = Math.min(1, M / Math.max(im.naturalWidth, im.naturalHeight));
  const w0 = Math.max(1, Math.round(im.naturalWidth * s0));
  const h0 = Math.max(1, Math.round(im.naturalHeight * s0));
  const c0 = document.createElement('canvas');
  c0.width = w0; c0.height = h0;
  const g0 = c0.getContext('2d', {willReadFrequently:true});
  g0.drawImage(im, 0, 0, w0, h0);
  let box;
  try{ box = trimBox(g0.getImageData(0, 0, w0, h0).data, w0, h0); }
  catch(e){ return null; }               // 타 도메인 CORS 차단 → 원본 URL 그대로 사용
  /* 채우기 방식을 내용의 형태로 가른다.
     · 병만 오려낸 이미지(배경이 흰색이라 trimBox 가 병 자체를 잡아낸 경우)는
       세로로 길다 — h/w 가 2 이상. 높이에 맞추고 좌우에 흰 여백을 두어도
       카드 배경이 흰색이라 티가 나지 않으며, 병을 자르지 않는 편이 낫다.
     · 배경이 있는 사진은 h/w 가 2 미만이다. 여기에 같은 처리를 하면 좌우에
       흰 띠가 남아 "내가 등록한 사진만 안 꽉 찬다"로 보였다 → 프레임을 채우고
       넘치는 쪽만 중앙 크롭한다(cover). 사진은 가장자리에 여유가 있어 안전하다. */
  const tall = box.h / box.w >= 2;
  let sc, sx = box.x, sy = box.y, sw = box.w, sh = box.h;
  if (!tall && !noCrop){
    sc = Math.max(W / box.w, H / box.h);
    const keepW = Math.min(box.w, W / sc), keepH = Math.min(box.h, H / sc);
    sx = box.x + (box.w - keepW) / 2; sw = keepW;
    sy = box.y + (box.h - keepH) / 2; sh = keepH;
  } else {
    sc = H * THUMB_FILL / box.h;
    const need = box.w * sc;
    if (need > W){
      if (noCrop || need > W * 1.9){
        sc = W * THUMB_FILL / box.w;             // 폭 기준 → 전체가 들어간다(잘라내지 않음)
      } else {
        const keep = W / sc;                     // 원본에서 유지할 가로 폭
        sx = box.x + (box.w - keep) / 2; sw = keep;
      }
    }
  }
  const dw = Math.max(1, Math.round(sw * sc)), dh = Math.max(1, Math.round(sh * sc));
  const c1 = document.createElement('canvas');
  c1.width = W; c1.height = H;
  const g1 = c1.getContext('2d');
  g1.fillStyle = box.fill || '#fff'; g1.fillRect(0, 0, W, H);
  g1.imageSmoothingEnabled = true; g1.imageSmoothingQuality = 'high';
  g1.drawImage(c0, sx, sy, sw, sh,
    Math.round((W - dw) / 2), Math.round((H - dh) / 2), dw, dh);
  try{ return c1.toDataURL('image/jpeg', (opt && opt.q) || 0.8); }catch(e){ return null; }
}

/* ══════════════════════════════════════════
   QR 코드 생성 (ISO/IEC 18004 의 최소 부분)
   외부 의존성 금지가 이 앱의 전제이므로 직접 구현한다 — CDN 라이브러리나
   QR 이미지 API 를 쓰면 오프라인·file:// 에서 후원 QR 이 뜨지 않는다.
   바이트 모드만 쓴다(URL 이므로 숫자·영숫자 모드가 이득이 없다).
   버전 1~10 · ECC L/M 까지 지원 — 후원 링크(118자)는 M 레벨 7 버전에 들어간다.
   ══════════════════════════════════════════ */
/* GF(256), 원시다항식 0x11d */
const GF_EXP = new Uint8Array(512), GF_LOG = new Uint8Array(256);
(() => {
  let x = 1;
  for (let i = 0; i < 255; i++){ GF_EXP[i] = x; GF_LOG[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11d; }
  for (let i = 255; i < 512; i++) GF_EXP[i] = GF_EXP[i - 255];
})();
const gfMul = (a, b) => (a && b) ? GF_EXP[GF_LOG[a] + GF_LOG[b]] : 0;
/** 리드-솔로몬 생성다항식 ∏(x - α^i), 최고차항 먼저 */
function rsGen(n){
  let g = [1];
  for (let i = 0; i < n; i++){
    const ng = new Array(g.length + 1).fill(0);
    for (let j = 0; j < g.length; j++){ ng[j] ^= g[j]; ng[j + 1] ^= gfMul(g[j], GF_EXP[i]); }
    g = ng;
  }
  return g;
}
function rsEncode(data, ecLen){
  const g = rsGen(ecLen);
  const res = new Uint8Array(data.length + ecLen);
  res.set(data);
  for (let i = 0; i < data.length; i++){
    const f = res[i]; if (!f) continue;
    for (let j = 0; j < g.length; j++) res[i + j] ^= gfMul(g[j], f);
  }
  return res.slice(data.length);
}
/* 버전별 블록 구성 — {ec: 블록당 ECC 코드워드, g1n/g1d, g2n/g2d} */
const QR_CAP = {

  2:  {L:{ec:10, g1n:1,g1d:34, g2n:0,g2d:0}, M:{ec:16, g1n:1,g1d:28, g2n:0,g2d:0}},
  3:  {L:{ec:15, g1n:1,g1d:55, g2n:0,g2d:0}, M:{ec:26, g1n:1,g1d:44, g2n:0,g2d:0}},
  4:  {L:{ec:20, g1n:1,g1d:80, g2n:0,g2d:0}, M:{ec:18, g1n:2,g1d:32, g2n:0,g2d:0}},
  5:  {L:{ec:26, g1n:1,g1d:108,g2n:0,g2d:0}, M:{ec:24, g1n:2,g1d:43, g2n:0,g2d:0}},
  6:  {L:{ec:18, g1n:2,g1d:68, g2n:0,g2d:0}, M:{ec:16, g1n:4,g1d:27, g2n:0,g2d:0}},
  7:  {L:{ec:20, g1n:2,g1d:78, g2n:0,g2d:0}, M:{ec:18, g1n:4,g1d:31, g2n:0,g2d:0}},
  8:  {L:{ec:24, g1n:2,g1d:97, g2n:0,g2d:0}, M:{ec:22, g1n:2,g1d:38, g2n:2,g2d:39}},
  9:  {L:{ec:30, g1n:2,g1d:116,g2n:0,g2d:0}, M:{ec:22, g1n:3,g1d:36, g2n:2,g2d:37}},
  10: {L:{ec:18, g1n:2,g1d:68, g2n:2,g2d:69},M:{ec:26, g1n:4,g1d:43, g2n:1,g2d:44}},
};
const QR_ALIGN = {1:[], 2:[6,18], 3:[6,22], 4:[6,26], 5:[6,30],

/* 파인더·정렬 패턴은 규격 그림을 그대로 적는다(1=검정). 계산식으로 만들면

  [1,0,1,1,1,0,1],

  (r,c) => c % 3 === 0,

  (r,c) => ((r >> 1) + Math.floor(c / 3)) % 2 === 0,
  (r,c) => (r * c) % 2 + (r * c) % 3 === 0,

      }
      if (run >= 5) p += 3 + (run - 5);
    }
  };
  line((r, c) => m[r][c]); line((c, r) => m[r][c]);
  for (let r = 0; r < N - 1; r++) for (let c = 0; c < N - 1; c++)
    if (m[r][c] === m[r][c+1] && m[r][c] === m[r+1][c] && m[r][c] === m[r+1][c+1]) p += 3;

    for (let a = 0; a < N; a++) for (let b = 0; b <= N - 7; b++){
      let hit = true;
      for (let k = 0; k < 7; k++) if (get(a, b + k) !== PAT[k]) { hit = false; break; }
      if (!hit) continue;
      const before = [];
      for (let k = b - 4; k < b; k++) before.push(k < 0 ? 0 : get(a, k));
      const after = [];
      for (let k = b + 7; k < b + 11; k++) after.push(k >= N ? 0 : get(a, k));
      if (before.every(v => v === 0) || after.every(v => v === 0)) p += 40;
    }
  };
  findPat((r, c) => m[r][c]); findPat((c, r) => m[r][c]);
  let dark = 0;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) dark += m[r][c];
  p += 10 * Math.floor(Math.abs(dark * 100 / (N * N) - 50) / 5);

}
/** text → {N, m} 모듈 격자(1=검정). 담을 수 없으면 null */
function qrEncode(text, ecl){
  ecl = ecl || 'M';
  const bytes = new TextEncoder().encode(text);
  let ver = 0, cap = null, total = 0;
  for (let v = 1; v <= 10; v++){
    const c = QR_CAP[v][ecl];
    const t = c.g1n * c.g1d + c.g2n * c.g2d;
    if (4 + (v <= 9 ? 8 : 16) + bytes.length * 8 <= t * 8){ ver = v; cap = c; total = t; break; }
  }
  if (!ver) return null;

  /* ── 데이터 비트열 ── */
  const bits = [];
  const push = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >> i) & 1); };
  push(4, 4);                                    // 바이트 모드
  push(bytes.length, ver <= 9 ? 8 : 16);
  bytes.forEach(b => push(b, 8));
  for (let i = 0; i < 4 && bits.length < total * 8; i++) bits.push(0);
  while (bits.length % 8) bits.push(0);
  for (let i = 0; bits.length < total * 8; i++) push([0xec, 0x11][i % 2], 8);
  const dat = new Uint8Array(total);
  for (let i = 0; i < total; i++){
    let v = 0; for (let j = 0; j < 8; j++) v = (v << 1) | bits[i * 8 + j];
    dat[i] = v;
  }
  /* ── 블록 분할 · RS · 인터리브 ── */
  const blocks = []; let p = 0;
  for (let i = 0; i < cap.g1n; i++){ blocks.push(dat.slice(p, p + cap.g1d)); p += cap.g1d; }
  for (let i = 0; i < cap.g2n; i++){ blocks.push(dat.slice(p, p + cap.g2d)); p += cap.g2d; }
  const ecs = blocks.map(b => rsEncode(b, cap.ec));
  const out = [];
  const maxD = Math.max(...blocks.map(b => b.length));
  for (let i = 0; i < maxD; i++) blocks.forEach(b => { if (i < b.length) out.push(b[i]); });
  for (let i = 0; i < cap.ec; i++) ecs.forEach(e => out.push(e[i]));

  /* ── 기능 패턴 ── */
  const N = 17 + ver * 4;
  const m = Array.from({length: N}, () => new Int8Array(N).fill(0));
  const fn = Array.from({length: N}, () => new Int8Array(N).fill(0));
  const put = (r, c, v) => { m[r][c] = v; fn[r][c] = 1; };
  /* 패턴은 계산식 대신 그림 그대로 둔다 — 예전에 max() 식으로 만들었다가
     흰 고리와 검은 고리를 뒤집어 스캐너가 코드를 아예 찾지 못했다.
     분리자(패턴 밖 한 줄)는 흰색이므로 -1..7 범위를 돌며 0 으로 채운다. */
  const finder = (r0, c0) => {
    for (let i = -1; i <= 7; i++) for (let j = -1; j <= 7; j++){
      const r = r0 + i, c = c0 + j;
      if (r < 0 || r >= N || c < 0 || c >= N) continue;
      const inside = i >= 0 && i <= 6 && j >= 0 && j <= 6;
      put(r, c, inside ? QR_FINDER[i][j] : 0);
    }
  };
  finder(0, 0); finder(0, N - 7); finder(N - 7, 0);
  for (let i = 8; i < N - 8; i++){ put(6, i, i % 2 === 0 ? 1 : 0); put(i, 6, i % 2 === 0 ? 1 : 0); }
  const ac = QR_ALIGN[ver], last = ac[ac.length - 1];
  ac.forEach(r => ac.forEach(c => {
    if ((r === 6 && c === 6) || (r === 6 && c === last) || (r === last && c === 6)) return;
    for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++)
      put(r + i, c + j, QR_ALIGN_PAT[i + 2][j + 2]);
  }));
  /* 포맷·버전 정보 자리를 먼저 잡아 데이터가 침범하지 않게 한다 */
  for (let i = 0; i <= 8; i++){ if (!fn[8][i]) put(8, i, 0); if (!fn[i][8]) put(i, 8, 0); }
  for (let i = N - 8; i < N; i++){ if (!fn[8][i]) put(8, i, 0); if (!fn[i][8]) put(i, 8, 0); }
  if (ver >= 7) for (let i = 0; i < 18; i++){
    const a = N - 11 + i % 3, b = Math.floor(i / 3);
    put(b, a, 0); put(a, b, 0);
  }
  /* ── 데이터 배치 (지그재그, 오른쪽에서 왼쪽으로) ── */
  let bi = 0;
  const bitAt = k => (k >> 3) < out.length ? (out[k >> 3] >> (7 - (k & 7))) & 1 : 0;
  let up = true;
  for (let col = N - 1; col >= 1; col -= 2){
    if (col === 6) col = 5;                      // 세로 타이밍 열은 건너뛴다
    for (let k = 0; k < N; k++){
      const r = up ? N - 1 - k : k;
      for (let d = 0; d < 2; d++){
        const c = col - d;
        if (fn[r][c]) continue;
        m[r][c] = bitAt(bi++);
      }
    }
    up = !up;
  }
  /* ── 마스크 8개를 실제로 그려 보고 벌점이 가장 낮은 것을 고른다 ── */
  let best = null;
  for (let mk = 0; mk < 8; mk++){
    const t = m.map(row => Int8Array.from(row));
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++)
      if (!fn[r][c] && QR_MASKS[mk](r, c)) t[r][c] ^= 1;
    const fmt = qrFormat(ecl, mk);
    const bit = i => (fmt >> i) & 1;
    for (let i = 0; i <= 5; i++) t[i][8] = bit(i);
    t[7][8] = bit(6); t[8][8] = bit(7); t[8][7] = bit(8);
    for (let i = 9; i < 15; i++) t[8][14 - i] = bit(i);
    for (let i = 0; i < 8; i++) t[8][N - 1 - i] = bit(i);
    for (let i = 8; i < 15; i++) t[N - 15 + i][8] = bit(i);
    t[N - 8][8] = 1;                             // 항상 검정인 모듈
    if (ver >= 7){
      const vb = qrVerBits(ver);
      for (let i = 0; i < 18; i++){
        const b = (vb >> i) & 1, a = N - 11 + i % 3, q = Math.floor(i / 3);
        t[q][a] = b; t[a][q] = b;
      }
    }
    const pen = qrPenalty(t, N);
    if (!best || pen < best.pen) best = {pen, m: t};

}
/** 격자를 canvas 에 그린다 (여백 4모듈은 표준 필수) */
function qrDraw(cv, text, ecl){
  const q = qrEncode(text, ecl);
  if (!q) return null;
  const quiet = 4, side = q.N + quiet * 2;
  cv.width = side; cv.height = side;
  const g = cv.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, side, side);
  g.fillStyle = '#000';
  for (let r = 0; r < q.N; r++) for (let c = 0; c < q.N; c++)
    if (q.m[r][c]) g.fillRect(c + quiet, r + quiet, 1, 1);
  return q;
}

function download(name, text, mime){

  const u = URL.createObjectURL(b), a = document.createElement('a');
  a.href = u; a.download = name; document.body.appendChild(a); a.click();

}
function splitCSVLine(line){
  const out = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++){
    const c = line[i];
    if (q){
      if (c === '"' && line[i + 1] === '"'){ cur += '"'; i++; }
      else if (c === '"') q = false;
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ','){ out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur); return out;
}
function importText(text){
  text = String(text).trim();
  if (!text) return toast('내용이 비어 있습니다');
  let incoming = [];
  if (text[0] === '{' || text[0] === '['){
    try{
      const j = JSON.parse(text);
      incoming = (Array.isArray(j) ? j : j.items || []).map(normalize);
    }catch(e){ return toast('JSON 형식 오류'); }
  } else {
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    const head = splitCSVLine(lines[0]).map(s => s.trim());
    const isFull = head.includes('name_ko') || head[0] === 'id';
    (isFull ? lines.slice(1) : lines).forEach(l => {
      const c = splitCSVLine(l);
      if (c.length < 2) return;
      if (isFull){
        const o = {}; head.forEach((h, i) => o[h] = (c[i] ?? '').trim());
        incoming.push(normalize(o));
      } else {
        const [lo, hi] = parseRange(c[6]);
        incoming.push(normalize({
          name_ko:(c[0] || '').trim(), type:(c[1] || '').trim(), abv:(c[2] || '').trim(),
          cask:(c[3] || '').trim(), purchase_date:(c[4] || '').trim(),
          purchase_price:parsePrice(c[5]), market_low:lo, market_high:hi,
          nose:(c[7] || '').trim(), taste:(c[8] || '').trim(), finish:(c[9] || '').trim(),
          rating_bible:(c[10] || '').trim(),
          image_url:/^https?:/i.test((c[11] || '').trim()) ? c[11].trim() : '',
        }));
      }
    });
  }
  if (!incoming.length) return toast('가져올 항목이 없습니다');
  let add = 0, upd = 0;
  const touched = [];
  incoming.forEach(n => {
    const i = DB.items.findIndex(x => x.id === n.id ||
      (x.name_ko && x.name_ko === n.name_ko) || (x.name_en && n.name_en && x.name_en === n.name_en));
    if (i >= 0){
      DB.items[i] = {...DB.items[i], ...n, id: DB.items[i].id, updated_at: nowISO()};
      touched.push(DB.items[i]); upd++;
    } else { DB.items.unshift(n); touched.push(n); add++; }
  });
  save(); render(); closeSheet();
  toast(`가져오기 완료 — 신규 ${add}건, 갱신 ${upd}건`);
  /* 가져온 사진은 즉시 전부 규격을 맞춘다. 부팅 정규화(8장)에 맡기면
     많이 가져올수록 원본 URL 그대로 남아 목록의 병 크기가 들쭉날쭉해진다. */
  setTimeout(() => normalizeMissing(touched, {progress: true}), 600);
}

          <div class="s">${open.length ? '평균 잔량 ' + Math.round(open.reduce((s,i)=>s+(Number(i.remaining_pct)||0),0)/open.length) + '%' : '개봉한 병 없음'}</div></div>
        <div class="kpi"><div class="k">시음 기록</div><div class="v">${sess}<u>회</u></div>
          <div class="s">${a.filter(i=>i.sessions?.length).length}병에 기록</div></div>
        <div class="kpi"><div class="k">증류소 다양성</div><div class="v">${dist}<u>곳</u></div>
          <div class="s">${n ? (n / Math.max(dist,1)).toFixed(1) + '병/증류소' : ''}</div></div>
        <div class="kpi"><div class="k">평균 구매가</div><div class="v">${wonShort(avg) || 0}<u>원</u></div>
          <div class="s">${priced.length}병 기준</div></div>
      </div>`;
    })()}
    ${(() => {
      /* 연도별 구매 추이 */
      const m = {};
      priced.forEach(i => { const y = String(i.purchase_date || '').slice(0, 4);
        if (y.length === 4){ m[y] = m[y] || {n:0, sum:0}; m[y].n++; m[y].sum += Number(i.purchase_price); } });
      const ys = Object.keys(m).sort();
      if (!ys.length) return '';
      const mx = Math.max(...ys.map(y => m[y].sum));
      return `<h4 class="sec">연도별 구매</h4><div class="bars">${ys.map(y =>
        `<div class="bar"><span class="nm">${y}년 · ${m[y].n}병</span>
         <span class="tr"><i style="width:${m[y].sum / mx * 100}%"></i></span>
         <span class="n" style="width:52px">${wonShort(m[y].sum)}</span></div>`).join('')}</div>`;
    })()}
    <h4 class="sec">주종별</h4><div class="bars">${bars(cnt('cat'))}</div>
    <h4 class="sec">맛 프로필</h4><div class="bars">${(() => {
      const m = {};
      a.forEach(i => String(i.flavors || '').split(',').filter(Boolean)
        .forEach(f => m[f] = (m[f] || 0) + 1));
      const e = Object.entries(m).sort((x, y) => y[1] - x[1]);
      return bars(e);
    })()}</div>
    ${(() => {
      /* 주종별 지출 분해 — 전체 합산과 함께 보여준다 */
      const m = {};
      priced.forEach(i => { m[i.cat] = (m[i.cat] || 0) + Number(i.purchase_price); });
      const rows = Object.entries(m).sort((x, y) => y[1] - x[1]);
      return rows.length ? `<div class="rlist" style="margin-top:12px">${rows.map(([k, v]) =>
        `<div><b>${esc(k)}</b><span>${won(v)}</span></div>`).join('')}</div>` : '';
    })()}
    <h4 class="sec">타입별</h4><div class="bars">${bars(cnt('type'))}</div>
    <h4 class="sec">증류소별</h4><div class="bars">${bars(cnt('distillery'))}</div>
    <h4 class="sec">지역별</h4><div class="bars">${bars(cnt('region'))}</div>
    <div class="note" style="margin-top:18px"><b>평가 손익</b>은 입력한 구매가와 추정 시장가의 차이로,
      수수료·세금·실거래 여부를 반영하지 않은 참고 지표입니다.</div>`,
    `<button class="btn pri" data-act="close">닫기</button>`);
  $('#shFoot').onclick = closeSheet;
}

  $('#syDiag').onclick = async () => {

    /* 화면에서 고친 값으로 바로 진단할 수 있게 입력값을 먼저 반영 */
    /* 붙여넣기 과정에서 끼어드는 공백·줄바꿈·마스킹 문자를 모두 제거한다 */
    const t = $('#syTok').value.replace(/[\s•]/g, '');
    SYNC.repo = $('#syRepo').value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\.git$/, '');
    SYNC.path = $('#syPath').value.trim().replace(/^\/+/, '') || 'collection.json';
    SYNC.branch = $('#syBranch').value.trim() || 'main';

      rows.push(['토큰 유효성', '❌ 토큰에 한글·공백 같은 문자가 섞여 있습니다 — 토큰이 아닌 값을 붙여넣었을 가능성이 큽니다']);
    } else if (tk){
      try{
        const r = await fetch('https://api.github.com/user', {
          headers:{Authorization:'Bearer ' + tk, Accept:'application/vnd.github+json'}});
        const j = await r.json().catch(() => ({}));
        rows.push(['토큰 유효성', r.ok
          ? `✅ 유효 — GitHub 계정 <b>${esc(j.login || '?')}</b>`
          : r.status === 403
            ? `✅ 토큰은 유효합니다 (계정 조회 권한만 없음 — 정상)`

            : `⚠ HTTP ${r.status} — ${esc(j.message || '')} (아래 저장소 접근 결과로 판단하세요)`]);
      }catch(e){ rows.push(['토큰 유효성', '❌ 네트워크 오류 ' + esc(e.message)]); }
    }
    if (tk && SYNC.repo && tokenAscii(tk)){
      try{
        const r = await fetch('https://api.github.com/repos/' + SYNC.repo, {
          headers:{Authorization:'Bearer ' + tk, Accept:'application/vnd.github+json'}});
        const j = await r.json().catch(() => ({}));
        if (r.ok){
          rows.push(['저장소 접근', `✅ OK (${j.private ? 'Private' : 'Public'}, 기본 브랜치 ${esc(j.default_branch)})`]);

            rows.push(['⚠ 브랜치 불일치', `기본 브랜치가 <b>${esc(j.default_branch)}</b> 입니다 — 위 브랜치 칸을 바꿔 주세요`]);
          if (!j.permissions?.push)
            rows.push(['⚠ 쓰기 권한 없음', '토큰 설정에서 <b>Permissions → Contents</b> 를 '
              + '<b>Read and write</b> 로 바꿔 주세요 (읽기만 되면 업로드가 실패합니다)']);
        } else if (r.status === 403){
          /* 토큰은 유효한데 이 저장소에 권한이 없는 상태 — 401 과 원인이 다르다 */
          rows.push(['저장소 접근', `❌ 403 — ${esc(j.message || '')}<br>
            <b>토큰은 유효하지만 이 저장소 권한이 없습니다.</b> 토큰 설정에서<br>
            ① <b>Repository access</b> → Only select repositories 에 <b>${esc(SYNC.repo.split('/')[1] || '')}</b> 가 선택되어 있는지<br>
            ② <b>Permissions → Contents</b> 가 <b>Read and write</b> 인지 확인하세요.`]);
        } else if (r.status === 404){
          rows.push(['저장소 접근', `❌ 404 — 저장소를 찾을 수 없습니다<br>
            이름 오타이거나, <b>토큰의 Repository access 목록에 이 저장소가 선택되지 않았습니다</b><br>
            (저장소를 토큰보다 나중에 만들었다면 토큰 설정에서 다시 선택해야 합니다)`]);
        } else {
          rows.push(['저장소 접근', `❌ HTTP ${r.status} — ${esc(j.message || '')}`]);
        }
      }catch(e){ rows.push(['저장소 접근', '❌ 네트워크 오류 ' + esc(e.message)]); }
      try{
        const got = await ghReadFile(SYNC.path);
        if (got.missing) rows.push(['원격 데이터 파일', '아직 없음 — 첫 동기화 때 생성됩니다']);
        else{
          const kb = Math.round((got.size || got.text.length) / 1024);
          const how = got.via === 'raw' ? ' · raw 경로로 읽음(1MB 초과)' : '';
          if (!got.text){
            rows.push(['원격 데이터 파일', `❌ 본문을 읽지 못했습니다 (${kb}KB, encoding=${esc(got.encoding)}`
              + (got.rawStatus ? `, raw HTTP ${got.rawStatus}` : '') + ')']);
          } else {
            try{
              const rem = JSON.parse(got.text);

/* ══════════════════════════════════════════
   전체 초기화 — 되돌릴 수 없는 작업이므로 4중 안전장치
   ① 영향 범위 명시(병수·구매합계·동기화 여부)
   ② 백업 내려받기 강제(또는 명시적 포기 체크)
   ③ '초기화' 단어 직접 입력
   ④ 삭제 후 14일간 되돌리기 스냅샷 보관
   ══════════════════════════════════════════ */
const trashInfo = () => {
  try{
    const t = JSON.parse(localStorage.getItem(LS_TRASH) || 'null');
    if (!t || !t.at) return null;
    const days = (Date.now() - new Date(t.at)) / 86400000;
    if (days > TRASH_DAYS) return null;
    return {at: t.at, days: Math.floor(days), n: t.n || 0};
  }catch(e){ return null; }
};
function openWipe(){
  const n = DB.items.length;
  const buy = DB.items.reduce((s, i) => s + (Number(i.purchase_price) || 0), 0);
  const photos = DB.items.filter(i => (i.images && i.images.length) || i.image_norm).length;
  openSheet('전체 초기화', `
    <div class="note" style="background:#fdf1ee;border-color:#e6bcb0">
      <b style="color:var(--danger)">되돌리기 어려운 작업입니다.</b><br>
      이 기기의 <b>${n}병</b>${buy ? ` · 구매 합계 <b>${wonShort(buy)}원</b>` : ''}${photos ? ` · 사진 ${photos}장` : ''} 기록이 모두 삭제됩니다.
      ${syncOn() ? `<br><b style="color:var(--danger)">동기화가 연결되어 있어 폰·PC 등 다른 기기에서도 함께 삭제됩니다.</b>` : ''}
    </div>
    <h4 class="sec">1단계 · 백업</h4>
    <div class="stack">
      <button class="btn" id="wpBackup">백업 파일 내려받기 (권장)</button>
    </div>
    <label class="hint" style="display:flex;gap:7px;align-items:center;margin-top:9px;cursor:pointer">
      <input type="checkbox" id="wpNoBackup"> 백업 없이 진행합니다 (복구 불가를 이해합니다)
    </label>
    <h4 class="sec">2단계 · 확인 입력</h4>
    <div class="f wide">
      <label>아래 칸에 <b>초기화</b> 를 그대로 입력하세요</label>
      <input id="wpWord" placeholder="초기화" autocomplete="off" autocapitalize="off">
    </div>
    <p class="hint" id="wpHint" style="margin-top:10px">두 단계를 모두 마치면 삭제 버튼이 활성화됩니다.</p>
    <p class="hint">삭제 후 <b>${TRASH_DAYS}일간</b> 이 기기에서 되돌리기가 가능합니다
      (⚙️ 하단의 <b>초기화 되돌리기</b>).</p>`,
    `<button class="btn" data-act="cancel">취소</button>
     <button class="btn dgr" id="wpGo" style="flex:1;width:auto" disabled>영구 삭제</button>`);

  let backedUp = false;
  const sync = () => {
    const ok = (backedUp || $('#wpNoBackup').checked) && $('#wpWord').value.trim() === '초기화';
    $('#wpGo').disabled = !ok;
    $('#wpHint').innerHTML = ok
      ? '<b style="color:var(--danger)">삭제 버튼이 활성화되었습니다.</b>'
      : (!(backedUp || $('#wpNoBackup').checked)
          ? '1단계: 백업을 받거나 "백업 없이 진행"을 선택하세요.'
          : '2단계: <b>초기화</b> 를 정확히 입력하세요.');
  };
  $('#wpBackup').onclick = () => {
    download(`whisky-backup-${today()}.json`, JSON.stringify(DB, null, 1), 'application/json');
    backedUp = true; $('#wpBackup').textContent = '✅ 백업을 내려받았습니다'; sync();
  };
  $('#wpNoBackup').onchange = sync;
  $('#wpWord').oninput = sync;
  $('#shFoot').onclick = e => {
    if (e.target.closest('[data-act=cancel]')) return openData();
    if (e.target.id !== 'wpGo' || $('#wpGo').disabled) return;
    const gone = DB.items;
    const snap = JSON.stringify({items: gone, meta: DB.meta});
    DB = {items: [], meta: {}}; tomb(gone);
    save(); render();
    /* 저장소를 비운 뒤에 스냅샷을 넣어 용량 초과를 피한다 */
    try{ localStorage.setItem(LS_TRASH, JSON.stringify({at: nowISO(), n: gone.length, data: snap})); }
    catch(err){ toast('⚠ 되돌리기 스냅샷 저장 실패 (용량 초과)'); }
    closeSheet(); toast(`${gone.length}병을 삭제했습니다 · ${TRASH_DAYS}일간 되돌리기 가능`);
  };
}
function restoreTrash(){
  const t = trashInfo();
  if (!t) return toast('되돌릴 스냅샷이 없습니다');
  if (!confirm(`${t.n}병을 되돌립니다 (삭제 ${t.days}일 전).\n현재 기록과 합쳐집니다. 계속할까요?`)) return;
  let old = null;
  try{ old = JSON.parse(JSON.parse(localStorage.getItem(LS_TRASH)).data); }catch(e){}
  if (!old || !Array.isArray(old.items)) return toast('스냅샷을 읽을 수 없습니다');
  const now = nowISO();
  const map = new Map(DB.items.map(i => [i.id, i]));
  for (const raw of old.items){
    const it = normalize(raw);
    /* 삭제 기록보다 나중 시각으로 되살려야 동기화가 다시 지우지 않는다 */
    it.updated_at = now;
    map.set(it.id, it);
    if (DB.meta.tombs) delete DB.meta.tombs[it.id];
  }
  DB.items = [...map.values()];
  save(); render();
  try{ localStorage.removeItem(LS_TRASH); }catch(e){}
  openData(); toast(`${old.items.length}병을 되돌렸습니다`);
}
function setTheme(t){

  if (typeof render === 'function' && DB.items.length) render();
}

  else if (e.key === 'ArrowRight') lbGo(1);
  else if (e.key === 'Escape') closeLightbox();
});
{
  let x0 = 0, y0 = 0;
  const lb = $('#lightbox');
  lb.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
  lb.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) lbGo(dx < 0 ? 1 : -1);
  }, {passive:true});
}

/** 규격이 맞춰지지 않은 썸네일을 정규화. 대상 목록을 직접 받아 뒤에 남기지 않는다. */
async function normalizeMissing(list, opt){
  if (!navigator.onLine) return 0;
  const t = (list || DB.items).filter(i => !i.image_norm && (i.image_url || i.image_data));
  if (!t.length) return 0;
  const talk = opt?.progress && t.length > 3;
  let ok = 0;
  for (let i = 0; i < t.length; i++){
    if (talk) toast(`썸네일 규격 맞추는 중… ${i + 1}/${t.length}`);
    const n = await normalizeThumb(t[i].image_url || t[i].image_data);
    if (n){ t[i].image_norm = n; t[i].images = [n]; t[i].image_data = ''; t[i].thumb_ar = THUMB_FIT; ok++; }
  }
  if (ok){ save(); render(); }
  if (talk) toast(`썸네일 ${ok}장 정리 완료${t.length - ok ? ` · ${t.length - ok}장은 출처 제한` : ''}`);
  return ok;
}
/* 부팅은 시작을 늦추지 않도록 8장만 (나머지는 가져오기 직후·설정에서 일괄 처리) */
const autoNormalize = () => normalizeMissing(DB.items.slice(0, 8));

const needsRetrofit = it => it.thumb_ar !== THUMB_FIT && !!(it.image_norm || it.images?.length);
/** 저장 규격 이관 (4:5 → 3:4).
    이미 저장된 썸네일 자체를 원본으로 삼는다 — 네트워크가 필요 없고, 원격 원본을
    다시 받는 것보다 확실하다. noCrop 이라 어떤 사진도 잘려 나가지 않는다:
    3:4 에 가로가 넘치면 폭 기준으로 줄여 위아래를 흰 여백으로 남긴다.
    실패한 장은 기존 것을 그대로 두어 사진을 잃지 않는다.

    updated_at 은 일부러 올리지 않는다. 파생 데이터 갱신일 뿐인데 시각을 올리면
    mergeSnapshot 이 이 항목을 '더 새것'으로 보고 다른 기기의 최근 편집을 덮어쓴다.
    대신 표식(thumb_ar)이 없는 항목을 매번 찾으므로, 동기화가 옛 썸네일을
    되돌려도 다음 부팅에 스스로 복구된다. */
async function retrofitThumbs(opt){
  const t = DB.items.filter(needsRetrofit);
  if (!t.length) return 0;
  const talk = opt?.progress && t.length > 3;
  let ok = 0, keep = 0, done = 0;
  for (const it of t){
    const src = it.images?.length ? it.images : [it.image_norm];
    const out = [];
    for (let k = 0; k < src.length; k++){
      const n = await normalizeThumb(src[k], k ? EXTRA_W : THUMB_W, k ? EXTRA_H : THUMB_H,
        {noCrop: true, q: 0.86});     // 재인코딩 손실을 줄이려 품질을 조금 올린다
      if (n){ out.push(n); ok++; } else { out.push(src[k]); keep++; }
    }
    it.images = out.filter(Boolean);
    it.image_norm = it.images[0] || '';
    it.thumb_ar = THUMB_FIT;
    /* 중간에 끊겨도 진행분이 남도록 나눠 저장한다 */
    if (++done % 8 === 0){
      save();
      if (talk) toast(`썸네일 3:4 규격으로 맞추는 중… ${done}/${t.length}`);
    }
  }
  save(); render();
  if (talk) toast(`썸네일 ${ok}장을 3:4 로 맞췄습니다${keep ? ` · ${keep}장은 기존 유지` : ''}`);
  return ok;
}

/* ── boot ─────────────────────────────────── */
try{ const t = localStorage.getItem(LS_THEME); if (t) setTheme(t); }catch(e){}
loadSync();
load();
/* 대부분이 위스키이므로 위스키 탭에서 시작한다 (다른 주종이 섞여 있을 때만 의미가 있다) */
{
  const c = {};
  DB.items.forEach(i => { c[i.cat] = (c[i.cat] || 0) + 1; });
  if (c['위스키'] && Object.keys(c).length > 1) V.cat = '위스키';
}
render();
/* 순서가 중요하다: 규격 이관은 반드시 첫 동기화가 끝난 뒤에 한다.
   먼저 이관하면 곧바로 들어오는 원격 스냅샷이 옛 썸네일로 되돌려 헛일이 된다. */
(async () => {
  const wait = ms => new Promise(r => setTimeout(r, ms));
  if (syncOn()){
    syncBadge('busy');
    await wait(300);
    try{ await syncNow(true); }catch(e){}
  } else {
    await wait(700);
  }
  await retrofitThumbs({progress: true});
  await autoNormalize();
  /* 이관 결과를 다른 기기로 넘긴다 (updated_at 을 올리지 않았으므로 편집 충돌은 없다) */
  if (syncOn() && DB.items.some(i => i.thumb_ar === THUMB_FIT)) syncSoon();
  /* 첫 실행 안내는 동기화가 끝난 뒤에 판단한다 — 먼저 띄우면 원격에 기록이
     있는 기기(다른 기기에서 이미 쓰던 사람)에도 안내가 뜬다 */
  if (needIntro()) openIntro(0);
  else backupNag();
})();
/* 주기적 자동 동기화는 쓰지 않는다.
   동기화 시점은 ① 앱을 열 때 한 번 ② 추가·편집·삭제가 생겼을 때 ③ 지금 동기화 버튼, 세 가지뿐이다.
   아래는 "대기 중인 업로드"를 놓치지 않기 위한 처리이며 새로 동기화를 유발하지 않는다.
   (모바일은 앱을 벗어나면 타이머를 정지시켜, 편집 직후 나가면 업로드가 사라진다) */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') syncFlush();
});
window.addEventListener('pagehide', syncFlush);
/* ── 저장소 영구화 ─────────────────────────
   브라우저는 저장 공간이 부족하면 localStorage 를 임의로 비울 수 있고,
   iOS Safari 는 설치하지 않은 사이트를 7일간 열지 않으면 데이터를 지운다.
   persist() 승인을 받으면 그 대상에서 제외된다 — 설치된 PWA 는 대개 자동 승인.
   실패해도 앱은 그대로 동작하므로 조용히 넘어가고, 상태만 설정창에 보여 준다. */
/* 설치 여부·기기 판별 — 안내 문구를 갈라 쓰기 위한 것.
   navigator.standalone 은 iOS 전용, display-mode 는 그 외 브라우저용이다. */
const isIOS = () => /iP(hone|ad|od)/.test(navigator.userAgent)
  || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);   // iPadOS 13+
const isInstalled = () => matchMedia('(display-mode: standalone)').matches
  || matchMedia('(display-mode: fullscreen)').matches
  || navigator.standalone === true;

let persisted = null;                 // null = 아직 모름 / true / false
async function askPersist(){
  try{
    if (!navigator.storage?.persist) return null;
    persisted = await navigator.storage.persisted();
    if (!persisted) persisted = await navigator.storage.persist();
    return persisted;
  }catch(e){ return null; }
}
/** 저장 용량 — 설정창에 "얼마나 썼는지"를 보여 주기 위한 값 */
async function storageInfo(){
  try{
    if (!navigator.storage?.estimate) return null;
    const {usage, quota} = await navigator.storage.estimate();
    return {usage, quota};
  }catch(e){ return null; }
}
askPersist();

if ('serviceWorker' in navigator && location.protocol.startsWith('http'))
  addEventListener('load', async () => {
    try{
      const reg = await navigator.serviceWorker.register('./sw.js');
      /* 새 버전 알림 — 코드가 network-first 라 다음 실행에 자동 반영되지만,
         사용자가 그 사실을 모르면 옛 화면을 보고 있다고 오해한다.
         이미 워커가 붙어 있을 때(=재방문)만 알린다. 첫 설치는 알릴 것이 없다. */
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing || reg.waiting;
        if (!nw || !navigator.serviceWorker.controller) return;
        nw.addEventListener('statechange', () => {
          if (nw.state === 'installed') toast('새 버전이 준비됐습니다 — 새로고침하면 적용됩니다', 6000);
        });
      });
    }catch(e){}
  });
</script>
