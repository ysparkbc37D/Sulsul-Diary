        // 숙성 연수(12년)로 쓰이거나, 제품명 숫자(101·105)로 쓰이는 두 경우를 모두 인정
        if (age && age === tn) s += 12;
        else if (new RegExp('(?:^|\\D)' + tn + '(?:\\D|$)').test(n)) s += 8;
      }
      else if (n.includes(tn)) s += 7;
    }
    if (age && String(p.age) === age) s += 5;
    if (s > 0 && (!best || s > best.s)) best = {p, s};
  }
  return best && best.s >= 7 ? best.p : null;
}
/* ── 내 컬렉션에서 먼저 찾기 ─────────────────
   초안 엔진은 내장 DB(BRANDS/PRODUCTS)만 봤다. 그래서 **이미 등록한 병을 다시
   검색해도 찾지 못했다** — 139병을 넣어 둔 사용자에게 가장 이상한 동작이다.
   내 기록이 내장 DB보다 정확하다(내가 라벨을 보고 고친 값이니까). 그래서
   같은 병을 다시 살 때(배치가 다른 같은 제품, 선물용 추가 구매) 내 기록을 먼저 쓴다.
   구매 정보(가격·날짜·구매처)와 상태·잔량·사진은 가져오지 않는다 — 새 병이다. */
const MINE_COPY = ['name_ko','name_en','type','distillery','country','region','abv','age',
  'cask','bottler','size_ml','market_low','market_high','nose','taste','finish',
  'rating_wb','flavors','tags'];
/* ── 중복 구매 경고 ─────────────────────────
   같은 병을 다시 사는 일이 잦다(배치가 다른 같은 제품, 선물용). 그 자체는 정상이지만
   **모르고** 두 번 사는 것은 막아야 한다. 등록 화면에서 미리 알려 준다.
   완전일치만 보면 '라가불린 16년' 과 '라가불린 16' 을 놓치므로 여기서는 느슨하게
   본다 — 경고는 틀려도 손해가 없고, 놓치면 목적을 잃는다. (사양 복사와 반대) */
function dupCandidates(q, exclude){
  const nq = squish(q);
  if (nq.length < 2) return [];
  const isSeed = it => String(it.tags || '').split(',').map(t => t.trim()).includes('예시');
  return DB.items.filter(it => {
    if (it.id === exclude) return false;                       // 자기 자신은 중복이 아니다
    if (isSeed(it) || it.status === '위시') return false;      // 위시는 아직 안 산 것
    const a = squish(it.name_ko), b = squish(it.name_en);
    return (a && (a === nq || a.includes(nq) || nq.includes(a)))
        || (b && (b === nq || b.includes(nq) || nq.includes(b)));
  });
}
function dupWarnHTML(q, exclude){
  const dup = dupCandidates(q, exclude);
  if (!dup.length) return '';
  const owned = dup.filter(it => OWNED.includes(it.status));
  const tried = dup.filter(it => it.status === '경험');
  const line = it => {
    const bits = [it.purchase_date, it.purchase_place, it.purchase_price ? won(it.purchase_price) : '']
      .filter(Boolean).join(' · ');
    return `<li><b>${esc(fullName(it))}</b> <span class="dst">${esc(it.status)}</span>${
      bits ? `<br><span class="dbits">${esc(bits)}</span>` : ''}</li>`;
  };
  return `<div class="dupwarn">
    <div class="t">${owned.length
      ? `이미 <b>${owned.length}병</b> 가지고 있습니다`
      : `전에 <b>마셔 본</b> 병입니다`}</div>
    <ul>${[...owned, ...tried].slice(0, 4).map(line).join('')}</ul>
    ${dup.length > 4 ? `<p class="dbits">외 ${dup.length - 4}건</p>` : ''}
    <p class="dbits">같은 병을 또 사신 것이면 그대로 저장하세요 — 병마다 따로 관리됩니다.
      잘못 눌렀다면 <b>취소</b>를 누르세요.</p>
  </div>`;
}

/** 이름이 **완전히** 같은 내 기록. nameScore().exact 는 부분 일치에도 참이므로
    쓸 수 없다 — '글렌알라키' 가 '글렌알라키 메타베브 8년' 을 끌어왔다.
    사양을 통째로 복사하는 기능이라 근사 일치는 조용히 틀린 초안을 만든다.
    예시 데이터(태그 '예시')는 그 자체가 추정치이므로 소스로 쓰지 않는다. */
function mineCandidates(q, limit = 5){
  const nq = squish(q);
  if (!nq) return [];
  const isSeed = it => String(it.tags || '').split(',').map(t => t.trim()).includes('예시');
  return DB.items.filter(it => !isSeed(it)
      && (squish(it.name_ko) === nq || squish(it.name_en) === nq))
    .slice(0, limit)
    .map(it => ({it, s: 1, exact: true}));
}
/** 내 기록 → 초안 필드. 값이 있는 것만 담는다 */
function draftFromMine(it){
  const F = {}, keys = new Set();
  MINE_COPY.forEach(k => {
    const v = it[k];
    if (v !== '' && v != null){ F[k] = String(v); keys.add(k); }
  });
  return {F, keys};
}

/** 이름 문자열 → 초안 { fields, keys(자동채움 키), brand, product, lines(요약) } */
function draftFrom(raw){
  const q = String(raw).trim();
  const F = {}, keys = new Set(), lines = [];
  const put = (k, v) => { if (v !== '' && v != null && !F[k]){ F[k] = String(v); keys.add(k); } };

  F.name_ko = q; F.status = '미개봉'; F.size_ml = '700'; F.remaining_pct = '100';
  F.purchase_date = today(); F.bottler = 'Official (OB)';
  /* 보관 위치 기본값 — 대부분 집에 둔다. AI 가 채우는 값이 아니라 **기본값**이다
     (초안 배지도 붙지 않는다). 새 병에만 넣는다 — normalize() 에 넣으면 기존 병의
     빈 보관 위치까지 소급해서 '집' 으로 바뀐다 */
  F.storage = '집';

  /* 내 컬렉션이 첫 번째 검색원이다 — 내장 DB 보다 내 기록이 정확하다(내가 라벨을
     보고 고친 값이니까). 이름이 **정확히** 맞을 때만 쓴다 — 근사 일치로 다른 병의
     사양을 끌어오면 조용히 틀린 초안이 된다.
     여기서 반환하지 않고 아래 엔진을 그대로 통과시킨다. put() 은 이미 있는 값을
     덮지 않으므로, 내 기록이 이기고 빈 칸만 내장 DB가 채운다. */
  const mine = mineCandidates(q, 1)[0];
  let fromMine = '';
  if (mine && mine.exact){
    const m = draftFromMine(mine.it);
    Object.assign(F, m.F);
    m.keys.forEach(k => keys.add(k));
    F.name_ko = q;                       // 사용자가 적은 이름을 살린다
    fromMine = mine.it.id;
    lines.push(`내 기록 <b>${esc(fullName(mine.it))}</b> 의 사양을 가져왔습니다`
      + ' — 구매 정보와 사진은 새로 넣어 주세요.');
  }

  const rs = resolve(q);
  const brand = rs.brand;
  const age = parseAge(q);
  const abvIn = (q.match(/(\d{2}(?:\.\d)?)\s*%/) || [])[1];
  const ib = matchBottler(q);
  const isCS = /cs$|cs\s|캐스크스트렝스|caskstrength/.test(squish(q) + ' ');
  if (ib){ F.bottler = ib.en; keys.add('bottler'); }
  if (!brand){
    if (age) put('age', age);
    if (abvIn) put('abv', abvIn);
    /* 표기에서 읽어낸 정보라도 채워 준다 (배럴프루프·셰리 피니시 등) */
    const hint = expressionHints(q);
    if (hint.cask) put('cask', hint.cask);
    if (hint.abv) put('abv', hint.abv);
    if (hint.notes.length){ F.notes = hint.notes.join('\n'); keys.add('notes'); }
    /* 내 기록에서 이미 채웠다면 '못 찾았다'고 말하지 않는다 — 사용자는 채워진
       화면을 보면서 실패 문구를 읽게 된다. lines 는 위에서 만든 것을 이어 쓴다. */
    const more = rs.ambiguous
      ? ['이 표현명은 여러 증류소에 있습니다 — 어느 것인지 골라 주세요:',
         ...rs.ambiguous.map(x => `<b>${esc(x.b.ko || x.b.en)} ${esc(exprOf(x.p, x.b))}</b> · ${esc(x.p.abv)}%`),
         '이름 칸에 증류소를 함께 적으면 바로 채워집니다 (예: 포로지스 스몰배치).']
      : fromMine
      ? []
      : ['내장 DB에서 증류소를 찾지 못했습니다.',
         '<b>영문명으로 다시 시도</b>하면 정확도가 올라갑니다 (예: <b>Longmorn 23</b>).',
         '또는 아래 항목을 직접 입력하고 <b>사진 다시 찾기</b>를 눌러 주세요.'];
    lines.push(...more);
    if (hint.labels.length)
      lines.push('표기에서 읽어낸 정보: <b>' + hint.labels.map(esc).join(' · ') + '</b>');
    return {fields:F, keys, brand:null, product:null, lines, fromMine};
  }

  put('distillery', brand.en);
  put('country', brand.country);
  put('region', brand.region === 'Blend' ? '' : brand.region);
  put('type', brand.type || 'Single Malt');
  lines.push(`증류소 <b>${esc(brand.en)}</b> · ${esc(brand.country)}${brand.region !== 'Blend' ? ' / ' + esc(brand.region) : ''} · ${esc(brand.type || 'Single Malt')}`);

  /* 증류소가 정해진 뒤의 매칭이 숙성 연수를 함께 보므로 이쪽을 우선한다.
     (노마드 10년 → 표현명 색인은 '노마드'만 보고 NAS 제품을 고르기 때문) */
  const p = matchProduct(brand.k, q, age) || rs.product;
  if (rs.ambiguous)
    lines.push('표현명이 여러 증류소와 겹칩니다 — 추천 목록에서 정확한 제품을 골라 주세요: '
      + rs.ambiguous.map(x => `<b>${esc(x.b.ko || x.b.en)} ${esc(exprOf(x.p, x.b))}</b>`).join(' / '));
  if (p){
    put('name_en', p.name_en);
    put('age', p.age);
    put('abv', p.abv);
    put('cask', p.cask || brand.cask);
    if (p.type) F.type = p.type;
    put('nose', p.nose || brand.house?.nose);
    put('taste', p.taste || brand.house?.taste);
    put('finish', p.finish || brand.house?.finish);
    if (p.wb) put('rating_wb', '≈' + p.wb + ' (참고)');
    if (p.lo) put('market_low', p.lo);
    if (p.hi) put('market_high', p.hi);
    if (p.note) put('notes', p.note);
    lines.push(`제품 <b>${esc(p.name_en)}</b> 매칭 — 도수 ${esc(p.abv)}% · ${p.age === 'NAS' ? '숙성 미표기' : esc(p.age) + '년'}`);
    lines.push('캐스크 · 테이스팅 노트 3종' + (p.wb ? ' · 참고 평점' : '') + (p.lo ? ' · 추정 시장가' : '') + ' 채움');
  } else {
    if (age) put('age', age);
    /* 표현명 자체가 정보를 담고 있다 — "배럴프루프"면 캐스크 스트렝스, "셰리 피니시"면 캐스크가 정해진다 */
    const hint = expressionHints(q);
    put('cask', hint.cask || brand.cask);
    if (hint.abv) put('abv', hint.abv);
    const h = brand.house || REGION_STYLE[brand.region] || REGION_STYLE.default;
    put('nose', h.nose); put('taste', h.taste); put('finish', h.finish);
    if (hint.notes.length){
      F.notes = [F.notes, ...hint.notes].filter(Boolean).join('\n'); keys.add('notes');
    }
    lines.push('개별 제품이 DB에 없어 <b>증류소 하우스 스타일</b>로 테이스팅 노트 초안을 채웠습니다.');
    if (hint.labels.length)
      lines.push('표기에서 읽어낸 정보: <b>' + hint.labels.map(esc).join(' · ') + '</b>');
    lines.push('도수 · 캐스크 · 시장가는 실제 라벨을 확인해 수정해 주세요.');
  }
  if (abvIn) { F.abv = abvIn; keys.add('abv'); }
  if (!F.name_en && brand) put('name_en', brand.en + (age ? ' ' + age + ' Year Old' : ''));
  if (ib){
    F.notes = ['⚠ 독립 병입(IB) 제품 — 캐스크·도수·숙성은 병마다 달라 라벨 확인이 필요합니다.',
      F.notes].filter(Boolean).join('\n');
    keys.add('notes');
    lines.push(`독립 병입자 <b>${esc(ib.en)}</b> 감지 — 보틀러를 채웠습니다.`);
  }
  if (isCS && !abvIn){
    F.notes = [F.notes, '⚠ 캐스크 스트렝스 — 도수는 배치/병별로 다릅니다. 라벨 확인 후 수정하세요.']
      .filter(Boolean).join('\n');
    keys.add('notes');
  }
  return {fields:F, keys, brand, product:p, lines, fromMine};
}

/* ── Wikipedia / Commons 보강 ─────────────── */
function jget(url, ms = 7000){
  const c = new AbortController(); const t = setTimeout(() => c.abort(), ms);
  return fetch(url, {signal:c.signal, referrerPolicy:'origin-when-cross-origin'})
    .then(r => r.ok ? r.json() : null).catch(() => null).finally(() => clearTimeout(t));
}
async function commonsImages(q, limit = 8){
  const u = 'https://commons.wikimedia.org/w/api.php?format=json&origin=*&action=query'
    + '&generator=search&gsrnamespace=6&gsrlimit=' + limit
    + '&prop=imageinfo&iiprop=url|size&iiurlwidth=420&gsrsearch=' + encodeURIComponent(q);
  const j = await jget(u);
  return Object.values(j?.query?.pages || {})
    .filter(p => p.imageinfo?.[0]?.thumburl && /\.(jpe?g|png|webp)$/i.test(p.title))
    .map(p => ({
      title: p.title.replace(/^File:/, ''),
      url: p.imageinfo[0].thumburl,
      ar: p.imageinfo[0].width ? p.imageinfo[0].height / p.imageinfo[0].width : 1,
    }));
}
async function wikiSummary(title){
  const j = await jget('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title));
  if (!j || j.type === 'https://mediawiki.org/wiki/HyperSwitch/errors/not_found') return null;
  return {title: j.title, extract: j.extract, url: j.content_urls?.desktop?.page, thumb: j.thumbnail?.source};
}
/* 커먼즈 검색은 단어를 AND로 묶어, 제품 풀네임으로는 결과가 0건이 된다.
   → 브랜드 중심 질의를 좁은 것부터 넓은 것 순으로 시도하고 결과에 순위를 매긴다. */
const IMG_BAD = /distiller|brennerei|warehouse|panoramio|geograph|\bbay\b|\bpoint\b|conservation|park|ring|market|mall|castle|highway|barrel|exi?bition|tasting|products|various|whiskies|collection|shelf|verpackung|packaging|carton|label|leer|empty|glass|\bbar\b|logo|sign/i;
function rankCands(list, brandEn, age){
  const bt = squish(brandEn);
  return list.map(x => {
    let s = 0;
    if (bt && squish(x.title).includes(bt)) s += 4;
    if (/bottle|flasche|voll/i.test(x.title)) s += 3;
    if (age && new RegExp('(?:^|\\D)' + age + '(?:\\D|$)').test(x.title)) s += 3;
    if (IMG_BAD.test(x.title)) s -= 5;
    /* 세로로 긴 사진은 병 사진일 확률이 높고, 가로로 넓으면 건물·풍경일 확률이 높다 */
    if (x.ar >= 1.25) s += 4; else if (x.ar && x.ar <= 0.78) s -= 3;
    return {...x, s};
  }).sort((a, b) => b.s - a.s);
}
async function enrich(d){
  const out = {images: [], wiki: null};
  if (!navigator.onLine) return out;
  const b = d.brand;
  const age = d.fields.age && d.fields.age !== 'NAS' ? d.fields.age : '';
  /* "Port Charlotte (Bruichladdich)" 같은 괄호 표기는 검색에 방해가 된다 */
  const core = String(b?.en || d.fields.distillery || '').replace(/\(.*?\)/g, '').trim();
  const toks = core.toLowerCase().replace(/[^a-z0-9 ]/g, ' ').split(/\s+/)
    .filter(w => w.length >= 4 && !['the','distillery','whisky','single','malt','reserve'].includes(w));
  const wikiP = b?.wiki ? wikiSummary(b.wiki) : Promise.resolve(null);
  /* 표현명(Uigeadail·Quarter Cask 등)이 있으면 그 병 사진을 먼저 찾는다 */
  const expr = (d.product && b) ? exprOf(d.product, b).replace(/\d+\s*year old/i, '').trim() : '';
  const queries = core
    ? [expr ? `${core} ${expr}` : null,
       `${core} whisky bottle`, `${core} bottle`,
       age ? `${core} ${age} whisky` : null, `${core} whisky`].filter(Boolean)
    : [(d.fields.name_en || d.fields.name_ko || '') + ' whisky bottle'];
  const seen = new Set(); const all = [];
  for (const q of queries){
    for (const x of await commonsImages(q, 8))
      if (!seen.has(x.url)){ seen.add(x.url); all.push(x); }
    if (all.filter(x => !IMG_BAD.test(x.title)).length >= 6) break;
  }
  out.wiki = await wikiP;
  const ranked = rankCands(all, core, age);
  /* 브랜드명이 파일명에 없는 후보는 엉뚱한 사진(다른 술·풍경)일 가능성이 높다 */
  const strict = toks.length
    ? ranked.filter(x => toks.some(t => x.title.toLowerCase().includes(t)))
    : ranked;
  out.images = strict.slice(0, 8);
  if (!out.images.length && out.wiki?.thumb)
    out.images = [{title: out.wiki.title + ' (증류소 사진)', url: out.wiki.thumb, s:0, ar:1}];
  return out;
}

/* ── filter / sort ────────────────────────── */
const ageNum = it => {
  const m = String(it.age ?? '').match(/\d+/);
  return m ? parseInt(m[0], 10) : 0;      // NAS·미기재는 0
};
function visible(){
  const q = V.q.trim().toLowerCase();
  const band = AGE_BANDS.find(b => b[0] === V.age) || AGE_BANDS[0];
  const a = DB.items.filter(it => {
    /* 탭이 먼저다. 상태 필터(V.status)를 대체하지 않고 **함께** 걸린다 —
       탭 안에서 다시 좁히는 것이 필터의 역할이다 */
    if (!inTab(it, V.tab)) return false;
    if (V.cat !== 'all' && it.cat !== V.cat) return false;
    if (V.type !== 'all' && it.type !== V.type) return false;
    if (V.status === '__draft'){ if (it.draft !== '1') return false; }
    /* '지금 보유' — 비움을 뺀다. 구매 술장이 비움을 포함하므로(결정 1) 이 필터가
       "지금 술장에 있는 것만" 보는 유일한 수단이다. 상태 필터는 단일 선택이라
       미개봉과 오픈을 함께 고를 방법이 없어서, 이 항목이 없으면 그 조합이 불가능해진다 */
    else if (V.status === '__owned'){ if (!isHeld(it)) return false; }
    else if (V.status === '__todo'){ if (!OWNED.includes(it.status) || !isIncomplete(it)) return false; }
    else if (V.status === '__stale'){ if (!isStale(it)) return false; }
    else if (V.status !== 'all' && it.status !== V.status) return false;
    if (!band[2](ageNum(it))) return false;
    if (V.flavor !== 'all' && !String(it.flavors || '').split(',').includes(V.flavor)) return false;
    if (!q) return true;
    return ['name_ko','name_en','distillery','cask','region','country','tags','type','notes']
      .some(k => String(it[k] ?? '').toLowerCase().includes(q));
  });
  const S = {
    recent: (x, y) => (y.created_at || '').localeCompare(x.created_at || ''),
    bought: (x, y) => (y.purchase_date || '').localeCompare(x.purchase_date || ''),
    name:   (x, y) => fullName(x).localeCompare(fullName(y), 'ko'),
    score:  (x, y) => bestScore(y) - bestScore(x),
    price:  (x, y) => marketMid(y) - marketMid(x),
    abv:    (x, y) => (Number(y.abv) || 0) - (Number(x.abv) || 0),
    left:   (x, y) => (Number(x.remaining_pct) || 0) - (Number(y.remaining_pct) || 0),
    opened: (x, y) => (y.opened_at || '').localeCompare(x.opened_at || ''),
    /* 가성비 — 만원당 점수. 계산 불가한 병(구매가·점수 한쪽이 없음)은 항상 뒤로 */
    value:  (x, y) => {
      const a2 = valueScore(x), b2 = valueScore(y);
      if (a2 === null && b2 === null) return 0;
      if (a2 === null) return 1;
      if (b2 === null) return -1;
      return b2 - a2;
    },
  };
  const base = S[V.sort] || S.recent;
  /* 검색어가 있으면 관련도를 먼저 본다 — "라가불린" 을 쳤을 때 이름이 정확히
     맞는 병이 등록 순서 때문에 뒤로 밀리면 검색이 쓸모없어진다.
     같은 점수 안에서는 사용자가 고른 정렬을 그대로 지킨다. */
  if (!q) return a.sort(base);
  const rel = it => {
    const ko = String(it.name_ko || '').toLowerCase();
    const en = String(it.name_en || '').toLowerCase();
    if (ko === q || en === q) return 0;                       // 완전 일치
    if (ko.startsWith(q) || en.startsWith(q)) return 1;       // 이름이 그것으로 시작
    if (ko.includes(q) || en.includes(q)) return 2;           // 이름 안에 포함
    if (String(it.distillery || '').toLowerCase().includes(q)) return 3;
    return 4;                                                 // 캐스크·태그·메모 등
  };
  return a.sort((x, y) => rel(x) - rel(y) || base(x, y));
}

/* ── render list ──────────────────────────── */
function render(){
  /* 술장에서 성립하지 않는 상태·정렬은 **목록을 뽑기 전에** 되돌린다.
     뽑은 뒤에 되돌리면 이번 화면만 0건이 되고, 사용자는 왜 비었는지 알 수 없다.
     (주종·타입은 개수를 세야 판단할 수 있어 아래에서 따로 되돌린다) */
  if (!(TAB_STATUS[V.tab] || TAB_STATUS.all).includes(V.status)) V.status = 'all';
  const sortOff = TAB_SORT_OFF[V.tab] || [];
  if (sortOff.includes(V.sort)) V.sort = 'recent';

  const items = visible();

  /* ── 세 축의 집계 규칙 ──
     **각 축은 자기 부모까지만 반영한다.** 탭은 최상위라 컬렉션 전체를 세고, 주종은
     현재 탭 안을, 타입은 현재 탭+주종 안을 센다. 탭 배지가 검색·필터에 흔들리면
     타자를 칠 때마다 숫자가 변해 읽을 수 없다. */
  const tabHTML = ([t, lab]) =>
    `<button class="seg${V.tab === t ? ' on' : ''}" data-tab="${t}">${lab}<b>${
      DB.items.filter(i => inTab(i, t)).length}</b></button>`;
  /* 네 탭은 비어 있어도 늘 보여 준다 — 위시가 0병이라고 탭이 사라지면
     거기에 넣을 수 있다는 사실 자체가 감춰진다 */
  $('#tabSegs').innerHTML = TABS.map(tabHTML).join('');

  /* 주종 — CATS 4개를 **늘 전부** 보여준다(0건 포함). 병 수 탭(전체·구매·경험·위시)이
     "위시가 0병이어도 늘 보인다 — 안 그러면 넣을 수 있다는 사실 자체가 감춰진다" 는
     것과 같은 이유다(사용자 요청, 2026-08-10). 리큐르·기타주류가 0병이라고 옵션에서
     빠지면 이 앱이 위스키 말고도 기록할 수 있다는 걸 아무도 모른다. */
  const inTabItems = DB.items.filter(i => inTab(i, V.tab));
  const catCount = {};
  inTabItems.forEach(i => { catCount[i.cat] = (catCount[i.cat] || 0) + 1; });
  const cats = CATS;
  /* ⚠ "고른 주종이 이 탭에 0건이면 전체로 되돌린다" 는 가드를 없앴다. 0건도 이제
     정식 선택지라서, 가드를 남겨 두면 0건인 주종을 고르자마자 렌더 중에 다시
     all 로 튕겨 나간다 — 클릭이 씹히는 것처럼 보인다. V.cat 은 'all' 이거나 항상
     CATS 의 멤버이므로(다른 값을 넣는 경로가 없다) 되돌릴 필요도 없다. */
  /* 주종은 드롭다운이다(칩 → 드롭다운). 칩 여러 개가 타입 칩과 한 행을 다투면서
     주종이 스크롤 밖으로 밀려 나갔다. **병 수는 옵션 라벨에 넣어** 배지 대신 살린다. */
  const catSel = $('#catSel');
  catSel.hidden = false;
  /* 라벨에서 `전체` 와 괄호를 뺀다 — 360px 3행에 필터·초기화까지 들어오면 이 셀렉트는
     93px 이고 글자칸은 65px 뿐이다. `주종 전체 (145)` 는 105px 라 절반만 보이고
     **병 수가 잘려 나간다** — 병 수는 주종을 칩에서 드롭다운으로 바꿀 때 배지를
     포기한 대가로 라벨에 살려 둔 것이라, 그것이 잘리면 남는 것이 없다.
     `주종 145` 는 61px 로 들어간다. 펼치면 전체 라벨이 그대로 보인다. */
  catSel.innerHTML = ['all', ...cats].map(c =>
    `<option value="${esc(c)}">${c === 'all' ? '주종' : esc(c)} ${
      c === 'all' ? inTabItems.length : (catCount[c] || 0)}</option>`).join('');
  catSel.value = V.cat;

  /* 타입 칩 — 현재 탭 + 주종 안에서만 집계한다 */
  const inCat = inTabItems.filter(i => V.cat === 'all' || i.cat === V.cat);
  const used = [...new Set(inCat.map(i => i.type))].filter(Boolean).sort();
  /* 고른 타입이 이 범위에 없으면 되돌린다 — 그냥 두면 칩은 그려지지 않는데 필터는
     계속 걸려서 0건이 되고, 화면에는 풀 방법이 보이지 않는다 */
  if (V.type !== 'all' && !used.includes(V.type)) V.type = 'all';
  /* 타입도 드롭다운이다(칩 → 드롭다운). 칩은 가로 스크롤이 필요했고, 그것이
     PC 에서 창을 좁혔을 때 마우스로 닿을 수 없는 항목을 만들었다. 병 수는 라벨에 넣는다. */
  const typeSel = $('#typeSel');
  if (used.length > 1){
    typeSel.hidden = false;
    /* 주종과 같은 이유로 `전체`·괄호를 뺀다 (위 catSel 주석 참조) */
    typeSel.innerHTML = ['all', ...used].map(t =>
      `<option value="${esc(t)}">${t === 'all' ? '타입' : esc(t)} ${
        t === 'all' ? inCat.length : inCat.filter(i => i.type === t).length}</option>`).join('');
    typeSel.value = V.type;
  } else { typeSel.hidden = true; typeSel.innerHTML = ''; }

  /* 사이드바(데스크톱) — 같은 데이터를 세로 목록으로. 탭과 주종을 각각 한 섹션.
     주종 4개를 위 catSel 과 같은 이유로 늘 전부 보여준다. 전에는 하나뿐이면
     `위스키 9 / 전체 9` 처럼 같은 수가 겹쳐 보여 '전체'만 남겼는데, 이제는 나머지가
     0건으로라도 항상 나열되므로 더 이상 겹치지 않는다. */
  const segHTML = c =>
    `<button class="seg${V.cat === c ? ' on' : ''}" data-cat="${esc(c)}">${
      c === 'all' ? '전체' : esc(c)}<b>${
      c === 'all' ? inTabItems.length : (catCount[c] || 0)}</b></button>`;
  const sideCats = [...cats, 'all'];
  $('#sideNav').innerHTML =
      '<div class="navsec">구분</div>' + TABS.map(tabHTML).join('')
    + '<div class="navsec">주종</div>' + sideCats.map(segHTML).join('');

  /* 적용된 필터 개수를 버튼 배지로, 각 필터를 지울 수 있는 칩으로 보여준다 */
  const act = [];
  if (V.status !== 'all') act.push(['status', (STATUS_OPTS.find(o => o[0] === V.status) || [, V.status])[1]]);
  if (V.age !== 'all')    act.push(['age', (AGE_BANDS.find(b => b[0] === V.age) || [, V.age])[1]]);
  if (V.flavor !== 'all') act.push(['flavor', V.flavor]);
  /* 정렬도 필터 시트로 들어갔으므로 기본이 아니면 배지에 센다 —
     그러지 않으면 정렬이 걸린 것을 화면에서 알 방법이 없다 */
  const sortOn = V.sort !== 'recent';
  $('#fCount').textContent = (act.length + (sortOn ? 1 : 0)) || '';
  $('#btnFilter').classList.toggle('on', act.length > 0 || sortOn);
  /* 조건이 걸렸을 때만 초기화 버튼과 결과 수를 보여 준다.
     주종·타입은 여기 세지 않는다 — 3행 드롭다운에 그 상태가 그대로 보이므로
     초기화가 그것까지 지우면 "내가 안 건드린 것이 사라졌다"가 된다. */
  const narrowed = !!(V.q.trim() || act.length || sortOn);
  $('#btnReset').hidden = !narrowed;

  /* 사이드바 하단 요약 — 데스크톱 전용이라 세로 공간을 먹지 않는다. 폰의 요약 바는
     없앴지만(요청) 이쪽은 남긴다. statsLine 을 통계 시트와 공유하므로 수가 어긋날 수 없다.
     전에는 여기서 따로 세면서 `DB.items.length` 를 '보유' 라고 적었다 —
     경험·위시까지 포함한 전체 개수였고 통계 시트와 다른 수를 보여 주고 있었다. */
  const tabLab = (TABS.find(t => t[0] === V.tab) || [, ''])[1];
  $('#sideStats').innerHTML = inTabItems.length
    ? `<span class="sk">${esc(tabLab)}</span>`
      + statsLine(inTabItems, V.tab).split(' · ')
          .map(s => `<span class="sk">${s}</span>`).join('')
    : `<span class="sk">${esc(tabLab)} 0병</span>`;

  $('#btnView').textContent = V.view === 'grid' ? '☰' : '▦';
  /* aria-label 을 정적으로 두면 ☰/▦ 로 바뀌는 상태를 낭독기가 읽지 못한다 */
  $('#btnView').title = $('#btnView').ariaLabel =
    V.view === 'grid' ? '리스트로 보기' : '그리드로 보기';

  $('#grid').className = V.view === 'list' ? 'listv' : 'grid';
  $('#grid').innerHTML = items.map(V.view === 'list' ? rowHTML : cardHTML).join('');
  /* 결과가 없을 때 "다른 걸 시도해 보세요"는 도움이 안 된다 —
     지금 무엇이 걸러내고 있는지 보여 주고 한 번에 풀 수 있게 한다 */
  const narrowing = [];
  /* 탭도 조건이다 — 넣지 않으면 위시 탭에서 "조건에 맞는 병이 없습니다"만 보이고
     무엇이 걸러냈는지 알 수 없다 */
  if (V.tab !== 'all')    narrowing.push((TABS.find(t => t[0] === V.tab) || [, V.tab])[1]);
  if (V.q.trim())         narrowing.push(`검색어 "${esc(V.q.trim())}"`);
  if (V.cat !== 'all')    narrowing.push(`주종 ${esc(V.cat)}`);
  if (V.type !== 'all')   narrowing.push(`타입 ${esc(V.type)}`);
  act.forEach(([, t]) => narrowing.push(esc(t)));
  $('#emptyBox').innerHTML = items.length ? '' : (DB.items.length
    ? `<div class="empty"><h3>조건에 맞는 병이 없습니다</h3>
       <p>${DB.items.length}병 중 ${narrowing.length ? '아래 조건으로' : ''} 걸러낸 결과가 0건입니다.</p>
       ${narrowing.length ? `<div class="chips ecs">${
         narrowing.map(t => `<span class="chip">${t}</span>`).join('')}</div>
       <button class="btn gold ebtn" data-clrall="1">조건 모두 해제</button>` : ''}</div>`
    : `<div class="empty"><h3>첫 병을 등록해 보세요</h3>
       <p>우측 상단 <b>＋ 추가</b>에 이름만 입력하면<br>사양·테이스팅 노트 초안이 자동으로 채워집니다.</p></div>`);
}
/* 주종별 플레이스홀더 색조 — [배경 시작, 배경 끝, 유리·글자 색]
   테마에 따라 다른 세트를 쓴다 (라이트는 밝은 진열장, 다크는 캐비닛 조명) */
/* 라이트의 유리 색은 채도를 낮춰 둔다 — 원색에 가까우면 흰 배경 위에서
   유리가 아니라 사탕처럼 보였다 (다크는 어두운 판에 얹혀 그럴 일이 없다) */
const PH_LIGHT = {
  '위스키': ['#f5f0e6','#e8dfcd','#a9853f'],
  '리큐르': ['#f8f1f2','#eee3e6','#b28d95'],
  '기타주류': ['#f0f3f4','#e2e8ea','#8399a1'],
  '와인': ['#f5eff2','#e8dde3','#a1808d'],
};
const PH_DARK = {
  '위스키': ['#262229','#17171A','#C58B43'],
  '리큐르': ['#2A2126','#1A171A','#D9A2B0'],
  '기타주류': ['#1E2428','#15181A','#7FA6B4'],
  '와인': ['#2A1F26','#181418','#C08098'],
};
const phTone = it => {
  const set = document.documentElement.dataset.theme === 'dark' ? PH_DARK : PH_LIGHT;
  return set[it.cat] || set['위스키'];
};
/** 앰버 글래스 병 실루엣 — id 충돌을 피하려고 매번 고유 접미사를 붙인다 */
let phSeq = 0;
function bottleSVG(t){
  const u = 'p' + (++phSeq);
  return `<svg viewBox="0 0 120 190" aria-hidden="true">
    <defs>
      <linearGradient id="g${u}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="${t}" stop-opacity=".46"/>
        <stop offset=".45" stop-color="${t}" stop-opacity=".18"/>
        <stop offset="1" stop-color="${t}" stop-opacity=".40"/></linearGradient>
      <linearGradient id="l${u}" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="${t}" stop-opacity=".62"/>
        <stop offset="1" stop-color="${t}" stop-opacity="0"/></linearGradient>
    </defs>
    <path d="M48 8h24v34c0 7 22 14 22 40v88a12 12 0 0 1-12 12H38a12 12 0 0 1-12-12V82c0-26 22-33 22-40V8z"
      fill="url(#g${u})" stroke="${t}" stroke-opacity=".34" stroke-width="1.2"/>
    <path d="M28 118h64v50a10 10 0 0 1-10 10H38a10 10 0 0 1-10-10z" fill="url(#l${u})"/>
    <rect x="40" y="96" width="40" height="26" rx="3" fill="${t}" fill-opacity=".12"
      stroke="${t}" stroke-opacity=".26" stroke-width="1"/>
    <path d="M40 20h10v150" stroke="#fff" stroke-opacity=".14" stroke-width="2" fill="none"/>
  </svg>`;
}
/** small: 리스트용 축약 · hide: 사진 로드 실패 시에만 보이는 대체 블록 */
function phHTML(it, small, hide){
  const [a, b, t] = phTone(it);
  return `<div class="ph" style="${hide ? 'display:none;' : ''}--phA:${a};--phB:${b};--phT:${t}">`
    + `${bottleSVG(t)}<span>${esc(initials(it))}</span>`
    + `${small ? '' : '<small>이미지 없음</small>'}</div>`;
}
/** 오픈한 병의 잔량 (0~100) — 표시 대상이 아니면 null */
const levelOf = it => (it.status === '오픈' && it.remaining_pct !== '' && !isNaN(it.remaining_pct))
  ? Math.max(0, Math.min(100, Number(it.remaining_pct))) : null;
/** 카드 4번째 줄의 잔량 바 값. 상태에서 곧바로 정해지므로 어떤 병이든 값이 있다:
    미개봉 100 / 비움 0 / 오픈은 기록된 잔량(미기록이면 100).
    경험·위시는 보유 중이 아니라서 null — 빈 트랙으로 그려 줄 높이만 지킨다.
    levelOf 는 정렬·리스트가 함께 쓰므로 의미를 바꾸지 않고 따로 둔다. */
const barOf = it =>
    it.status === '미개봉' ? 100
  : it.status === '비움'   ? 0
  : it.status === '오픈'   ? (levelOf(it) === null ? 100 : levelOf(it))
  : null;

function badges(it, sc){
  return `${sc ? `<span class="sc">${sc}</span>` : ''}`
    + `${it.status === '경험' ? `<span class="trd">경험</span>` : ''}`
    + `${it.status === '위시' ? `<span class="trd">위시</span>` : ''}`
    + `${it.draft === '1' ? `<span class="dr">초안</span>` : ''}`;
}
/** 카드용 표식(경험·위시·초안) — 사진 좌상단에 얹는다.
    3번째 줄에 함께 두면 360px 기기에서 폭이 모자라 도수가 잘렸다:
    평점 4자 + 칩 + 도수 5자 + 가격 5자 = 132px 를 넘는다(실측). 평점·도수·가격은
    비교하며 읽는 값이라 줄에 남기고, 상태 표식만 여백이 있는 사진 위로 옮겼다. */
function cardMarks(it){
  const m = (it.status === '경험' ? '<span class="trd">경험</span>' : '')

  return m ? `<span class="cmark">${m}</span>` : '';

function cardHTML(it){
  const src = imgOf(it);
  const sc = bestScore(it), price = marketMid(it);
  /* 카드는 늘 네 줄이다 — 1) 타입·년산  2) 이름  3) 평점·기타·도수·가격

     .cfoot 안의 우선순위를 flex-shrink 로 잡아 뒀다(가격·평점은 고정). */
  const sub = [it.type, it.age && it.age !== 'NAS' ? it.age + 'Y' : ''].filter(Boolean).join(' · ');

/** 리스트 뷰 한 줄 — 133병을 훑을 때 그리드보다 빠르다 */
function rowHTML(it){

/* ── sheet ────────────────────────────────── */
/* ══════════════════════════════════════════
   안드로이드 뒤로가기 처리
   ① 시트가 열려 있으면 시트만 닫는다
   ② 목록에서 누르면 "한 번 더 누르면 종료" 안내 후, 2초 안에 다시 누를 때만 나간다
   ══════════════════════════════════════════ */
let backArmed = false, backTid = 0;
function pushGuard(kind){
  try{ history.pushState({wc: kind}, ''); }catch(e){}
}
/* 우리가 **스스로** 부른 history.back() 이 만든 popstate 를 한 번 건너뛴다.
   ⚠ 이것이 없으면: 확대 사진을 닫을 때 closeLightbox 가 클래스를 먼저 지우고
   history.back() 을 부르는데, 그때 popstate 핸들러가 보기엔 라이트박스가 이미 닫혀
   있어 **다음 분기인 closeSheet 로 떨어져 상세 화면까지 함께 닫혔다.**
   사용자에게는 "사진 닫았더니 목록으로 튕김" 으로 보였다. */
let backSkip = 0;
const guardBack = () => { backSkip++; try{ history.back(); }catch(e){ backSkip--; } };
window.addEventListener('popstate', () => {
  if (backSkip > 0){ backSkip--; return; }
  if ($('#lightbox')?.classList.contains('on')){ closeLightbox(true); pushGuard('root'); return; }
  if ($('#sheet').classList.contains('on')){ closeSheet(true); pushGuard('root'); return; }
  if (backArmed){ backArmed = false; history.back(); return; }   // 두 번째 → 실제로 나감
  backArmed = true;
  toast('뒤로가기를 한 번 더 누르면 앱이 닫힙니다');
  clearTimeout(backTid);
  backTid = setTimeout(() => { backArmed = false; }, 2000);
  pushGuard('root');
});

/* 후원 정보 — 바꿀 일이 생기면 이 한 곳만 고치면 된다.
   QR 과 '링크 열기' 는 목적이 다르므로 값을 분리해 둔다:
   QR 은 계좌이체(송금)로, 링크 열기는 소개 페이지로 간다. 둘을 같은 값으로
   두면 QR 을 찍어도 버튼과 똑같은 곳으로 가서 QR 이 있을 이유가 없어진다. */
const DONATE = {

  transfer: '',

};
/** 후원 시트. QR 은 그 자리에서 생성한다 — 외부 QR API 는 오프라인에서 빈칸이 된다 */
function openDonate(){

  openSheet('술술다이어리 후원', `
    <div class="qrbox">

      ${acct ? `<p class="qacct" id="qrAcct">${esc(acct)}</p>

    const cands = [].concat(DONATE.image);

/** act: 헤더(제목과 ✕ 사이)에 놓을 시트별 액션 HTML. 없으면 비운다 —
    이전 시트의 버튼이 남으면 엉뚱한 화면에서 눌린다. */
function openSheet(title, body, foot, act){
  /* 게임 제한시간 시계를 반드시 끈다. 화면 이동은 전부 이 함수를 지나므로 여기서
     정리하면 빠뜨릴 경로가 없다 — 남아 돌면 다른 화면에서 차례가 넘어간다.
     (필요한 화면이 자기 시계를 다시 켠다.) */
  if (typeof stopClock === 'function') stopClock();
  $('#shTitle').textContent = title;
  $('#shAct').innerHTML = act || '';
  $('#shBody').innerHTML = body;
  $('#shFoot').innerHTML = foot || '';
  $('#shBody').scrollTop = 0;
  /* 이전 시트의 핸들러를 반드시 지운다. addEventListener 로 붙이면 시트를 다시
     열 때마다 누적되어 토글이 두 번 실행돼 원상복귀한다(모바일에서 향·맛·여운
     아이콘이 안 켜지던 원인). 이 앱은 대입 방식만 쓴다. */
  $('#shBody').onclick = null; $('#shFoot').onclick = null;
  $('#shBody').oninput = null; $('#shBody').onchange = null;
  const wasOpen = $('#sheet').classList.contains('on');
  $('#scrim').classList.add('on'); $('#sheet').classList.add('on');
  if (!wasOpen) lockScroll();         // 이미 열려 있었다면 이중으로 잠그지 않는다
  if (!wasOpen) pushGuard('sheet');   // 뒤로가기가 앱을 닫는 대신 시트를 닫게 한다
}
/** fromBack: popstate 로 호출된 경우 history 를 다시 건드리지 않는다 */
function closeSheet(fromBack){
  if (typeof stopClock === 'function') stopClock();   // 시트를 닫으면 시계도 멈춘다
  const wasOpen = $('#sheet').classList.contains('on');
  $('#scrim').classList.remove('on'); $('#sheet').classList.remove('on');
  if (wasOpen) unlockScroll();
  /* 시트도 같다 — 이 back() 이 만든 popstate 가 흘러가면 "뒤로가기 한 번 더" 토스트가 뜬다 */
  if (!fromBack && history.state?.wc === 'sheet') guardBack();
}

/* ── 본문 스크롤 잠금 (iOS 대응) ─────────────
   `body{overflow:hidden}` 은 iOS Safari 에서 문서 스크롤을 막지 못한다.
   문서가 러버밴드로 계속 움직이고, position:fixed 인 시트는 iOS 에서
   **시각 뷰포트가 아니라 레이아웃 뷰포트**를 기준으로 배치되므로 그 움직임과
   어긋나 흔들려 보인다. 본문을 position:fixed 로 못박는 것이 iOS 에서 유효한
   유일한 방법이다. Android·PC 는 overflow:hidden 이 실제로 먹어서 재현되지 않는다.
   여러 겹(시트 위 라이트박스)이 열리므로 참조를 세어 마지막이 닫힐 때만 푼다. */
let lockN = 0, lockY = 0;
function lockScroll(){
  if (lockN++) return;                       // 이미 잠겨 있으면 스크롤 위치를 덮지 않는다
  lockY = window.scrollY || window.pageYOffset || 0;
  const b = document.body;
  b.style.position = 'fixed';
  b.style.top = -lockY + 'px';
  b.style.left = '0'; b.style.right = '0';
  b.style.width = '100%';
  b.style.overflow = 'hidden';               // iOS 외 브라우저용
}
function unlockScroll(force){
  if (force) lockN = 0; else if (--lockN > 0) return;
  lockN = 0;
  const b = document.body;
  b.style.position = ''; b.style.top = '';
  b.style.left = ''; b.style.right = ''; b.style.width = '';
  b.style.overflow = '';
  window.scrollTo(0, lockY);                 // 원래 보던 자리로 되돌린다
}
/* 키보드가 올라오면 iOS 는 시각 뷰포트만 줄인다 — 시트가 키보드 뒤로 밀리므로
   실제로 보이는 높이를 CSS 변수로 넘겨 시트가 그 안에 들어가게 한다.

   --vvh 만으로는 부족했다. 높이를 줄여도 bottom:0 은 레이아웃 뷰포트의 바닥이라
   시트 아래쪽이 자판에 덮인 채로 남는다. 그래서 **자판이 가리는 높이**를 --vvb 로
   따로 넘겨 시트를 그만큼 들어 올린다.

   두 플랫폼이 한 식으로 처리된다:
   · Android 크롬 — 뷰포트 메타의 interactive-widget=resizes-content 때문에
     innerHeight 자체가 줄어들어 gap ≈ 0 이 되고, bottom:0 이 이미 자판 위다.
   · iOS — 그 속성을 모르므로 innerHeight 는 그대로고 vv.height 만 줄어,
     gap 이 자판 높이가 된다.
   1px 미만은 버린다 — 주소창이 스크롤로 접힐 때 소수점이 흔들려서 시트가 떤다. */
(() => {
  const vv = window.visualViewport;
  if (!vv) return;
  const sync = () => {
    const gap = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    const st = document.documentElement.style;
    st.setProperty('--vvh', vv.height + 'px');
    st.setProperty('--vvb', (gap > 1 ? Math.round(gap) : 0) + 'px');
  };
  vv.addEventListener('resize', sync);
  vv.addEventListener('scroll', sync);
  sync();
})();
/* 포커스된 입력란을 자판 위로 끌어올린다.
   시트 높이가 줄어드는 것만으로는 이미 스크롤이 내려가 있던 폼에서 방금 누른 칸이
   화면 밖에 남는다. 자판이 올라온 뒤에 재야 하므로 시각 뷰포트의 resize 를 기다린다
   (setTimeout 상수는 기기마다 어긋난다). 안 오면 그때 한 번 보정한다. */
(() => {
  const near = el => {
    const b = $('#shBody'); if (!b || !el || !b.contains(el)) return;
    const r = el.getBoundingClientRect(), br = b.getBoundingClientRect();
    /* 라벨까지 같이 보이도록 위로 조금 더, 아래는 다음 칸이 살짝 보이도록 */
    if (r.top < br.top + 8) b.scrollTop -= (br.top + 8 - r.top);
    else if (r.bottom > br.bottom - 8) b.scrollTop += (r.bottom - br.bottom + 8);
  };
  document.addEventListener('focusin', e => {
    const el = e.target;
    if (!el.matches?.('input,select,textarea')) return;
    const vv = window.visualViewport;
    if (vv){
      const once = () => { vv.removeEventListener('resize', once); near(el); };
      vv.addEventListener('resize', once);
      setTimeout(() => { vv.removeEventListener('resize', once); near(el); }, 350);
    } else setTimeout(() => near(el), 350);
  });
})();

/* ── 시음 기록 ────────────────────────────── */
/** 날짜 → 경과 기간 문자열(접미사 없음). dayssince·daysAgo 가 이것을 공유한다 —
    따로 계산했을 때 같은 상세 화면에서 개봉 경과와 시음 경과의 개월 수가
    어긋났다(floor vs round, Date.now vs today). */
function sinceText(d){
  if (!d) return '';
  const n = Math.floor((new Date(today() + 'T00:00:00') - new Date(d + 'T00:00:00')) / 86400000);
  return n <= 0 ? '오늘' : n === 1 ? '어제' : n < 30 ? n + '일'
    : n < 365 ? Math.floor(n / 30) + '개월' : (n / 365).toFixed(1) + '년';
}
const dayssince = d => { const t = sinceText(d); return t && t !== '오늘' && t !== '어제' ? t + ' 경과' : t; };
/** 설치 안내.
    한 번 누르면 설치되는 버튼은 **Android·PC 크롬/엣지에서만** 가능하다
    (beforeinstallprompt → prompt()). iOS 는 프로그램으로 설치를 띄우는 API 가
    아예 없어 공유 시트를 거쳐야 한다 — 애플이 제공하지 않는다.
    그리고 카카오톡 같은 인앱 브라우저에서는 **양쪽 다 불가능**하므로,
    먼저 기본 브라우저로 나가게 만드는 것이 첫 단계다. */
function openInstall(){
  if (isInstalled()) return toast('이미 앱으로 설치되어 있습니다');
  /* ① 한 번 탭 설치가 가능한 경우 — 다른 안내 없이 바로 띄운다 */
  if (installEvt){
    const e = installEvt; installEvt = null;
    e.prompt();
    e.userChoice?.then(r => {
      if (r?.outcome === 'accepted') toast('설치했습니다 — 홈 화면에서 열어 보세요', 4000);
      else toast('설치를 취소했습니다. 설정에서 다시 시도할 수 있습니다', 3500);
    }).catch(() => {});
    return;

/* ══════════════ 삼각 레이더 차트 ══════════════
   향·맛·여운을 **0~100** 세 축으로 그린다. SVG 를 직접 만든다(차트 라이브러리를
   넣으면 무의존 원칙이 깨진다).
   **꼭짓점을 드래그해 입력하지 않는다** — 손가락으로 정확히 집기 어렵고 화면 낭독기로
   다룰 수 없다. 입력은 슬라이더 세 개로 하고 차트는 결과를 보여 준다. */
const RAD_AX = [['nose','향'], ['taste','맛'], ['finish','여운']];
/** 새 시음 기록을 열 때 세 슬라이더의 출발점. 실제 평가가 대체로 70점대에 모여 있어서
    0 에서 시작하면 매번 세 번을 끌어올려야 했다. 여기서 시작해 위아래로 조정한다.
    부작용을 알고 쓴다 — 슬라이더를 건드리지 않고 저장하면 70/70/70 이 기록된다
    ("점수를 비워 둔 기록"을 만들려면 세 축을 0 으로 내려야 한다). */
const RAD_DEF = 70;
function radarSVG(v, size){
  const S = size || 148, C = S / 2, R = S * 0.36;
  /* 12시부터 시계방향으로 세 축 */
  const pt = (i, r) => {
    const a = -Math.PI / 2 + i * 2 * Math.PI / 3;
    return [C + Math.cos(a) * r, C + Math.sin(a) * r];
  };
  const ring = f => RAD_AX.map((_, i) => pt(i, R * f).map(n => n.toFixed(1)).join(',')).join(' ');
  const vals = RAD_AX.map(([k]) => Math.max(0, Math.min(100, Number(v[k]) || 0)));
  const shape = vals.map((n, i) => pt(i, R * (n / 100)).map(x => x.toFixed(1)).join(',')).join(' ');
  const any = vals.some(n => n > 0);
  return `<svg class="radar" viewBox="0 0 ${S} ${S}" role="img"
      aria-label="향 ${vals[0]}, 맛 ${vals[1]}, 여운 ${vals[2]} (100점 기준)">
    ${[1, .667, .333].map(f =>
      `<polygon points="${ring(f)}" class="rg"/>`).join('')}
    ${RAD_AX.map((_, i) => {
      const [x, y] = pt(i, R);
      return `<line x1="${C}" y1="${C}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" class="rg"/>`;
    }).join('')}
    ${any ? `<polygon points="${shape}" class="rv"/>` : ''}
    ${vals.map((n, i) => { const [x, y] = pt(i, R * (n / 100));
      return n > 0 ? `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" class="rd"/>` : ''; }).join('')}
    ${RAD_AX.map(([, lab], i) => {
      const [x, y] = pt(i, R + S * 0.115);
      return `<text x="${x.toFixed(1)}" y="${(y + 3.5).toFixed(1)}" class="rt">${lab}</text>`;
    }).join('')}
  </svg>`;
}
/** 세 축(각 100점) → 내 점수. 세 값의 합 ÷ 3.
    세 축이 모두 0이면 계산하지 않는다(점수 칸을 빈 값으로 둔다). */
function radarScore(v){
  const ns = RAD_AX.map(([k]) => Number(v[k]) || 0);
  return ns.some(n => n > 0) ? String(Math.round(ns.reduce((a, b) => a + b, 0) / 3)) : '';
}

/** 이미지 출처 표기.
    위키미디어 사진은 CC BY-SA 등 라이선스가 있어 **출처와 파일을 밝혀야 한다.**
    이름만 적어 두면 저작자를 찾아갈 수 없으므로 Commons 파일 페이지로 링크한다.
    직접 촬영한 사진은 이용자 본인 것이므로 표기하지 않는다. */
function creditHTML(it){
  if (!it.image_credit) return '';
  const c = String(it.image_credit);
  /* "Wikimedia Commons — <파일명>" 형태에서 파일명을 꺼내 파일 페이지를 만든다 */
  const m = c.match(/—\s*(.+\.(?:jpe?g|png|webp|gif))\s*$/i);
  const url = m ? 'https://commons.wikimedia.org/wiki/File:' + encodeURIComponent(m[1].replace(/ /g, '_'))
    : (/^https?:\/\//.test(c) ? c : '');
  return `<p class="credit">이미지 출처: ${url
      ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(c)}</a>`
      : esc(c)}${m ? ' · 각 파일의 라이선스(CC BY-SA 등)를 따릅니다' : ''}</p>`;
}
/** 며칠 전인지 — 시음 기록은 '언제'보다 '얼마나 지났나'가 더 잘 읽힌다.
    dayssince 와 같은 계산을 쓴다(접미사만 다르다) — 따로 두었을 때 같은 상세 화면에서
    개봉 경과와 시음 경과의 개월 수가 어긋났다(floor vs round). */
const daysAgo = d => {
  const t = sinceText(d);
  /* '오늘'·'어제'는 그 자체로 시점이라 '전'을 붙이면 "어제 전"이 된다 */
  return t && t !== '오늘' && t !== '어제' ? t + ' 전' : t;
};
/** 시음 기록 타임라인.
    같은 병을 여러 번 마신 기록이 쌓이면 '점수가 어떻게 변했는지'가 이 화면의 값이다.
    그래서 최신순으로 세로 레일에 걸고, 직전 기록과의 점수 차이를 함께 보여 준다.
    개봉일이 있으면 '개봉 N일 후'를 붙여 산화 흐름을 읽을 수 있게 한다. */
function sessionsHTML(it){
  if (!it.sessions.length)
    return `<p class="hint">아직 시음 기록이 없습니다 — 마신 날의 인상을 남겨 두면 나중에 비교하기 좋습니다.</p>`;
  const sorted = [...it.sessions].sort((a, b) => (b.at || '').localeCompare(a.at || ''));
  /* 점수 변화는 시간순(오래된 것부터)으로 계산해야 방향이 맞다 */
  const older = [...sorted].reverse();
  const delta = {};
  let prev = null;
  older.forEach(s => {
    const v = Number(s.score);
    if (!isNaN(v) && s.score !== '' && s.score != null){
      if (prev !== null) delta[s.at + '|' + (s.note || '').slice(0, 12)] = +(v - prev).toFixed(1);
      prev = v;
    }
  });
  return `<div class="tline">${sorted.map(s => {
    const key = s.at + '|' + (s.note || '').slice(0, 12);
    const d = delta[key];
    const since = it.opened_at && s.at && s.at >= it.opened_at
      ? Math.round((new Date(s.at) - new Date(it.opened_at)) / 86400000) : null;
    return `<div class="sitem">
      <div class="sh">
        <b>${esc(s.at || '')}</b>
        <span class="sago">${esc(daysAgo(s.at))}</span>
        ${s.score ? `<span class="sc">${esc(s.score)}</span>` : ''}
        ${d != null && d !== 0
          ? `<span class="sdel2 ${d > 0 ? 'up' : 'dn'}" title="직전 기록 대비">${d > 0 ? '▲' : '▼'}${Math.abs(d)}</span>`
          : ''}
        <button class="sdel" data-sdel="${esc(key)}" title="삭제" aria-label="이 시음 기록 삭제">✕</button>
      </div>
      ${(s.place || s.mate || since !== null) ? `<div class="sm">${
        [s.place, s.mate, since !== null ? `개봉 ${since}일 후` : ''].filter(Boolean).map(esc).join(' · ')}</div>` : ''}
      ${s.note ? `<p>${esc(s.note)}</p>` : ''}

  }).join('')}</div>`;
}

      <button class="lnk" data-sess="add">＋ 시음 기록 추가</button>
      ${it.status === '미개봉' ? `<button class="lnk" data-act2="open">개봉 처리</button>` : ''}
      ${it.status === '위시' ? `<button class="lnk" data-act2="buy">구매로 전환</button>` : ''}
      ${it.status === '오픈' ? `<button class="lnk" data-act2="empty">비움 처리</button>` : ''}
    </div>

    ${sec('평점')}
    ${sc ? `<div class="rate"><div class="big">${sc}</div><div class="rm">${esc(ssrc)}<br>100점 기준</div></div>
            <div class="gauge"><i style="width:${Math.min(100, sc)}%"></i></div>` : ''}
    ${rl ? `<div class="rlist">${rl}</div>` : (sc ? '' : '<p class="hint">평점 정보가 없습니다.</p>')}

    ${sec('테이스팅 프로필')}
    <div class="tnote"><span class="lb">Nose · 향</span><p>${esc(it.nose) || '<span class="na">미기재</span>'}</p></div>
    <div class="tnote"><span class="lb">Taste · 맛</span><p>${esc(it.taste) || '<span class="na">미기재</span>'}</p></div>
    <div class="tnote"><span class="lb">Finish · 여운</span><p>${esc(it.finish) || '<span class="na">미기재</span>'}</p></div>

    ${it.notes ? `${sec('메모')}<p style="margin:0;font-size:13.5px;color:var(--ink2)">${esc(it.notes)}</p>` : ''}
    ${it.tags ? `<div class="bdgs" style="margin-top:12px">${it.tags.split(',').filter(Boolean)
      .map(t => `<span class="bdg">#${esc(t.trim())}</span>`).join('')}</div>` : ''}

    ${sec('데이터베이스 저장용 (CSV)')}
    <pre class="csv">${esc(quickCSV(it))}</pre>
    <div class="lrow">
      <button class="lnk" data-copy="md">기록 카드(Markdown) 복사</button>
      <button class="lnk" data-copy="csv">CSV 한 줄 복사</button>
    </div>
    <div class="lrow">
      <a class="lnk" target="_blank" rel="noopener" href="https://www.whiskybase.com/search?q=${nm}">Whiskybase ↗</a>
      <a class="lnk" target="_blank" rel="noopener" href="https://www.google.com/search?tbm=isch&q=${nm}+bottle">이미지 검색 ↗</a>
    </div>`;

  openSheet(fullName(it), body,
    `<button class="btn dgr" data-act="del">삭제</button>
     <button class="btn" data-act="dup">복제</button>
     <button class="btn pri" data-act="edit">편집</button>`);

  $('#shBody').onclick = e => {
    /* 사진 탭·더블클릭 → 확대 + 롤링 */
    const z = e.target.closest('[data-zoom]');
    if (z){
      [...$('#shBody').querySelectorAll('.shot')].forEach(s => s.classList.toggle('on', s === z));
      openLightbox(shots, +z.dataset.zoom);
      return;
    }
    /* 한 잔 / 더블 — 용량 기준으로 잔량을 깎는다 */
    const p = e.target.closest('[data-pour]');
    if (p){
      const next = pourOnce(it, Number(p.dataset.pour));
      it.updated_at = nowISO();
      save(); render(); openDetail(it.id);
      toast(next <= 0 ? '다 마셨습니다 — 비움으로 바꿨습니다' : `잔량 ${next}%`);
      return;
    }
    /* 상태 빠른 전환 */
    const a2 = e.target.closest('[data-act2]');
    if (a2){
      const k = a2.dataset.act2;
      if (k === 'open') setStatus(it, '오픈');
      if (k === 'empty') setStatus(it, '비움');
      if (k === 'buy'){ it.status = '미개봉'; it.purchase_date = it.purchase_date || today(); }
      it.updated_at = nowISO(); save(); render(); openDetail(it.id);
      toast(k === 'open' ? '개봉 처리했습니다' : k === 'empty' ? '비움 처리했습니다' : '구매로 전환했습니다');
      return;
    }
    /* 시음 기록 추가·삭제 */
    if (e.target.closest('[data-sess=add]')){ openSession(it.id); return; }
    const sd = e.target.closest('[data-sdel]');
    if (sd){
      if (!confirm('이 시음 기록을 삭제할까요?')) return;
      const [at, head] = sd.dataset.sdel.split('|');
      const i = it.sessions.findIndex(s => s.at === at && String(s.note || '').slice(0, 12) === head);
      if (i >= 0) it.sessions.splice(i, 1);
      it.updated_at = nowISO(); save(); render(); openDetail(it.id); toast('삭제했습니다');
      return;
    }
    const c = e.target.closest('[data-copy]'); if (!c) return;
    copy(c.dataset.copy === 'md' ? markdownCard(it) : quickCSV(it));
  };
  $('#shFoot').onclick = e => {
    const a = e.target.closest('[data-act]'); if (!a) return;
    if (a.dataset.act === 'edit') openEdit(it.id);
    if (a.dataset.act === 'dup'){
      const c = normalize({...it, id: uid(), name_ko: fullName(it) + ' (복제)', created_at: nowISO()});
      DB.items.unshift(c); save(); render(); openEdit(c.id); toast('복제했습니다');
    }
    if (a.dataset.act === 'del'){
      if (!confirm(`"${fullName(it)}"을(를) 삭제할까요?\n되돌릴 수 없습니다.`)) return;
      DB.items = DB.items.filter(x => x.id !== it.id);
      tomb(it); save(); render(); closeSheet(); toast('삭제했습니다');
    }
  };
}

/* ── 시음 UI 공용 조각 ─────────────────────────
   시음 기록과 블라인드 게임이 **같은 마크업**을 쓴다. 두 곳에 복제해 두면 한쪽만
   고쳐져 축 순서나 기본값이 어긋난다. p 는 id 접두어다('ss' 시음 · 'gg' 게임). */
/** 향·맛·여운 3축 레이더 + 슬라이더. 레이더는 결과 표시 전용이고 값은 슬라이더로 넣는다
    (꼭짓점 드래그는 손가락으로 정확히 집기 어렵고 화면 낭독기로 다룰 수 없다). */
function radarBlock(p, sub){
  return `<div class="radbox">
      <div class="radtop"><b id="${p}ScoreV">—</b><span>${esc(sub)}</span></div>
      <div class="radbody">
        <div class="radwrap" id="${p}Radar"></div>
        <div class="radsl">
          ${RAD_AX.map(([k, lab]) => `
            <div class="rsl">
              <label for="${p}_${k}">${ic(NOTES[k].icon)}${lab}</label>
              <input id="${p}_${k}" type="range" min="0" max="100" step="1" value="${RAD_DEF}" data-rax="${k}">
              <output id="${p}o_${k}">${RAD_DEF}</output>
            </div>`).join('')}
        </div>
      </div>
    </div>`;
}
/** 향·맛·여운 디스크립터 선택 3단. pre 는 축별 초기 선택 문자열.
    need 를 주면 축 머리에 **정답이 몇 개인지** 적는다 — 배점이 정답 개수로 정규화되므로
    개수를 모르면 몇 개를 골라야 할지 판단할 수가 없다(게임에서는 필수 정보다).
    몇 개인지만 알려 주고 **무엇인지는 알려 주지 않는다.** */
function noteSections(target, pre, need, cand, hint){
  return NOTE_AXES.map(ax => {
    const only = cand && cand[ax];
    return `
      <div class="nsec" data-nsec="${ax}" data-ntarget="${target}">
        <div class="nhead">${ic(NOTES[ax].icon)}
          <b>${NOTES[ax].label} (${NOTES[ax].en})</b>
          <span>${need && need[ax] ? `정답 <b class="nnum">${need[ax]}개</b>`
            : only ? `후보 <b class="nnum">${only.length}개</b>` : NOTES[ax].desc}</span>
          ${need || only ? `<u class="nsel" data-ncnt="${ax}">0 고름</u>` : ''}
          ${hint ? `<button type="button" class="nhint" data-nhint="${ax}">힌트</button>` : ''}</div>
        <div class="nwrap">${noteGrid(ax, (pre && pre[ax]) || '', false, only)}</div>
      </div>`; }).join('');
}

/* ── 시음 기록 입력 ─────────────────────────
   pre 를 주면 채워서 연다 — 게임(셀프 테스트) 결과를 시음 기록으로 옮길 때 쓴다.
   `{rad:{nose,taste,finish}, tags:{nose:[],taste:[],finish:[]}}`.
   **게임이 직접 it.sessions 에 쓰지 않고 이 화면을 채워서 여는 이유**는, 잔량 차감·
   평점 반영·미개봉 해제가 전부 이 함수의 저장부에 있기 때문이다. 저장 경로를 하나로
   두어야 두 갈래가 서로 어긋나지 않는다. 사용자는 여기서 장소·메모를 더하고 저장한다. */
function openSession(id, pre){
  const it = byId(id); if (!it) return;
  const preTags = {};
  if (pre && pre.tags) NOTE_AXES.forEach(ax => { preTags[ax] = (pre.tags[ax] || []).join(', '); });
  openSheet('시음 기록 · ' + fullName(it), `
    <!-- 향·맛·여운 3축 평가. 슬라이더로 넣고 삼각 레이더가 결과를 보여 준다.
         세 축의 평균 × 10 이 내 점수로 들어가되, 직접 덮어쓸 수 있다.
         점수는 그래프 상단에 크게. 슬라이더로만 정한다 —
         숫자를 직접 넣으면 그래프와 어긋나 어느 쪽이 참인지 알 수 없었다. -->
    ${radarBlock('ss', '내 점수 · 향·맛·여운 합 ÷ 3')}
    <div class="fg">
      <div class="f"><label>마신 날</label><input id="ssAt" type="date" value="${today()}"></div>
      <div class="f"><label>장소</label>
        <div class="pgrid">${PLACES.map(([v, icn]) =>
          `<button type="button" class="pcell" data-place="${esc(v)}"
            aria-pressed="false" title="${esc(v)}">${ic(icn)}<span>${esc(v)}</span></button>`).join('')}</div>
      </div>
    </div>
    <!-- 향·맛·여운을 메모보다 위에 둔다 — 고른 결과가 메모에 쌓이므로
         고르는 곳이 위, 결과가 아래여야 순서대로 읽힌다 -->
    ${noteSections('ssNote', preTags)}
    <div class="fg">
      <div class="f wide"><label>인상 · 메모</label>
        <textarea id="ssNote" rows="4" placeholder="위에서 고른 항목이 여기에 정리됩니다. 자유롭게 고치세요."></textarea></div>
      <div class="f wide"><label>함께한 사람</label>
        <input id="ssMate" placeholder="비워도 됩니다" autocomplete="off"></div>
    </div>
    <label class="hint" style="display:flex;gap:7px;align-items:center;margin-top:11px;cursor:pointer">
      <input type="checkbox" id="ssPour" checked> 기록과 함께 잔량에서 한 잔(30ml) 차감
    </label>
    <p class="hint">점수를 넣으면 <b>가장 최근 기록의 점수</b>가 목록의 평점으로 표시됩니다.</p>`,
    `<button class="btn" data-act="cancel">취소</button>
     <button class="btn pri" data-act="save">기록 저장</button>`);
  /* ── 3축 평가 ──
     레이더는 결과 표시 전용이다. 값은 슬라이더로 넣는다(꼭짓점 드래그는 손가락으로
     정확히 집기 어렵고 화면 낭독기로 다룰 수 없다). */
  const R = {nose: RAD_DEF, taste: RAD_DEF, finish: RAD_DEF};
  if (pre && pre.rad) Object.assign(R, pre.rad);
  NOTE_AXES.forEach(ax => {
    const el = $('#ss_' + ax); if (el){ el.value = R[ax]; $('#sso_' + ax).textContent = R[ax]; }
  });
  const paintRadar = () => {
    $('#ssRadar').innerHTML = radarSVG(R);
    const auto = radarScore(R);
    $('#ssScoreV').textContent = auto || '—';
  };
  /* 대입으로 붙인다 — addEventListener 는 시트를 다시 열 때마다 누적된다 */
  $('#shBody').oninput = e => {
    const r = e.target.closest('[data-rax]');
    if (r){
      R[r.dataset.rax] = Number(r.value);
      $('#sso_' + r.dataset.rax).textContent = r.value;
      paintRadar();
      return;
    }
    /* 메모를 직접 고칠 때는 칩 표시만 맞춘다 — syncNote 를 부르면 타이핑을 덮어쓴다 */
    if (e.target.id === 'ssNote') paintPlace(true);
  };
  /* 디스크립터 선택 → 메모 앞에 "향: … / 맛: …" 형태로 넣는다.
     사용자가 쓴 문장은 아래에 그대로 남긴다. */
  /* 메모 머리말은 "장소:" / "향:" / "맛:" / "여운:" 네 줄까지다.
     사용자가 그 아래에 쓴 글은 절대 건드리지 않고, 머리말만 갈아 낸다.
     머리말 자체를 사용자가 고쳐도 되게 — 다시 고르면 그때 다시 정리된다. */
  /* 메모의 머리말 = "집 : 상세" 한 줄 + 향/맛/여운 줄. 그 아래는 사용자 글이며
     절대 건드리지 않는다. 장소 상세("집 : 친구집" 의 '친구집')도 보존한다 —
     칩을 다시 눌러 라벨을 바꿔도 뒤에 쓴 글은 남는다. */
  const HEAD_RE = new RegExp(
    '^(?:(?:' + PLACE_LABELS.join('|') + ') : ?[^\n]*\n?)?(?:(?:향|맛|여운): [^\n]*\n?)*');
  let placeSel = '';                       // 지금 켜진 장소 라벨
  const syncNote = () => {
    const ta = $('#ssNote');
    const m = placeLine(ta.value);
    const detail = m ? m[2].trim() : '';   // 라벨 뒤에 사용자가 쓴 상세
    const parts = [
      placeSel ? `${placeSel} : ${detail}` : '',
      ...['nose','taste','finish'].map(ax => {
        const on = [...document.querySelectorAll(`[data-nsec="${ax}"] .ncell.on`)]
          .map(b => b.dataset.npick);
        return on.length ? `${NOTES[ax].label}: ${on.join(', ')}` : '';
      })].filter(Boolean).join('\n');
    const free = ta.value.replace(HEAD_RE, '').replace(/^\n+/, '');
    ta.value = parts ? parts + (free ? '\n' + free : '') : free;
  };
  /** 칩 표시를 메모 첫 줄과 맞춘다. fromNote=true 면 메모를 다시 쓰지 않는다
      (사용자가 타이핑하는 중이므로 덮어쓰면 커서가 튄다) */
  const paintPlace = (fromNote) => {
    if (fromNote){
      const m = placeLine($('#ssNote').value);
      placeSel = m ? m[1] : '';
    }
    [...document.querySelectorAll('[data-place]')].forEach(b => {
      const on = b.dataset.place === placeSel;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on);
    });
    if (!fromNote) syncNote();
  };
  $('#shBody').onclick = e => {
    const pl = e.target.closest('[data-place]');
    if (pl){
      /* 같은 것을 다시 누르면 해제 — 잘못 눌렀을 때 되돌릴 방법이 있어야 한다 */
      placeSel = (placeSel === pl.dataset.place) ? '' : pl.dataset.place;
      paintPlace();
      return;
    }
    const pk = e.target.closest('[data-npick]');
    if (pk){
      pk.classList.toggle('on');
      pk.setAttribute('aria-pressed', pk.classList.contains('on'));
      syncNote();
      return;
    }
    const mr = e.target.closest('[data-nmore]');
    if (mr){
      const sec = mr.closest('[data-nsec]'), ax = sec.dataset.nsec;
      const on = [...sec.querySelectorAll('.ncell.on')].map(b => b.dataset.npick).join(', ');
      const open = !mr.dataset.nopen;
      sec.querySelector('.nwrap').innerHTML = noteGrid(ax, on, open);
      if (open) sec.querySelector('[data-nmore]').dataset.nopen = '1';
    }
  };
  paintRadar();
  /* 게임에서 넘어왔다면 고른 항목을 메모 머리말로 한 번 정리해 준다 — 칩은 이미 켜져
     있지만 메모는 비어 있어서, 저장하면 무엇이 남는지 눈으로 확인할 수 없다 */
  if (pre && pre.tags) syncNote();

  $('#shFoot').onclick = e => {
    const a = e.target.closest('[data-act]'); if (!a) return;
    if (a.dataset.act === 'cancel') return openDetail(it.id);
    const s = {
      at: $('#ssAt').value || today(),
      score: radarScore(R),
      /* 장소는 메모 첫 줄에서 뽑는다 — 화면에 입력칸이 따로 없다 */
      place: (() => { const m = placeLine($('#ssNote').value);
        return m ? (m[1] + (m[2].trim() ? ' ' + m[2].trim() : '')) : ''; })(),
      mate: $('#ssMate').value.trim(),
      note: $('#ssNote').value.trim(),
      /* 3축 값을 기록에 남긴다 — 나중에 타임라인에서 삼각형을 다시 그릴 수 있다 */
      ...(radarScore(R) ? {nose: R.nose, taste: R.taste, finish: R.finish} : {}),
    };
    if (!s.score && !s.note && !s.place){ toast('점수·메모·장소 중 하나는 입력해 주세요'); return; }
    it.sessions.push(s);
    /* 최근 기록의 점수를 내 점수로 반영 */
    const latest = [...it.sessions].sort((x, y) => (y.at || '').localeCompare(x.at || ''))
      .find(x => x.score);
    if (latest) it.rating_my = latest.score;
    /* 미개봉이었다면 자동 개봉 처리 — 개봉일은 이 기록의 날짜로 잡는다 */
    if (it.status === '미개봉') setStatus(it, '오픈', s.at);
    if ($('#ssPour').checked && it.status === '오픈') pourOnce(it, 30);
    it.updated_at = nowISO();
    save(); render(); openDetail(it.id); toast('시음 기록을 저장했습니다');
  };
}

/* ══════════════ 블라인드 테이스팅 게임 ══════════════
   내 컬렉션에서 몇 병을 골라 잔에 붓고, 어느 잔이 어느 병인지 맞힌다.

   **정답은 내가 기록해 둔 노트다.** 처음 기획은 "공식 테이스팅 노트" 를 정답으로
   두려 했지만 kb.js 의 제품 229개 중 노트가 있는 것은 3개뿐이고, 컬렉션의 노트는
   초안 엔진이 넣은 산문이라(`짙은 피트 스모크, 타르`) 디스크립터 84개와 정확히
   일치하는 것이 축당 0~2개였다. 정답을 내 노트로 두면 서버도 AI 도 필요 없고,
   판정이 결정적이고, 정답의 출처를 사용자가 안다 — 그리고 게임의 질문이
   "이 위스키의 객관적 노트를 맞혀라" 에서 "내가 적어 둔 내 감각을 내가 다시
   알아맞히나" 로 바뀐다. 셀프 모드에서는 이쪽이 맞다.

   ⚠ 게임 기록을 `it.sessions` 에 넣지 않는다. 그 배열은 rating_my(최근 점수)와

const GAME_CATS = [

/* 축 점수는 **정답 개수로 정규화한다.** 정답 태그가 10개인 맛(30%)이면 개당 3%,

/* 레버를 직접 만지는 난이도. 프리셋 셋으로 안 맞는 조합이 있고(예: 후보는 좁히되

const LS_GOPT = 'wc.gopt';

const optDesc = o => [

const GAME_WB_FREE = 1;          /* kb.js 값은 `≈87 (참고)` 형태의 정수 근사치다 — 이 오차까지 만점 */

/* 잔 이름. 20잔까지 A~T 로 붙는다 — 동호회 시음회는 열 잔을 넘기므로 6잔은 좁았다.

/* ── 멀티(핫시트) ──────────────────────────

   기기를 넘기므로 **앞 사람의 답이 보이지 않아야 한다** — 차례마다 빈 양식으로

const GAME_MIN_P = 2, GAME_MAX_P = 10;
const GAME_TITLE = {solo:'셀프 테스트', self:'셀프 블라인드', multi:'멀티 블라인드'};

/* 제한시간. 30초 단위로 10분까지. 0 은 제한 없음.
   공정성 장치다 — 뒤에 하는 사람이 더 오래 굴릴 수 있으면 순서가 유리해진다. */

/* 게임 목록. **새 게임은 이 배열에 항목만 더하면 된다.**

const GAMES = [
  /* 1병 모드가 먼저다. 블라인드는 최소 2병이 필요하고 잔을 두 개 준비해야 하지만,
     이쪽은 지금 마시고 있는 한 병으로 바로 된다 — 진입 장벽이 가장 낮은 것이 첫 줄이다. */
  {key:'solo', name:'셀프 테스트', icon:'sparkle', on:true, line:'1병 · 감각 점검',
   desc:'병 하나를 정해 놓고 향·맛·여운을 매깁니다. 이름을 맞히는 것이 아니므로 그 10% 는 '

   desc:'컬렉션에서 몇 병을 골라 잔에 붓고, 어느 잔이 어느 병인지 맞힙니다. '
      + '정답은 <b>내가 기록해 둔 노트</b>입니다 — 내 감각이 내 기록과 얼마나 맞는지 재는 게임입니다.'},

/* 디스크립터 → 아이콘 계열. 계열이 동의어·상위개념을 묶어 준다
   (`건포도` · `말린 과일` · `셰리` = dried) — AI 없이 유의어 매칭이 되는 이유다. */
const NOTE_FAM = (() => {
  const m = {};
  NOTE_AXES.forEach(ax => NOTES[ax].list.forEach(([n, , icn]) => { m[ax + '|' + n] = icn; }));
  return m;
})();
/* 게임의 정답도 **편집 화면과 같은 matchTags 를 쓴다**(v2.0.0).
   전에는 gameTags 라는 별도 추출기가 아이콘 계열까지 무조건 넓혔다. 그래서 카드에
   보이는 태그와 게임 정답이 어긋났다 — 글렌피딕 `서양배, 풋사과, 옅은 오크 바닐라,
   꽃향` 에서 문장에 없는 **무화과·장미** 가 정답에 들어갔다(`꽃` 과 같은 계열이라서).
   계열 확장이 필요했던 이유는 정답이 너무 적어서였는데, matchTags 의 동의어·어형
   매칭이 그 문제를 해결했다(실측 매칭률 52% → 100%). 이제 넓힐 이유가 없다.

   난이도는 **점수 문턱**으로 가른다 — matchTags 가 이미 단계별 점수를 낸다.
   계열(0.7)은 어느 문턱에도 못 미치므로 정답에 들어가지 않는다. */
/** 한 병의 정답. **셋업에서 한 번만 계산해 고정한다** — 컬렉션을 나중에 고쳐도
    진행 중인 게임의 정답이 흔들리지 않아야 한다. */
function gameAnswer(it, opt){
  const min = (opt && opt.minScore) || GAME_MIN_SC;
  const tags = {}, miss = [];
  NOTE_AXES.forEach(ax => {
    tags[ax] = matchTags(ax, it[ax]).filter(x => x.score >= min).map(x => x.name);
    if (!tags[ax].length) miss.push(ax);
  });
  const num = v => { const m = String(v ?? '').match(/\d+(?:\.\d+)?/); return m ? parseFloat(m[0]) : null; };
  /* 숙성연수는 `NAS`(미표기) 가 있고 지역도 비어 있을 수 있다. 값이 없는 항목은
     `dead` 에 담아 배점을 비례로 흘려보낸다.
     ⚠ `miss` 와 섞지 않는다 — miss 는 **향·맛·여운 축이 비었다**는 뜻이고 셋업이
     그 병을 잠그는 근거다. NAS 라는 이유로 병이 잠기면 안 된다. */
  const a = {wb: num(it.rating_wb), abv: num(it.abv), age: num(it.age),
    region: String(it.region || '').trim() || null, tags, miss, dead: []};
  ['wb','abv','age','region'].forEach(k => { if (a[k] == null) a.dead.push(k); });
  return a;
}
/** 후보 좁히기(초급) — 정답 전부 + 오답 n 개를 섞어 돌려준다.
    **판을 만들 때 한 번만 뽑아 고정한다** — 잔을 다시 열 때마다 후보가 바뀌면
    앞서 고른 것이 목록에서 사라진다. */
function gameCand(ax, answer, n){
  const pool = NOTES[ax].list.map(x => x[0]).filter(x => !answer.includes(x));
  for (let i = pool.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  /* 정답이 앞에 몰려 있으면 세지 않아도 보이므로 전체를 다시 섞는다 */
  const out = [...answer, ...pool.slice(0, n)];
  for (let i = out.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

let GAME = null;                 /* 진행 중인 한 판 */
/* 5: 정답 추출이 matchTags 로 바뀌고 난이도가 fam(불리언) → minScore(점수 문턱)가 된 판.
   옛 판을 그대로 읽으면 opt.fam 이 무시돼 조용히 기본 문턱으로 채점된다 — 버린다. */
const GAME_VER = 5;
function loadGame(){
  try{ GAME = JSON.parse(localStorage.getItem(LS_GAME) || 'null'); }catch(e){ GAME = null; }
  /* 옛 판은 버린다. 한 판은 한 자리에서 끝나는 것이라 이어 붙일 값이 없고,
     답안 모양(my → mys)이 달라 억지로 읽으면 조용히 0점이 된다. */
  if (GAME && GAME.v !== GAME_VER){ GAME = null; saveGame(); }
}
function saveGame(){
  try{
    if (GAME) localStorage.setItem(LS_GAME, JSON.stringify(GAME));
    else localStorage.removeItem(LS_GAME);
  }catch(e){}
}
/** 참가자 pi 의 답안. 혼자 하는 모드는 참가자가 한 명이라 늘 0 번이다. */
const myOf = (g, pi) => (g && g.mys && g.mys[pi || 0]) || null;

/* ── 지난 기록 ──────────────────────────────
   게임이 끝난 뒤 친구들과 논평하려면 판이 남아 있어야 한다. `wc.glog` 에 최신순으로
   쌓고 GLOG_MAX 를 넘으면 오래된 것부터 버린다.

   **기록은 스스로 완결되어야 한다** — 저장 시점의 병 이름(`nm`)과 예상한 병 이름(`gnm`)을
   문자열로 함께 담는다. `itemId` 만 두면 나중에 병을 지우거나 이름을 고쳤을 때 지난
   기록이 `(삭제된 병)` 으로 변해 논평할 수 없다.
   `opt`·`cats` 도 담는다 — 채점을 다시 계산할 때 그때의 규칙을 써야 점수가 안 흔들린다.
   `cand`(초급 후보)는 입력 화면 전용이라 담지 않는다.

   실측: 3잔 3명 한 판이 3.6KB. 20개를 보관해도 71KB 다. */
const LS_GLOG = 'wc.glog';
const GLOG_MAX = 20;
function loadLog(){
  try{
    const v = JSON.parse(localStorage.getItem(LS_GLOG) || '[]');
    return Array.isArray(v) ? v : [];
  }catch(e){ return []; }
}
/** 저장한다. 용량이 넘치면 **가장 오래된 것을 버리며 재시도한다** —
    컬렉션(썸네일 data URI)이 같은 저장소를 쓰므로 조용히 실패하면 안 된다. */
function saveLog(arr){
  let a = arr.slice(0, GLOG_MAX);
  for (let i = 0; i < GLOG_MAX; i++){
    try{ localStorage.setItem(LS_GLOG, JSON.stringify(a)); return a.length; }
    catch(e){
      if (a.length <= 1){ try{ localStorage.removeItem(LS_GLOG); }catch(e2){} return 0; }
      a = a.slice(0, a.length - 1);      // 오래된 것부터 버린다
    }
  }
  return a.length;
}
/** 지금 판을 기록으로 굳힌다. 이름을 문자열로 박아 두어 나중에 병이 바뀌어도 남는다. */
function gameLogAdd(){
  if (!GAME) return null;
  const rec = {
    id: uid(), at: nowISO(),
    mode: GAME.mode, lv: GAME.lv, lvName: gameLevel(GAME.lv).name,
    timer: GAME.timer || 0, opt: {...GAME.opt}, cats: [...(GAME.cats || [])],
    players: [...gamePlayers()],
    glasses: GAME.glasses.map(g => {
      const it = byId(g.itemId);
      return {letter: g.letter, itemId: g.itemId, nm: it ? fullName(it) : (g.nm || ''),
        ans: g.ans,
        mys: (g.mys || []).map(my => {
          if (!my) return null;
          const gi = my.guessId ? byId(my.guessId) : null;
          return {...my, gnm: gi ? fullName(gi) : (my.gnm || '')};
        })};
    })};
  const arr = [rec, ...loadLog()];
  const kept = saveLog(arr);
  return {rec, kept, dropped: arr.length - kept};
}
function gameLogDel(id){
  saveLog(loadLog().filter(r => r.id !== id));
}

/* ── 제한시간 시계 ──────────────────────────
   ⚠ 이 앱은 타이머 기반 동작을 두지 않는 원칙이 있다(동기화에서 지웠다).
   이것은 예외이지만 성격이 다르다 — 사용자가 명시적으로 켠, 화면이 열려 있는 동안만
   도는 유한한 카운트다운이고, 만료되면 스스로 멈춘다.

   **누수가 유일한 위험이다.** 시계가 남아 돌면 다른 화면에서 갑자기 차례가 넘어간다.
   그래서 `openSheet` 에서 **무조건** 정리한다 — 이 앱의 모든 화면 이동이 그 함수를
   지나므로, 정리를 한 곳에 두면 빠뜨릴 경로가 없다. */
let GCLOCK = null;
function stopClock(){
  if (GCLOCK){ clearInterval(GCLOCK); GCLOCK = null; }
}
/** sec 초를 세고 0 에서 done() 을 부른다. `#ggClock` 이 있으면 남은 시간을 그린다. */
function startClock(sec, done){
  stopClock();
  let left = sec;
  const draw = () => {
    const el = $('#ggClock'); if (!el) return;
    el.textContent = mmss(left);
    /* 마지막 30초는 붉게 — 남은 시간을 숫자로만 두면 눈치채지 못한다 */
    el.classList.toggle('warn', left <= 30);
  };
  draw();
  GCLOCK = setInterval(() => {
    left--;
    if (left <= 0){ stopClock(); draw(); done(); return; }
    draw();
  }, 1000);
}
/* G 를 넘기면 그 판을, 안 넘기면 진행 중인 판을 본다 — 지난 기록도 같은 화면으로
   그리기 위해 결과 쪽 함수는 전부 판을 인자로 받는다(숨은 전역 의존을 없앤다). */
const gamePlayers = (G) => ((G || GAME) && (G || GAME).players) || ['나'];
const isMulti = (G) => (G || GAME)?.mode === 'multi';
/** 이 잔의 실제 병 이름. 기록에는 `nm` 이 박혀 있어 병을 지워도 남는다. */
const glassName = g => {
  const it = byId(g.itemId);
  return it ? fullName(it) : (g.nm || '(삭제된 병)');
};

/* ── 채점 ──────────────────────────────────
   축 점수 = 배점 × clamp(0, 1, (일치 − 불일치/3) ÷ 정답개수).
   정답 태그가 10개인 맛(30%)이면 개당 3%, 다 맞히면 30%. 오답 5개가 더 붙으면
   30 − 5 = 25%. 정답 개수로 나누므로 **축마다 태그 수가 달라도 난이도가 같다.**
   0 아래로는 내려가지 않으므로 한 축에서 잃는 최대치는 그 축의 배점뿐이다.

   WB 점수가 **없는 병만** 그 20% 를 남은 항목에 비례 배분한다(사용자가 고칠 수 없는
   결손이므로). 정답 태그가 빈 축은 배분하지 않는다 — 대신 셋업에서 그런 병을
   고르지 못하게 막는다. */
/** 25.0 을 `25` 로 — 정규화 때문에 소수가 나오지만 화면에서는 끝의 .0 을 떼야 읽힌다 */
const gameNum = n => String(Math.round(n * 10) / 10).replace(/\.0$/, '');
/** 배점을 낸다. 켜진 항목의 가중치 합이 100 이 되도록 **비례 배분**한다 —
    항목을 켜고 끌 때마다 표를 고쳐 쓰지 않아도 총점이 늘 100 이다.

    **셀프 테스트는 병을 알고 시작하므로 `이름` 이 뜻이 없다** — 맞힐 것이 없는 항목을
    0점으로 남기면 총점이 만점에 닿지 못하므로, 그 몫을 **세 축에 고루** 나눈다.
    비례가 아니라 균등인 것은 결정된 규칙이다(WB 로도 흘리지 않는다).

    `miss` 는 이 병에서 **데이터가 없어 채점할 수 없는** 항목이다(WB 없음, NAS 등).
    사용자가 고칠 수 없는 결손이므로 그 몫도 비례로 흘려보낸다. */
function gameAlloc(mode, cats, miss){
  const on = new Set(cats && cats.length ? cats : gameCatsDefault());
  const dead = new Set(miss || []);
  const w = {};
  GAME_CATS.forEach(c => { w[c.k] = (on.has(c.k) && !dead.has(c.k)) ? c.w : 0; });
  if (mode === 'solo' && w.name){
    const share = w.name / NOTE_AXES.length;
    NOTE_AXES.forEach(ax => { w[ax] += share; });
    w.name = 0;
  }
  const sum = Object.values(w).reduce((a, b) => a + b, 0);
  if (sum) Object.keys(w).forEach(k => { w[k] = w[k] / sum * 100; });
  return w;
}
/** 거리 채점 — 오차 free 이하는 만점, zero 에서 0점, 사이는 선형 */
const gameDistPts = (d, max, c) => d == null ? 0
  : Math.round(max * Math.max(0, 1 - Math.max(0, d - c.free) / (c.zero - c.free)) * 10) / 10;
function scoreGlass(g, mode, pi, G){
  const src = G || GAME;
  const a = g.ans, my = myOf(g, pi) || {}, rows = [];
  const md = mode || (src && src.mode);
  const AL = gameAlloc(md, (src && src.cats), a.dead);
  /* 감점 분모. 0 이면 초급(빗나가도 깎지 않는다).
     **그 판의 규칙으로 계산한다** — 지난 기록을 지금 설정으로 채점하면 점수가 달라진다. */
  const pd = ((src && src.opt) || gameOpt()).penDiv;
  GAME_CATS.forEach(c => {
    const max = AL[c.k];
    /* 배점이 0 인 항목은 줄을 만들지 않는다 — 껐거나 데이터가 없어 채점 대상이 아니고,
       `0/0` 짜리 빈 줄이 결과에 남으면 "맞혀야 했는데 못 맞혔다"로 읽힌다 */
    if (!max) return;
    if (c.kind === 'pick'){
      rows.push({k:c.k, label:c.label, max,
        got: my.guessId && my.guessId === g.itemId ? max : 0});
      return;
    }
    if (c.kind === 'dist'){
      /* WB 는 **레이더의 내 점수(세 축 평균)를 그대로 쓴다.** 따로 입력칸을 두면 같은
         것을 두 번 묻는 셈이다. 도수·숙성연수는 각자 입력칸이 있다. */
      const raw = c.k === 'wb' ? my.score : (my[c.k] ?? '');
      const mine = raw === '' || raw == null ? null : Number(raw);
      const d = mine == null || isNaN(mine) ? null : Math.abs(mine - a[c.k]);
      rows.push({k:c.k, label:c.label, max, got: gameDistPts(d, max, c),
        diff:d, mine, real:a[c.k], unit:c.unit});
      return;
    }
    if (c.kind === 'exact'){
      const mine = (my[c.k] || '').trim();
      rows.push({k:c.k, label:c.label, max, mine, real:a[c.k],
        got: mine && mine === a[c.k] ? max : 0});
      return;
    }
    /* 축(향·맛·여운) — 정답 개수로 정규화한다.
       **힌트로 받은 답은 일치에서 뺀다**(hinted). 정보는 주되 점수는 주지 않는 것이
       힌트의 대가다 — 이러면 힌트 값을 따로 정하지 않아도 스스로 균형이 잡힌다. */
    const ans = new Set(a.tags[c.k] || []);
    const picks = (my.tags && my.tags[c.k]) || [];
    const hinted = ((my.hints && my.hints[c.k]) || []).filter(h => ans.has(h)).length;
    const hit = picks.filter(p => ans.has(p)).length, mis = picks.length - hit;
    const frac = ans.size
      ? Math.max(0, Math.min(1, (hit - hinted - (pd ? mis / pd : 0)) / ans.size)) : 0;
    rows.push({k:c.k, label:c.label, max, hit, miss:mis, hinted, na:!ans.size,
      need:ans.size, got: Math.round(max * frac * 10) / 10});
  });
  const max = rows.reduce((s, r) => s + r.max, 0);
  const got = rows.reduce((s, r) => s + r.got, 0);
  return {rows, got, max, pct: max ? Math.round(got / max * 100) : 0};
}
/** 참가자 pi 가 입력을 마친 잔 수 */
const gameDone = (pi) => (GAME?.glasses || []).filter(g => myOf(g, pi)?.filled).length;
/** 전체 차례 수 / 끝난 차례 수 — 멀티의 진행률은 잔 × 참가자다 */
const gameTurns = () => (GAME?.glasses?.length || 0) * gamePlayers().length;
const gameFilled = () => (GAME?.glasses || [])
  .reduce((s, g) => s + gamePlayers().reduce((t, _, pi) => t + (myOf(g, pi)?.filled ? 1 : 0), 0), 0);
/** 다음으로 입력해야 할 차례 {gi, pi}. 없으면 null (전부 끝) —
    잔이 바깥 루프다: 잔 A 를 참가자 전원이 마친 뒤 잔 B 로 간다. */
function gameNextTurn(){
  const gs = GAME?.glasses || [], n = gamePlayers().length;
  for (let gi = 0; gi < gs.length; gi++)
    for (let pi = 0; pi < n; pi++)
      if (!myOf(gs[gi], pi)?.filled) return {gi, pi};
  return null;
}

/* ── 게임 목록 ───────────────────────────── */
function openGames(){
  /* 진행 중인 판이 있으면 그것을 먼저 보여 준다 — 목록으로 돌아왔을 때
     이어서 할 방법이 없으면 판이 사라진 것처럼 보인다. */
  if (GAME) return openGameBoard();
  const logN = loadLog().length;
  openSheet('GAME', `
    <div class="glist">
      ${GAMES.map(g => `
        <button type="button" class="gcard${g.on ? '' : ' goff'}" data-game="${g.key}"
          ${g.on ? '' : 'aria-disabled="true"'}>
          <span class="gletter">${ic(g.icon)}</span>
          <span class="gmeta">
            <b>${esc(g.name)}${g.on ? '' : ' <em>준비 중</em>'}</b>
            <i>${esc(g.line)}</i>
            <span>${g.desc}</span>
            ${g.off ? `<span class="hint">${esc(g.off)}</span>` : ''}
          </span>
        </button>`).join('')}
      <!-- 지난 기록. 게임이 아니라 보관함이라 목록 끝에 두고 모양을 달리한다 -->
      <button type="button" class="gcard glogb" data-logs="1">
        <span class="gletter">${ic('book')}</span>
        <span class="gmeta">
          <b>지난 기록${logN ? ` <em>${logN}개</em>` : ''}</b>
          <i>끝난 판 다시 보기</i>
          <span>${logN
            ? '친구들과 논평할 수 있게 판이 그대로 남아 있습니다.'
            : `게임을 마치고 <b>기록 저장</b>을 누르면 여기에 쌓입니다 (최대 ${GLOG_MAX}개).`}</span>
        </span>
      </button>
    </div>`,
    `<button class="btn" data-act="close">닫기</button>`);
  $('#shBody').onclick = e => {
    if (e.target.closest('[data-logs]')) return openGameLogList();

    const g = GAMES.find(x => x.key === c.dataset.game);
    if (!g?.on) return toast('아직 준비 중입니다');
    openGameSetup(g.key);
  };
