/* ══════════════ design tokens ══════════════ */
:root{
  color-scheme:light;
  --bg:#faf8f5;
  --surface:#fff;
  --surface2:#f5f2ec;
  --line:#eae4da;
  --line2:#dcd4c6;
  --ink:#1c1815;
  --ink2:#6b6258;
  --ink3:#767065;
  --accent:#a2601b;
  --accent2:#c9962f;
  --accent-bg:#fdf6ea;
  --accent-line:#ecdcbe;
  --ok:#4d7a55;
  --warn:#b0812a;
  --off:#a7a19a;
  --danger:#a8503c;
  --on-accent:#fff;        /* accent 로 채운 면 위의 글자색 */
  /* --ink3 는 9.5~11px 작은 글씨(카드 키커·힌트·날짜·잔량 %)에 쓰인다.
     이전 값 #9c938a 는 흰 카드 대비 3.02 / 페이지 배경 대비 2.85 로
     WCAG AA(4.5)에 크게 못 미쳤다. 작은 글씨에 낮은 대비가 겹쳐 밝은 곳에서
     읽기 어려웠다. #767065 는 4.91 / 4.63 으로 두 배경 모두 통과한다.
     다크의 #8E8E93 은 surface 대비 5.21 로 이미 통과하므로 그대로 둔다. */
  --r:16px; --r2:12px;
  --sh1:0 1px 2px rgba(28,24,21,.04), 0 4px 14px -8px rgba(28,24,21,.10);
  --sh2:0 2px 8px rgba(28,24,21,.06), 0 26px 50px -26px rgba(28,24,21,.32);
  --serif:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,
    "Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",
    "Segoe UI","Noto Sans KR",system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
/* ── Speakeasy Lounge (다크 토글) ───────────────────────────────
   High-end Speakeasy Lounge · Premium Whisky Collector's Cabinet
   기본 테마는 라이트이며, 사용자가 ⚙️에서 전환할 때 이 팔레트가 적용된다. */
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121214;            /* Dark Slate */
  --surface:#1C1C1F;       /* Dark Charcoal */
  --surface2:#232327;
  --line:#2C2C31;
  --line2:#3A3A41;
  --ink:#FFFFFF;
  --ink2:#C9C9CE;
  --ink3:#8E8E93;          /* Subtitle Gray */
  --accent:#C58B43;        /* Rich Amber Gold */
  --accent2:#D4AF37;       /* Muted Gold */
  --beige:#E5D3B3;         /* Warm Beige */
  --accent-bg:#241B10;
  --accent-line:#4A3620;
  --ok:#6FBF7A; --warn:#D4AF37; --off:#5A5A61; --danger:#c0503c;
  --on-accent:#1a1409;
  /* 사진 패널은 다크에서도 순백 — 정규화 썸네일이 대부분 밝은 여백을 데이터에
     구워 넣으므로(box.fill), 패널만 따뜻하게 하면 그 썸네일과 색이 어긋난다 */
  --shot:#FFFFFF;
  --sh1:0 1px 2px rgba(0,0,0,.50), 0 8px 24px -14px rgba(0,0,0,.90);
  --sh2:0 8px 20px rgba(0,0,0,.55), 0 30px 60px -30px rgba(0,0,0,1);
}
/* 라이트 테마의 사진 패널은 순백 */
:root{ --shot:#ffffff; --beige:#8a6a2f; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* overscroll-behavior-y:none — 폰에서 목록을 끝까지 넘겼을 때 문서가 러버밴드로
   따라 흔들리고(iOS) 당겨서 새로고침이 걸리는(Android) 것을 함께 막는다.
   화면이 "디바이스 크기에 고정되지 않고 흔들린다"고 보고된 현상이 이것이다.
   시트 안쪽(.sh-body)은 이미 overscroll-behavior:contain 으로 따로 막혀 있다. */
html,body{margin:0;padding:0;overscroll-behavior-y:none}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.6;
  min-height:100dvh; -webkit-text-size-adjust:100%;
  /* Cormorant 의 기본 숫자는 올드스타일이라 4·9 가 베이스라인 아래로 내려간다.
     도수·가격·평점처럼 한글과 나란히 읽는 수치에서 들쭉날쭉해 보이므로
     라이닝으로 고정한다. 산세리프는 이미 라이닝이라 영향이 없다. */
  font-variant-numeric:lining-nums;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
a{color:var(--accent);text-underline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ══════════════ header ══════════════ */
header.top{
  position:sticky;top:0;z-index:30;
  padding:calc(var(--safe-t) + 12px) 16px 11px;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:9px}
.brand{flex:1;min-width:0;display:flex;align-items:baseline;gap:9px}
/* 워드마크 — 로마자는 세리프가 잘 어울린다. Diary 만 앰버로 강조 */
.wm{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:-.005em;line-height:1}
.wm b{color:var(--accent);font-weight:600}
.wm2{font-size:9.5px;letter-spacing:.16em;color:var(--ink3);font-weight:600;white-space:nowrap}
/* 상단바의 병 수 표기(.cnt/#hdCnt)는 제거했다 — 주종 세그먼트와 통계가 같은 수를
   이미 보여 주고 있어서 워드마크 옆 숫자는 읽을 이유가 없었다. */
@media(max-width:420px){ .wm2{display:none} }
.ib{
  width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;
  background:var(--surface);border:1px solid var(--line);color:var(--ink2);font-size:15px;
  box-shadow:var(--sh1);transition:.15s;
}
.ib:active{transform:scale(.94)}
/** 아이콘은 currentColor 로 그린다 — 컬러 이모지는 다크 테마에서 흰 판으로 떠 보였다 */
.ib svg{
  width:18px;height:18px;fill:none;stroke:currentColor;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
}
.ibwrap{position:relative;flex:none;display:inline-flex}
.syncdot{
  position:absolute;top:-1px;right:-1px;width:9px;height:9px;border-radius:50%;
  border:2px solid var(--bg);background:transparent;transition:.2s;pointer-events:none;
}
.syncdot.busy{background:var(--warn);animation:sdp 1.1s ease-in-out infinite}
.syncdot.ok{background:var(--ok)}
.syncdot.err{background:var(--danger)}
@keyframes sdp{50%{opacity:.3}}
.cta{
  height:36px;padding:0 15px;border-radius:11px;flex:none;
  background:var(--ink);color:var(--bg);font-weight:600;font-size:13.5px;letter-spacing:-.01em;
  box-shadow:var(--sh1);transition:.15s;
}
:root[data-theme="dark"] .cta{background:var(--accent);color:var(--on-accent)}
.cta:active{transform:scale(.96)}

/* ══════════════ controls ══════════════ */
.wrap{max-width:1120px;margin:0 auto;padding:0 16px calc(80px + var(--safe-b))}
/* 다섯 행에서 세 행으로 줄였으니 간격도 같이 좁힌다 — 행이 적을수록 사이가 넓어 보인다.
   행 높이(44/46/40)는 더 못 줄인다: 컨트롤이 38px 이고 44px 히트 영역을 지켜야 한다
   (40px 미만 컨트롤 15개를 찾아 고친 UX 감사 결과다). */
.controls{padding-top:10px;display:flex;flex-direction:column;gap:8px}
.search{position:relative}
.search input{
  width:100%;height:44px;padding:0 40px;border-radius:13px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh1);
}
.search input::placeholder{color:var(--ink3)}
.search input:focus{outline:none;border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-bg)}
.search .mg{position:absolute;left:14px;top:12px;color:var(--ink3);font-size:15px}
.search .mg svg{
  width:16px;height:16px;display:block;fill:none;stroke:currentColor;
  stroke-width:1.9;stroke-linecap:round;
}
.search .cl{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:8px;color:var(--ink3)}
/* 주종 세그먼트 — 최상위 구분이므로 필터 칩과 형태를 다르게 한다 */
.segs{
  display:flex;gap:3px;padding:3px;border-radius:12px;
  background:var(--surface2);border:1px solid var(--line);
  overflow-x:auto;scrollbar-width:none;
}
.segs::-webkit-scrollbar{display:none}
.segs:empty{display:none}
.seg{
  flex:1 1 auto;min-width:max-content;padding:7px 10px;border-radius:9px;
  font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap;
  letter-spacing:-.02em;transition:.15s;
}
.seg b{font-weight:600;color:var(--ink3);margin-left:4px;font-size:11px}
.seg.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh1)}
.seg.on b{color:var(--accent)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:1px}
.chips::-webkit-scrollbar{display:none}
/* 주종 칩과 타입 칩을 한 줄에 담는다. 둘은 "이 병이 무엇인가"라는 같은 질문이라
   한 행에 모아도 읽히고, 상단 세로 줄 수를 늘리지 않는다(탭이 세그먼트 행을 쓴다).
   각자 .chips 라 안쪽에서 스크롤되면 두 그룹이 따로 움직여 어긋난다 — 스크롤은
   이 부모가 하고 자식은 넘치지 않게 둔다. */
/* ══════════════ 1행 — 검색 + 필터 + 뷰 ══════════════
   세 개를 한 줄에 둔다. 검색이 남는 폭을 다 쓰고 버튼 둘은 고정 폭이다. */
.srow{display:flex;gap:7px;align-items:center}
.srow .search{flex:1;min-width:0}
.sqb{
  flex:none;width:38px;height:38px;border-radius:10px;position:relative;
  background:var(--surface);border:1px solid var(--line);color:var(--ink2);
  display:grid;place-items:center;font-size:14px;
}
.sqb svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round}
.sqb:active{background:var(--surface2)}
/* 적용된 개수 배지 — 버튼 위에 얹어 폭을 늘리지 않는다 */
.sqb b{
  position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;padding:0 4px;
  border-radius:9px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;
  display:grid;place-items:center;line-height:1;
}
.sqb b:empty{display:none}
.sqb.on{background:var(--accent-bg);border-color:var(--accent-line);color:var(--accent)}
/* GAME 은 아이콘이 아니라 글자다 — 나머지 정사각 버튼과 성격이 달라(놀이) 눈에
   띄어야 하고, 아이콘 하나로는 "게임" 이 읽히지 않는다. 폭만 글자에 맞춰 넓힌다. */
.gameb{
  width:auto;padding:0 11px;font:800 11.5px/1 var(--sans);letter-spacing:.06em;
  background:var(--accent-bg);border-color:var(--accent-line);color:var(--accent);
}

/* ══════════════ 3행 — 주종 ▾ + 타입 ▾ + 필터 + 초기화 + 보기 ══════════════
   가로 스크롤을 쓰지 않는다. 이 행에 스크롤을 두면 PC 에서 창을 좁혔을 때
   **마우스로 닿을 수 없는 항목이 생긴다**(스크롤바를 숨겼고 휠은 세로만 구른다).
   드롭다운 둘이 남는 폭을 나눠 갖고, 버튼 셋은 고정 폭(38px)이다.
   조건을 고르는 것(드롭다운)과 만지는 것(필터·초기화)을 한 행에 모았고, 2행은
   검색과 GAME 만 남았다. 개수 표기는 없앴다 — 1행 술장 탭이 이미 세어 주고,
   그 폭이 있어야 버튼 셋이 여기 들어온다.
   360px 실측: 93 + 93 + 38×3 + 간격 28 = 328, 가로 스크롤 없음. */
.chiprow{display:flex;gap:7px;align-items:center;min-width:0}
.chiprow > .sel{flex:1;min-width:0;text-overflow:ellipsis}
.catsel{font-weight:600;color:var(--ink)}
/* 고를 것이 하나뿐이면 자리를 비운다 — 눌러도 아무 일이 없는 컨트롤은 두지 않는다 */
.chiprow > .sel[hidden]{display:none}
.chiprow .cnt{
  flex:none;font-size:11px;color:var(--ink3);white-space:nowrap;letter-spacing:-.02em;
}
.chiprow .cnt:empty{display:none}
.chip{
  flex:none;padding:6px 13px;border-radius:999px;font-size:12.5px;
  background:var(--surface);border:1px solid var(--line);color:var(--ink2);white-space:nowrap;
  transition:.15s;
}
.chip b{color:var(--ink3);font-weight:600;margin-left:3px}
.chip.on{background:var(--accent-bg);border-color:var(--accent-line);color:var(--accent);font-weight:600}
.chip.on b{color:var(--accent2)}
/* 우측 패딩이 26px 이었다 — 화살표(5px)에 그만큼 필요하지 않다. 16px 로 줄여
   글자칸 10px 을 되찾는다. 360px 3행에서 이 10px 이 `주종 145` 의 병 수가
   보이느냐 잘리느냐를 갈랐다(글자칸 55px → 65px, 라벨 필요폭 61px). */
.sel{
  height:33px;padding:0 16px 0 10px;border-radius:9px;background:var(--surface);
  border:1px solid var(--line);color:var(--ink2);font-size:12.5px;
  appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),
    linear-gradient(135deg,var(--ink3) 50%,transparent 50%);
  background-position:calc(100% - 9px) 14px, calc(100% - 4px) 14px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
/* 초기화 버튼 — 조건이 걸렸을 때만 보인다. 위험색은 쓰지 않는다(되돌릴 수 있는 동작이다) */
#btnReset:not([hidden]){color:var(--accent);border-color:var(--accent-line);background:var(--accent-bg)}

/* ══════════════ grid ══════════════ */
.grid{display:grid;gap:12px;margin-top:16px;grid-template-columns:repeat(auto-fill,minmax(152px,1fr))}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;display:flex;flex-direction:column;text-align:left;
  box-shadow:var(--sh1);transition:transform .16s, box-shadow .16s;
}
.card:active{transform:scale(.982)}
@media(hover:hover){ .card:hover{box-shadow:var(--sh2);transform:translateY(-2px)} }
.thumb{
  position:relative;aspect-ratio:3/4;background:var(--shot);overflow:hidden;
  display:grid;place-items:center;border-bottom:1px solid var(--line);
}
/* 절대 위치로 빼야 원본 이미지의 내재 높이가 3:4 프레임을 밀어내지 못한다.
   채우기는 normalizeThumb 이 캔버스에 구워 넣는다(사진은 cover, 병 컷은 높이 98%).
   CSS 확대 보정을 쓰지 않으므로 저장된 그림과 보이는 그림이 같다. */
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
/* 정규화 실패(CORS)한 원본은 여백을 알 수 없다 → cover 로 프레임만 채운다 */
.thumb.raw img{inset:0}
.ph{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;
  background:linear-gradient(170deg, var(--phA, #f3efe8), var(--phB, #e9e2d6));
}
.ph span{font-family:var(--serif);font-size:22px;color:var(--phT, #a98b52);letter-spacing:.03em;
  position:relative;z-index:1}
.ph small{font-size:9.5px;color:var(--ink3);letter-spacing:.06em;position:relative;z-index:1}
/* 앰버 글래스 병 실루엣 — SVG 자체가 알파를 가지므로 컨테이너는 거의 불투명하게 둔다 */
.ph svg{position:absolute;width:54%;max-width:96px;height:auto;opacity:.92}
/* 잔량 게이지 */
.lvl{height:3px;border-radius:2px;background:var(--surface2);overflow:hidden;margin-top:7px}
.lvl i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.lvlx{font-size:10.5px;color:var(--ink3);margin-left:auto}
/* 카드 4번째 줄 — 잔량 바는 어떤 병에도 그려진다(미개봉 100% / 비움 0%).
   보유 중이 아닌 경험·위시는 빈 트랙을 흐리게 두어 0% 와 구분한다 */
.lvlrow{display:flex;align-items:center;gap:6px;margin-top:8px}
.lvlrow .lvl{flex:1;min-width:0;margin-top:0}
.lvlrow .lvlx{flex:none;margin-left:0;min-width:26px;text-align:right;font-size:10px}
/* 오픈한 병만 — 목록에서 바로 '한 잔' 을 기록한다.
   카드가 <button> 이라 버튼을 중첩할 수 없다(유효하지 않은 HTML). span 에
   data-sip 을 달고 카드의 위임 핸들러에서 먼저 가로챈다.
   히트 영역을 44px 로 넓히되, 카드 열기를 잘못 누르지 않도록 '−한 잔' 을
   글자로 명시한다 — 잔량 바 전체를 누르게 하면 카드를 열려던 탭을 훔친다. */
.lvlrow .sip{
  position:relative;flex:none;margin-left:0;display:inline-flex;align-items:baseline;gap:4px;
  font-size:10px;color:var(--ink3);white-space:nowrap;
}
.lvlrow .sip b{
  font-size:10px;font-weight:700;color:var(--accent);
  border:1px solid var(--accent-line);border-radius:6px;padding:1px 5px;background:var(--accent-bg);
}
.lvlrow .sip::before{
  content:'';position:absolute;left:-6px;right:-6px;top:50%;transform:translateY(-50%);height:44px;
}
.lvlrow .sip:active b{transform:scale(.93)}
.lvl.na{opacity:.38}
.lvl.na + .lvlx, .lvlrow .lvl.na ~ .lvlx{opacity:.55}
/* 리스트 뷰 */
.listv{display:flex;flex-direction:column;gap:7px;margin-top:16px}
.rowi{
  display:flex;align-items:center;gap:11px;padding:9px 11px;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:var(--sh1);
}
.rowi:active{background:var(--surface2)}
.rowi .th{width:36px;height:48px;border-radius:7px;overflow:hidden;flex:none;
  background:var(--shot);border:1px solid var(--line);position:relative}
/* 36×48 타일에서 5% 흰 띠는 2px 남짓이라 확대 없이 cover 만으로 충분하다 */
.rowi .th img{width:100%;height:100%;object-fit:cover;display:block}
.rowi .ph span{font-size:13px}
.rowi .ph small{display:none}
.rowi .ph svg{width:52%}
.rowi .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rowi .nm{font-size:13.5px;font-weight:600;letter-spacing:-.015em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowi .sub{font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowi .rt{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
/* 리스트 행의 잔량 바는 짧게 — 넓으면 구분선처럼 보인다 */
.rowi .lvl{max-width:110px}
/* 사진 우상단 표식 — 좌: 상태(미개봉·오픈·비움·경험), 우: 19세 이용 표기.
   주류를 다루므로 19세 표기는 모든 카드에 붙는다. 두 표식은 같은 크기·같은
   유리판 처리로 한 쌍처럼 보이게 하고, 상태색은 안쪽 작은 원이 담당한다
   (칩과 색을 같은 요소에 걸면 background 가 서로를 덮어쓴다). */
.cflags{position:absolute;right:7px;top:7px;z-index:2;display:flex;align-items:center;gap:3px}
.cflags .fl{
  width:17px;height:17px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:color-mix(in srgb, var(--surface) 84%, transparent);
  border:1px solid var(--line2);backdrop-filter:blur(3px);
}
.adult{font-size:8.5px;font-weight:700;letter-spacing:-.04em;color:var(--ink2);
  font-variant-numeric:tabular-nums}
.dot{width:7px;height:7px;border-radius:50%}
.s-sealed{background:var(--ok)} .s-open{background:var(--warn)} .s-empty{background:var(--off)}
/* 보유하지 않은 두 상태는 속이 빈 고리로 — 경험은 앰버, 위시는 회색 */
.s-tried{background:transparent;border:2px solid var(--accent2);width:9px;height:9px}
.s-wish{background:transparent;border:2px solid var(--ink3);width:9px;height:9px}
.trd{font-size:9.5px;color:var(--accent);border:1px solid var(--accent-line);
  padding:0 5px;border-radius:5px;line-height:18px}
.cbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.ctype{font-size:9.5px;letter-spacing:.09em;color:var(--ink3);text-transform:uppercase;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.abv{font-size:11px;color:var(--ink3)}
.cbody h3{margin:0;font-size:13.5px;line-height:1.35;letter-spacing:-.015em;font-weight:600}
/* 카드 3번째 줄 — 평점·기타 배지 / 도수 / 가격.
   좁은 폭에서는 도수부터 줄어들게 하고 평점과 가격은 끝까지 남긴다.
   값이 없어도 min-height 로 자리를 지켜야 카드끼리 줄이 맞는다. */
.cfoot{margin-top:auto;display:flex;align-items:center;gap:4px;padding-top:7px;min-height:24px}
.cbg{display:flex;align-items:center;gap:3px;flex:0 0 auto}
.cbg .sc{padding:0 6px}          /* 좁은 카드에서 도수·가격에 폭을 양보한다 */
/* 상태 표식 — 사진 좌상단. 사진이 밝으므로 반투명 판을 깔아 대비를 확보한다 */
.cmark{
  position:absolute;left:7px;top:7px;z-index:2;display:flex;gap:3px;
  max-width:calc(100% - 30px);flex-wrap:wrap;
}
.cmark .trd, .cmark .dr{
  background:color-mix(in srgb, var(--surface) 86%, transparent);
  backdrop-filter:blur(3px);
}
.abv{font-size:11px;color:var(--ink3);flex:0 1 auto;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc{
  font-family:var(--serif);font-size:12.5px;color:var(--accent);
  border:1px solid var(--accent-line);background:var(--accent-bg);
  padding:0 7px;border-radius:6px;line-height:19px;
}
.dr{
  font-size:9.5px;color:var(--warn);border:1px solid var(--accent-line);
  padding:0 5px;border-radius:5px;line-height:18px;letter-spacing:.02em;
}
.pr{font-size:11.5px;color:var(--ink3);margin-left:auto}
.empty{
  text-align:center;padding:60px 22px;color:var(--ink2);
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:18px;
}
.empty h3{margin:0 0 8px;font-family:var(--serif);font-size:18px;font-weight:400;color:var(--ink)}
/* 빈 상태에서 무엇이 걸러내는지 보여 주는 칩 — 목록이 아니라 설명이므로 가운데 정렬 */
.empty .ecs{justify-content:center;flex-wrap:wrap;margin-top:12px;overflow:visible}
.empty .ebtn{margin:14px auto 0;max-width:200px}
.empty p{margin:0;font-size:13.5px}

/* ══════════════ sheet ══════════════ */
.scrim{
  position:fixed;inset:0;background:rgba(28,24,21,.36);backdrop-filter:blur(2px);z-index:40;
  overscroll-behavior:contain;touch-action:none;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  /* --vvh 는 visualViewport 높이 (키보드가 올라오면 줄어든다). iOS 에서 dvh 만
     쓰면 키보드 뒤로 시트가 밀린다. 지원하지 않는 브라우저는 dvh 로 떨어진다.
     --vvb 는 **키보드가 가리는 높이**다. 높이를 줄이는 것만으로는 부족하다 —
     position:fixed 의 bottom 은 레이아웃 뷰포트 기준이라 시트 아래쪽(저장 버튼과
     마지막 입력란)이 자판 뒤에 그대로 남는다. bottom 을 그만큼 띄워야 올라온다. */
  position:fixed;left:0;right:0;bottom:var(--vvb, 0px);z-index:50;
  max-height:min(94dvh, calc(var(--vvh, 94dvh) - 12px));
  display:flex;flex-direction:column;background:var(--surface);
  border-radius:22px 22px 0 0;box-shadow:var(--sh2);
  transform:translateY(101%);transition:transform .26s cubic-bezier(.32,.72,0,1);
}
.sheet.on{transform:translateY(0)}
@media(min-width:760px){
  .sheet{max-width:700px;margin:0 auto;border-radius:20px;bottom:calc(2vh + var(--vvb, 0px));
    max-height:min(92dvh, calc(var(--vvh, 92dvh) - 24px));
    border:1px solid var(--line);transform:translateY(calc(101% + 4vh))}
}

/* ══════════════ 데스크톱 좌측 사이드바 (1024px+) ══════════════
   사이드바는 기본적으로 숨어 있고, 넓은 화면에서만 나타난다.
   헤더는 그대로 두고 main 쪽으로 밀어 '컴팩트 상단바'로 재사용한다 —
   검색·정렬·추가 버튼을 옮기지 않으므로 기존 핸들러가 전부 그대로 동작한다. */
.sidebar{display:none}
@media(min-width:1024px){
  .sidebar{
    display:flex;flex-direction:column;gap:18px;
    position:fixed;left:0;top:0;bottom:0;width:236px;z-index:40;
    padding:calc(var(--safe-t) + 22px) 18px calc(18px + var(--safe-b));
    background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;
  }
  .sidebar-brand{display:flex;flex-direction:column;gap:3px;padding:0 6px}
  .sidebar-brand .wm{font-size:24px}
  .sidebar-brand .wm2{display:block}          /* 좁은 화면에서 숨긴 것을 여기선 되살린다 */
  .sidebar-nav{display:flex;flex-direction:column;gap:2px}
  .sidebar-nav .navsec{
    font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);
    font-weight:600;padding:6px 8px 4px;
  }
  .sidebar-nav .seg{
    display:flex;align-items:center;gap:8px;width:100%;text-align:left;
    padding:8px 10px;border-radius:10px;font-size:13.5px;font-weight:600;
    color:var(--ink2);letter-spacing:-.01em;transition:.13s;
  }
  .sidebar-nav .seg b{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--ink3)}
  .sidebar-nav .seg:hover{background:var(--surface2);color:var(--ink)}
  .sidebar-nav .seg.on{background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-line)}
  .sidebar-nav .seg.on b{color:var(--accent2)}
  /* 선택 항목에 테두리가 생기면서 1px 밀리는 것을 막는다 */
  .sidebar-nav .seg:not(.on){border:1px solid transparent}
  .sidebar-foot{margin-top:auto;display:flex;flex-direction:column;gap:7px;
    padding-top:14px;border-top:1px solid var(--line)}
  .sidebar-foot .sk{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
    font-size:11.5px;color:var(--ink3);padding:0 8px}
  .sidebar-foot .sk b{font-family:var(--serif);font-size:15px;color:var(--ink);font-weight:600}

  /* 넓은 화면에서는 폭을 묶지 않는다 — max-width 를 두면 사이드바 오른쪽에
     빈 띠가 남고 열 수가 고정된다(1180px 상한에서는 늘 5열이었다).
     카드 최소폭(minmax)이 크기를 지키므로 열 수만 화면에 맞춰 늘어난다.
     헤더 콘텐츠 시작점(236+24)과 .wrap 의 콘텐츠 시작점을 일치시켜 둔다. */
  header.top{padding-left:calc(236px + 24px);padding-right:24px}
  .top-in{max-width:none}
  /* 워드마크는 사이드바로 옮겼다 — 상단바의 브랜드 영역은 여백만 남는다 */
  .brand .wm, .brand .wm2{display:none}
  .wrap{max-width:none;margin-left:236px;padding-left:24px;padding-right:24px}
  /* 탭·주종 전환은 사이드바가 담당한다 — 두 벌이 동시에 보이면 어느 쪽이
     참인지 알 수 없다. 타입 칩은 사이드바에 없으므로 그대로 남긴다. */
  #tabSegs, .catsel{display:none}
  /* 176px 은 임의값이 아니다 — auto-fill 은 남는 폭을 열에 나눠 주므로 하한이
     높으면 열 수가 하나 줄면서 카드가 확 넓어진다. 176 은 1280~2560px 구간에서
     카드 폭을 183~190px 로 붙잡아 화면 크기와 무관하게 같아 보이게 하는 값이다. */
  .grid{grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:16px}
  /* left 로 밀어야 margin:0 auto 가 사이드바 오른쪽 영역 안에서 중앙을 잡는다.
     margin-left 로 밀면 auto 중앙정렬이 깨져 시트가 왼쪽에 붙는다. */
  .sheet{left:236px}
  .scrim{left:236px}
}
.sh-head{
  position:relative;display:flex;align-items:center;gap:10px;flex:none;
  padding:16px 16px 12px;border-bottom:1px solid var(--line);
}
.grab{position:absolute;left:50%;transform:translateX(-50%);top:7px;width:34px;height:4px;
  border-radius:2px;background:var(--line2)}
.sh-head h2{margin:0;font-size:15.5px;font-weight:600;letter-spacing:-.015em;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* overscroll-behavior: 내부 스크롤이 끝에 닿아도 문서로 전파되지 않게 한다.
   이것이 없으면 iOS 에서 러버밴드가 문서를 흔들고, 고정된 시트가 함께 떨린다. */
.sh-body{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding:16px 16px calc(22px + var(--safe-b))}
.sh-foot{
  flex:none;display:flex;gap:8px;padding:11px 16px calc(11px + var(--safe-b));
  border-top:1px solid var(--line);background:var(--surface);
}
.btn{
  flex:1;height:45px;border-radius:12px;font-weight:600;font-size:14px;letter-spacing:-.01em;
  background:var(--surface);border:1px solid var(--line2);color:var(--ink);transition:.15s;
}
.btn:active{transform:scale(.98)}
/* 아이콘을 넣으려면 버튼이 flex 여야 한다 (글자만 있어도 동작은 같다).
   a 는 button 과 달리 내용이 가운데 정렬되지 않으므로 여기서 함께 맞춘다 */
.btn, a.btn{display:flex;align-items:center;justify-content:center;gap:7px;text-decoration:none}
/* 인라인 아이콘 — currentColor 로 그려 버튼 색을 그대로 따른다 */
.ic{
  width:15px;height:15px;flex:none;fill:none;stroke:currentColor;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
}
.mini .ic{width:13px;height:13px;stroke-width:1.8}
.donate .ic{width:14px;height:14px}
.hint .ic{width:12.5px;height:12.5px;stroke-width:1.9;vertical-align:-2px}
.btn.pri{background:var(--ink);color:var(--bg);border:none}
:root[data-theme="dark"] .btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.gold{background:linear-gradient(180deg,#d7a643,#bd8a2a);color:#231803;border:none}
.btn.dgr{flex:none;width:70px;background:transparent;border-color:var(--line2);color:var(--danger)}

/* ══════════════ record card ══════════════ */
.hero{display:flex;gap:14px;margin-bottom:6px}
.hero .im{
  width:104px;flex:none;aspect-ratio:3/4;border-radius:12px;overflow:hidden;position:relative;
  background:var(--shot);border:1px solid var(--line);
}
.hero .im.raw img{inset:6px}
.hero .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.hero .hi{min-width:0;display:flex;flex-direction:column;gap:3px;padding-top:2px}
.hero h3{margin:0;font-size:18px;line-height:1.3;letter-spacing:-.02em;font-weight:600}
.hero .en{margin:0;font-family:var(--serif);font-size:12.5px;color:var(--ink2);line-height:1.4}
.bdgs{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.bdg{
  font-size:10.5px;padding:2.5px 8px;border-radius:999px;background:var(--surface2);
  color:var(--ink2);letter-spacing:.02em;
}
.bdg.am{background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-line);font-weight:600}
.bdg.wn{background:transparent;color:var(--warn);border:1px solid var(--accent-line)}
h4.sec{
  font-size:10px;color:var(--ink3);margin:24px 0 10px;letter-spacing:.14em;font-weight:700;
  text-transform:uppercase;display:flex;align-items:center;gap:10px;
}
h4.sec::after{content:"";flex:1;height:1px;background:var(--line)}
/* 핵심 4개 스탯 스트립 — 11행 표를 매번 훑지 않게 한다 */
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.strip > div{
  background:var(--surface2);border-radius:11px;padding:9px 6px;text-align:center;min-width:0;
}
.strip span{display:block;font-size:9.5px;letter-spacing:.08em;color:var(--ink3);text-transform:uppercase}
.strip b{display:block;font-family:var(--serif);font-size:15px;margin-top:3px;letter-spacing:-.01em}
.caskline{margin:10px 0 0;font-size:12.5px;color:var(--ink2);line-height:1.55}
.caskline span{font-size:9.5px;letter-spacing:.1em;color:var(--ink3);text-transform:uppercase;margin-right:6px}
.more{margin-top:12px}
.more summary{
  cursor:pointer;font-size:12.5px;color:var(--accent);padding:8px 0;
  list-style:none;display:flex;align-items:center;gap:5px;
}
.more summary::-webkit-details-marker{display:none}
.more summary::after{content:'▾';font-size:10px}
.more[open] summary::after{content:'▴'}
table.spec{width:100%;border-collapse:collapse;font-size:13.5px}
table.spec th,table.spec td{padding:9px 2px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.spec th{width:98px;color:var(--ink3);font-weight:500;white-space:nowrap;font-size:12.5px}
table.spec td{color:var(--ink)}
table.spec tr:last-child th,table.spec tr:last-child td{border-bottom:none}
.na{color:var(--ink3)}
.tnote{margin-bottom:14px}
.tnote .lb{
  display:block;font-size:9.5px;letter-spacing:.16em;color:var(--accent);font-weight:700;
  text-transform:uppercase;margin-bottom:3px;
}
.tnote p{margin:0;font-size:13.5px;line-height:1.65}
.rate{display:flex;align-items:flex-end;gap:12px;margin-top:2px}
.rate .big{font-family:var(--serif);font-size:34px;line-height:1;letter-spacing:-.02em}
.rate .rm{font-size:11.5px;color:var(--ink3);line-height:1.45;padding-bottom:3px}
.gauge{height:4px;border-radius:2px;background:var(--surface2);overflow:hidden;margin-top:11px}
.gauge i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.rlist{margin-top:12px;display:flex;flex-direction:column;gap:7px}
.rlist div{display:flex;font-size:12.5px;gap:10px}
.rlist b{width:92px;flex:none;color:var(--ink3);font-weight:500}
/* 잔량 패널 */
.lvlbig{margin-bottom:14px}
.lvlbar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.lvlbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.lvlrow{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;
  font-size:12.5px;color:var(--ink2)}
.lvlrow b{color:var(--accent)}
.lvlbtns{display:flex;gap:5px;margin-left:auto}
/* 시음 기록 */
.sess{display:flex;flex-direction:column;gap:8px}
/* 시음 기록 타임라인 — 세로 레일 + 기록마다 노드 하나.
   레일은 마지막 항목 아래로 이어지지 않아야 '끝'으로 읽힌다 */
.tline{display:flex;flex-direction:column;gap:10px}
.sitem{
  background:var(--surface2);border-radius:12px;padding:10px 12px;
  position:relative;margin-left:15px;
}
.sitem::before{                       /* 노드 */
  content:'';position:absolute;left:-15px;top:15px;width:9px;height:9px;border-radius:50%;
  background:var(--accent);border:2px solid var(--surface);box-sizing:content-box;
}
.sitem::after{                        /* 레일 — 다음 항목까지 */
  content:'';position:absolute;left:-9px;top:28px;bottom:-14px;width:1px;background:var(--line2);
}
.sitem:last-child::after{display:none}
.sitem .sh{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.sitem .sh b{font-size:12.5px;color:var(--ink)}
.sago{font-size:10.5px;color:var(--ink3)}
/* 직전 기록 대비 점수 변화 — 색만으로 구분하지 않고 ▲▼ 기호를 함께 쓴다 */
.sdel2{font-size:10px;font-weight:700;padding:1px 5px;border-radius:5px;letter-spacing:-.02em}
.sdel2.up{color:var(--ok);background:color-mix(in srgb, var(--ok) 14%, transparent)}
.sdel2.dn{color:var(--danger);background:color-mix(in srgb, var(--danger) 12%, transparent)}
.sitem .sdel{margin-left:auto;color:var(--ink3);font-size:12px;width:22px;height:22px;border-radius:6px}
.sitem .sm{font-size:11.5px;color:var(--ink3);margin-top:3px}
.sitem p{margin:6px 0 0;font-size:13px;line-height:1.6;color:var(--ink2)}
pre.csv{
  background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:11px;
  font-size:11px;overflow-x:auto;white-space:pre;color:var(--ink2);margin:0;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
.lrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.lnk{
  font-size:12px;padding:7px 11px;border-radius:9px;background:var(--surface);
  border:1px solid var(--line);color:var(--ink2);text-decoration:none;
}
.credit{font-size:10.5px;color:var(--ink3);margin-top:6px;line-height:1.5;word-break:keep-all}
.credit a{color:var(--ink3);text-decoration:underline;text-underline-offset:2px}
.credit a:hover{color:var(--accent)}

/* ══════════════ wizard ══════════════ */
.wiz{text-align:center;padding:6px 0 2px}
.wiz .wt{font-family:var(--serif);font-size:21px;margin:0 0 4px;letter-spacing:-.01em}
.wiz .ws{font-size:13px;color:var(--ink2);margin:0 0 18px}
.wiz input{
  width:100%;height:50px;text-align:center;font-size:16px;border-radius:13px;
  background:var(--surface);border:1px solid var(--line2);padding:0 14px;
}
.wiz input:focus{outline:none;border-color:var(--accent2);box-shadow:0 0 0 3px var(--accent-bg)}
.exs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.exs[hidden]{display:none}   /* display 지정이 hidden 속성을 덮어쓰지 않도록 */
.ex{font-size:11.5px;padding:5px 10px;border-radius:999px;background:var(--surface2);color:var(--ink2)}
.sugg{margin-top:11px;display:flex;flex-direction:column;gap:6px;text-align:left}
.sg{
  display:flex;flex-direction:column;gap:1px;padding:9px 12px;border-radius:11px;
  background:var(--surface);border:1px solid var(--line);text-align:left;
}
.sg b{font-size:14px;font-weight:600;letter-spacing:-.01em}
.sg span{font-size:11.5px;color:var(--ink3)}
.sg:active{background:var(--accent-bg);border-color:var(--accent-line)}
.sgpick{
  font-size:12px;color:var(--accent);background:var(--accent-bg);border:1px solid var(--accent-line);
  border-radius:10px;padding:8px 11px;text-align:left;
}
.wlog{margin-top:16px;text-align:left;font-size:12.5px}
.hitbox{background:var(--accent-bg);border:1px solid var(--accent-line);border-radius:12px;padding:12px 13px}
.hitbox .t{font-weight:700;color:var(--accent);font-size:12.5px;margin-bottom:6px}
.hitbox ul{margin:0;padding-left:16px;color:var(--ink2)}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line2);
  border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ══════════════ form ══════════════ */
/* 6열 그리드 위에서 폭을 셋으로 쓴다 — 기본 3칸(2열) · wide 6칸(1열) · third 2칸(3열).
   2열 그리드로는 3열을 섞을 수 없어 6의 배수로 올렸다. 기존 .f / .f.wide 는 그대로 동작한다.
   지역·도수·숙성처럼 값이 짧은 것 셋을 한 줄에 넣으면 폼에서 한 행씩 사라진다. */
.fg{display:grid;gap:11px;grid-template-columns:repeat(6,1fr)}
.f{display:flex;flex-direction:column;gap:5px;min-width:0;grid-column:span 3}
.f.wide{grid-column:1/-1}
.f.third{grid-column:span 2}
/* 3열은 칸이 좁아 라벨이 접히기 쉽다 — 접히면 행을 줄인 뜻이 없으므로 한 줄로 못박는다 */
.f.third label{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.f label{font-size:11px;color:var(--ink3);padding-left:2px;display:flex;align-items:center;gap:5px}
.dpill{font-size:9px;font-style:normal;color:var(--warn);border:1px solid var(--accent-line);
  background:var(--accent-bg);border-radius:4px;padding:0 4px;line-height:15px;letter-spacing:.02em}
.f input,.f select,.f textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:10px 11px;font-size:14px;
}
.f textarea{min-height:62px;resize:vertical;line-height:1.55}
/* 잔량 슬라이더 */
.rng{display:flex;align-items:center;gap:9px}
.rng input[type=range]{flex:1;accent-color:var(--accent);padding:0;background:none;border:none}
.rng output{font-size:12.5px;color:var(--accent);font-weight:700;min-width:38px;text-align:right}
/* 맛 프로필 칩 입력 */
.fchips{padding:2px 0}
.fchips .chip.on{background:var(--accent-bg);border-color:var(--accent-line);color:var(--accent);font-weight:600}
.f input:focus,.f select:focus,.f textarea:focus{
  outline:none;border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-bg)}
.f.drafted input,.f.drafted textarea,.f.drafted select{
  background:var(--accent-bg);box-shadow:inset 2px 0 0 var(--accent2)}
/* 도구를 펼치면 **사진 아래 전체 폭**으로 간다. 사진 옆(228px)에 두면 버튼 넷이
   314px 라 늘 두 줄이 됐다. 접혀 있을 때는 사진만 있으므로 이 줄바꿈이 보이지 않는다. */
.imgb{display:flex;gap:12px;flex-wrap:wrap}
/* 사진 + 카메라 버튼을 함께 감싼다. 버튼을 .prev 안에 두면 drawShots() 가 innerHTML 을
   다시 쓸 때마다 사라진다 */
.prevw{position:relative;flex:none}
.camb{
  position:absolute;right:-6px;bottom:-6px;width:30px;height:30px;border-radius:9px;
  background:var(--surface);border:1px solid var(--line);color:var(--ink2);
  display:grid;place-items:center;
}
.camb .ic{width:15px;height:15px}
.camb.on{background:var(--accent-bg);border-color:var(--accent-line);color:var(--accent)}
.imgb .prev{
  width:88px;flex:none;aspect-ratio:3/4;border-radius:11px;overflow:hidden;position:relative;
  background:var(--shot);border:1px solid var(--line);
}
.imgb .prev.raw img{inset:5px}
.imgb .prev img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
/* 100% 로 두어 **사진 아래 전체 폭**을 쓴다. 사진 옆(228px)에 두면 버튼 넷이 314px 라
   늘 두 줄이 됐다. 접혀 있을 때는 사진만 있어 이 줄바꿈이 보이지 않는다. */
.imgb .side{flex:1 1 100%;min-width:0;display:flex;flex-direction:column;gap:7px}
/* ⚠ `[hidden]` 은 특이도 (0,1,0) 이라 위의 `.imgb .side`(0,2,0) 에 진다 — 속성만 걸면
   hidden===true 인데 화면에는 386px 가 그대로 남는다(실제로 그렇게 새어 있었다).
   숨김은 **같거나 더 높은 특이도로** 못박아야 한다. */
.imgb .side[hidden]{display:none}
.mrow{display:flex;gap:5px;flex-wrap:wrap}
.mini{
  font-size:11.5px;padding:6px 10px;border-radius:9px;background:var(--surface);
  border:1px solid var(--line);color:var(--ink2);
  display:inline-flex;align-items:center;gap:5px;
}
.mini.am{color:var(--accent);border-color:var(--accent-line);background:var(--accent-bg)}
/* AI 초안 줄 — 버튼과 상태 문구가 나란히, 문구가 길어지면 아래로 감긴다 */
/* AI 초안 결과 줄. 버튼은 헤더로 갔고 여기는 메시지만 남았다 —
   할 말이 없으면 자리를 쓰지 않는다(:empty). */
.airow{display:block;margin:0 0 12px}
.airow:empty{display:none}
.airow .hint{flex:1;min-width:150px}
/* 헤더 액션 — 제목과 ✕ 사이. 아이콘+짧은 글자로 폭을 아낀다 */
#shAct:empty{display:none}
#shAct .mini{flex:none;padding:5px 9px;font-size:11px}
/* .ask — 초안 병으로 들어왔을 때 "채워 볼까요?" 를 묻는 상태.
   모달을 띄우지 않는 대신 이 줄이 눈에 걸려야 한다. 답하면 평상 상태로 돌아간다. */
.airow.ask{
  background:var(--accent-bg);border:1px solid var(--accent-line);
  border-radius:11px;padding:10px 11px;color:var(--ink2);
}
.airow.ask .hint{color:var(--ink2)}
.airow.ask .hint b{color:var(--accent)}
.hint{font-size:11px;color:var(--ink3);line-height:1.55;padding-left:1px}
.cands{display:flex;gap:7px;overflow-x:auto;padding:2px;scrollbar-width:none}
.cands::-webkit-scrollbar{display:none}
.cand{
  flex:none;width:58px;aspect-ratio:3/4;border-radius:9px;overflow:hidden;
  background:var(--surface);border:1px solid var(--line);padding:3px;
}
.cand.on{border-color:var(--accent2);box-shadow:0 0 0 2px var(--accent-bg)}
.cand{position:relative}
.cand img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}

/* ══════════════ stats ══════════════ */
.kpis{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px 13px}
.kpi .k{font-size:10px;color:var(--ink3);letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.kpi .v{font-family:var(--serif);font-size:24px;letter-spacing:-.02em;margin-top:3px;line-height:1.15}
.kpi .v u{font-family:var(--sans);font-size:12px;text-decoration:none;color:var(--ink2);margin-left:1px}
.kpi .v.up{color:var(--ok)} .kpi .v.dn{color:var(--danger)}
.kpi .s{font-size:11px;color:var(--ink3);margin-top:3px}
.bars{display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.bar{display:flex;align-items:center;gap:9px}
.bar .nm{width:104px;flex:none;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tr{flex:1;height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.bar .tr i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.bar .n{width:24px;text-align:right;color:var(--ink3);font-size:11.5px;flex:none}

/* ══════════════ misc ══════════════ */
/* 위험 알림용 변형 — 하드코딩 분홍 배경은 다크에서 밝은 글자와 겹쳐
   대비 1.4:1 이 됐다. 색을 토큰으로 돌려 두 테마 모두 읽히게 한다. */
.note.dgr{
  background:color-mix(in srgb, var(--danger) 12%, transparent);
  border-color:color-mix(in srgb, var(--danger) 42%, transparent);
}
.note{background:var(--accent-bg);border:1px solid var(--accent-line);border-radius:12px;
  padding:11px 13px;font-size:12.5px;color:var(--ink2);line-height:1.6}
.note b{color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:8px}
.stack .btn{flex:none;height:43px}
.darea{
  width:100%;min-height:110px;background:var(--surface);border:1px solid var(--line);
  border-radius:11px;padding:11px;font-size:11.5px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
/* ── 이미지 확대·롤링 ─────────────────────── */
.lightbox{
  position:fixed;inset:0;z-index:80;background:rgba(16,13,10,.94);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s;
  padding:calc(var(--safe-t) + 48px) 12px calc(var(--safe-b) + 56px);
}
.lightbox.on{opacity:1;pointer-events:auto}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;background:#fff}
.lb-x{
  position:absolute;top:calc(var(--safe-t) + 10px);right:12px;width:40px;height:40px;border-radius:12px;
  background:rgba(255,255,255,.14);color:#fff;font-size:17px;display:grid;place-items:center;
}
.lb-nav{
  position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border-radius:12px;
  background:rgba(255,255,255,.12);color:#fff;font-size:30px;line-height:1;display:grid;place-items:center;
}
.lb-prev{left:8px} .lb-next{right:8px}
.lb-nav[hidden]{display:none}
.lb-dots{
  position:absolute;bottom:calc(var(--safe-b) + 18px);left:0;right:0;
  display:flex;gap:7px;justify-content:center;
}
.lb-dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35);display:block}
.lb-dots i.on{background:#fff;transform:scale(1.25)}
/* 상세 화면 사진 묶음 */
.shots{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.shot{
  width:52px;aspect-ratio:3/4;border-radius:9px;overflow:hidden;
  background:var(--shot);border:1px solid var(--line);flex:none;
}
.shot{position:relative}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.shot.on{border-color:var(--accent2);box-shadow:0 0 0 2px var(--accent-bg)}
.toast{
  position:fixed;left:50%;bottom:calc(26px + var(--safe-b));transform:translate(-50%,18px);
  background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:999px;font-size:13.5px;
  font-weight:600;z-index:90;opacity:0;pointer-events:none;transition:.22s;
  box-shadow:var(--sh2);max-width:88vw;text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
/* 토스트 안의 취소 버튼 — 토스트는 기본이 pointer-events:none 이라 .on 에서만 눌린다 */
.tundo{
  margin-left:11px;padding:3px 9px;border-radius:7px;font-size:12px;font-weight:700;
  color:var(--bg);background:color-mix(in srgb, var(--bg) 26%, transparent);
  border:1px solid color-mix(in srgb, var(--bg) 42%, transparent);
}
/* ══════════════ 푸터 ══════════════ */
.foot{
  margin-top:34px;padding:20px 0 6px;border-top:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;gap:11px;text-align:center;
}
.foot small{font-size:10.5px;color:var(--ink3);letter-spacing:.01em;word-break:keep-all}
/* 문서 링크 — 공개 배포이므로 방침·가이드가 앱에서 늘 닿아야 한다 */
.flinks{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px}
.flinks a, .flinks .lnkbtn{
  font-size:11.5px;color:var(--ink3);text-decoration:none;
  border-bottom:1px solid var(--line2);padding-bottom:1px;
  background:none;border-top:0;border-left:0;border-right:0;
}
.flinks a:hover, .flinks .lnkbtn:hover{color:var(--accent)}
/* 19세 표기 — 주류를 다루므로 푸터에도 상시 노출한다 */
.agemark{display:inline-flex;align-items:center;gap:6px}
.agemark i{
  font-style:normal;flex:none;width:16px;height:16px;border-radius:50%;
  display:grid;place-items:center;font-size:8.5px;font-weight:700;
  background:var(--surface2);border:1px solid var(--line2);color:var(--ink2);
}
.donate{
  display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 15px;
  border-radius:10px;font-size:12.5px;font-weight:600;letter-spacing:-.01em;
  background:var(--accent-bg);border:1px solid var(--accent-line);color:var(--accent);
  transition:.15s;
}
.donate:active{transform:scale(.96)}
@media(hover:hover){ .donate:hover{background:var(--surface2);border-color:var(--accent)} }
/* QR — 흰 바탕이 필수(다크 테마에서 반전되면 스캐너가 못 읽는다) */
.qrbox{display:flex;flex-direction:column;align-items:center;gap:12px;padding:4px 0 2px}
.qrbox canvas, .qrbox img{
  width:216px;height:216px;image-rendering:pixelated;background:#fff;object-fit:contain;
  padding:12px;border-radius:12px;border:1px solid var(--line);box-shadow:var(--sh1);
}
.qrbox canvas[hidden], .qrbox img[hidden]{display:none}
/* 첫 실행 안내 */
.intro{display:flex;flex-direction:column;gap:12px}
.idots{display:flex;gap:5px;justify-content:center;padding:2px 0 4px}
.idots i{width:6px;height:6px;border-radius:50%;background:var(--line2);transition:.2s}
.idots i.on{background:var(--accent);width:18px;border-radius:3px}
.intro .it{
  font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:-.015em;
  margin:0;line-height:1.32;color:var(--ink);text-align:center;
}
.intro .id{font-size:13.5px;color:var(--ink2);line-height:1.68;margin:0;text-align:center;
  word-break:keep-all}
.intro .id code{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9em;
  background:var(--surface2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;
}
.intro .ilink{
  align-self:center;font-size:12px;color:var(--ink3);text-decoration:none;
  border-bottom:1px solid var(--line2);padding-bottom:1px;margin-top:2px;
}
.intro .ilink:hover{color:var(--accent)}
/* 설치 안내의 단계 목록 */
.guide{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:7px}
.guide li{font-size:13px;color:var(--ink2);line-height:1.5}
.guide li b{color:var(--ink)}
/* 공유 아이콘을 문장 안에 넣어 '어떤 버튼인지'를 그림으로 보여 준다 */
.ic.shr{width:14px;height:14px;vertical-align:-2px;color:var(--accent)}

/* 장소 5칩 — 집·바·모임·회식·기타. 고른 라벨은 메모 첫 줄의 "집 : " 이 된다.
   향·맛·여운 셀과 같은 규격으로 맞춰 **반폭 한 줄**에 5개가 들어간다.
   폭이 30px 대로 좁아지지만 높이를 아끼는 쪽을 택했다(사용자 요청).
   라벨이 모두 두 글자라 이 폭에서도 잘리지 않는다(실측). */
.pgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
/* 보관 위치 — 3종이라 5열 .pgrid 를 그대로 쓰면 칩이 과하게 넓어진다.
   셀은 .pcell 을 공유하므로 여기서 바꿀 것은 열 수뿐이다. */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.pcell{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  height:44px;border-radius:7px;font-size:8.5px;font-weight:600;letter-spacing:-.04em;
  background:var(--surface2);border:1px solid var(--line);color:var(--ink3);transition:.13s;
  overflow:hidden;
}
.pcell .ic{width:14px;height:14px}
@media(min-width:560px){ .pcell{font-size:10px;height:46px} .pgrid{gap:5px}
  .pcell .ic{width:15px;height:15px} }
.pcell:active{transform:scale(.96)}
.pcell.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);
  box-shadow:inset 0 0 0 1px var(--accent)}

/* 중복 구매 경고 — 막는 것이 아니라 알리는 것이므로 위험색을 쓰지 않는다 */
.dupwarn{
  background:var(--accent-bg);border:1px solid var(--accent-line);border-radius:12px;
  padding:11px 13px;margin-bottom:10px;
}
.dupwarn .t{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:7px}
.dupwarn ul{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:5px}
.dupwarn li{font-size:12px;color:var(--ink2);line-height:1.5;word-break:keep-all}
.dupwarn .dst{
  font-size:9.5px;font-weight:700;color:var(--accent);background:var(--surface);
  border:1px solid var(--accent-line);border-radius:5px;padding:1px 5px;margin-left:4px;
}
.dupwarn .dbits{font-size:11px;color:var(--ink3);margin:6px 0 0}
.dupwarn li .dbits{margin:2px 0 0}

/* ══════════════ 삼각 레이더 ══════════════ */
.radbox{
  padding:11px 13px 13px;margin-bottom:12px;
  background:var(--surface2);border:1px solid var(--line);border-radius:14px;
}
/* 점수를 그래프 위에 크게 — 이 화면에서 가장 먼저 읽어야 하는 값이다 */
.radtop{display:flex;align-items:baseline;gap:8px;margin-bottom:9px;
  padding-bottom:9px;border-bottom:1px solid var(--line)}
.radtop b{font-family:var(--serif);font-size:30px;line-height:1;letter-spacing:-.02em;color:var(--ink)}
.radtop span{font-size:10.5px;color:var(--ink3);word-break:keep-all}
.radbody{display:flex;gap:14px;align-items:center}
.radwrap{flex:none;width:148px;height:148px}
.radar{width:100%;height:100%;display:block;overflow:visible}
.radar .rg{fill:none;stroke:var(--line2);stroke-width:1}
.radar .rv{fill:color-mix(in srgb, var(--accent) 26%, transparent);
  stroke:var(--accent);stroke-width:1.8;stroke-linejoin:round}
.radar .rd{fill:var(--accent)}
.radar .rt{fill:var(--ink3);font-size:10px;text-anchor:middle;font-weight:600}
.radsl{flex:1;min-width:0;display:flex;flex-direction:column;gap:11px}
.rsl{display:flex;align-items:center;gap:8px}
.rsl label{flex:none;display:flex;align-items:center;gap:4px;width:52px;white-space:nowrap;
  font-size:11.5px;font-weight:600;color:var(--ink2)}
.rsl label .ic{width:13px;height:13px;color:var(--accent)}
.rsl input[type=range]{flex:1;min-width:0;accent-color:var(--accent);padding:0;background:none;border:none}
.rsl output{flex:none;width:26px;text-align:right;font-size:11.5px;font-weight:700;
  color:var(--ink);font-variant-numeric:tabular-nums}
/* 좁은 화면에서는 차트를 위로 올린다 — 나란히 두면 슬라이더가 눌린다 */
/* 폰에서도 그래프와 바를 나란히 둔다 — 세로로 쌓으면 이 블록만 높이가 두 배가 된다.
   대신 그래프를 줄이고 라벨·간격을 좁혀 한 줄에 들어가게 한다. */
@media(max-width:400px){
  .radbox{padding:9px 10px 11px}
  .radbody{gap:9px}
  .radwrap{width:104px;height:104px}
  .radsl{gap:10px}
  .rsl{gap:6px}
  /* nowrap 이 없으면 '여운' 이 두 글자에서 감겨 슬라이더 줄 높이가 늘어난다 */
  .rsl label{width:40px;font-size:10.5px;gap:3px;white-space:nowrap}
  .rsl label .ic{width:12px;height:12px}
  .rsl output{width:21px;font-size:10.5px}
  .radtop b{font-size:26px}
  .radtop{margin-bottom:8px;padding-bottom:8px}
}
/* 아주 좁은 화면에서는 축 이름을 숨긴다 — 아이콘만으로도 구분된다 */
@media(max-width:339px){ .radwrap{width:88px;height:88px} .rsl label span{display:none}
  .rsl label{width:16px} }

/* ══════════════ 향·맛·여운 선택 ══════════════
   기본은 가중치 상위 10개 — **10열 × 1줄**. 세 축이 한 화면에 들어오게 한다.
   84개를 한 번에 펼치면 아무도 고르지 않는다. 선택된 항목은 접어도 계속 보인다. */
.nsec{margin-bottom:18px}
.nsec:last-child{margin-bottom:6px}
.nhead{display:flex;align-items:center;gap:7px;margin-bottom:9px;flex-wrap:wrap}
.nhead .ic{width:16px;height:16px;color:var(--accent)}
.nhead b{font-size:13.5px;color:var(--ink);letter-spacing:-.01em}
.nhead span{font-size:11px;color:var(--ink3);word-break:keep-all}
/* 접힌 노트의 요약 한 줄 — 펴지 않고도 무엇이 적혔는지 보여야 접어 둘 수 있다 */
.nhead .nsum{
  flex:1;min-width:0;font-size:11.5px;color:var(--ink2);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.nhead .nsum .na{font-style:normal;color:var(--ink3)}
.nedit{
  flex:none;margin-left:auto;padding:3px 9px;border-radius:7px;font-size:11px;font-weight:600;
  background:var(--surface2);border:1px solid var(--line);color:var(--ink2);
}
.nedit.on{background:var(--accent-bg);border-color:var(--accent-line);color:var(--accent)}
/* 텍스트에서 찾기 — 추천 등급(0.5~0.75)은 **켜지 않고** 점선으로만 알린다.
   확신이 낮은 것을 켜 두면 사용자가 하나씩 꺼야 해서 도움이 아니라 일이 된다. */
.ncell.sug{border-style:dashed;border-color:var(--accent-line);color:var(--accent)}
/* 문장에서 자동으로 잡힌 칩 — 내가 직접 켠 것(.on)과 구분되게 옅게 채운다.
   같은 표시를 쓰면 무엇이 내 선택이고 무엇이 자동인지 알 수 없다. */
.ncell.auto{background:var(--accent-bg);border-color:var(--accent-line);color:var(--accent)}
.ncell.auto span{opacity:.85}
/* 자동 등록 줄 — 텍스트와 섞이지 않게 아래에 따로 낸다 */
.nauto{margin:7px 0 0;font-size:11px;line-height:1.8;color:var(--ink3)}
.nauto:empty{display:none}
.nauto b{color:var(--ink2);font-weight:700;margin-right:4px}
.nauto i{
  font-style:normal;display:inline-block;margin:0 3px 3px 0;padding:2px 7px;border-radius:6px;
  background:var(--accent-bg);color:var(--accent);font-weight:600;
}
.nauto .sg{display:block;color:var(--ink3);margin-top:2px}
/* 섹션 제목 옆의 `모두 수정` */
h4.sec{display:flex;align-items:center;gap:8px}
h4.sec .nedit{margin-left:auto}
/* 편집 폼의 접이식 — 한 번 넣으면 잘 안 고치는 것들 */
.efold{margin-top:16px;border-top:1px solid var(--line);padding-top:4px}
.efold > summary{
  padding:11px 2px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;
  list-style:none;display:flex;align-items:center;gap:6px;
}
.efold > summary::-webkit-details-marker{display:none}
.efold > summary::before{content:'▸';color:var(--ink3);font-size:11px}
.efold[open] > summary::before{content:'▾'}
.efold[open] > summary{color:var(--accent)}
#efBdg{margin:2px 0 4px}
/* 게임에서만 나온다 — 정답이 몇 개인지(nnum)와 내가 몇 개 골랐는지(nsel).
   배점이 정답 개수로 정규화되므로 이 둘을 나란히 보여 주면 몇 개를 더 고를지 판단이 된다. */
.nhead .nnum{font-size:11px;color:var(--accent);font-weight:700}
.nhead .nsel{
  margin-left:auto;flex:none;text-decoration:none;font-size:10.5px;font-weight:600;
  padding:2px 7px;border-radius:6px;background:var(--surface2);color:var(--ink3);
}
.nhead .nsel.on{background:var(--accent-bg);color:var(--accent)}
/* 10열 1줄 — 세 축이 한 화면에 들어오게 하는 것이 목적이다.
   360px 에서 셀 하나가 약 30px 이므로 글자는 7.5px, 두 줄까지 감싼다.
   폭이 좁아 라벨이 짧지 않으면 읽히지 않는다 → 긴 이름은 NOTES 에서 짧게 뒀다. */
.ngrid{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-bottom:7px}
.ncell{
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;
  padding:5px 1px 4px;border-radius:7px;min-height:44px;
  background:var(--surface2);border:1px solid var(--line);color:var(--ink3);
  transition:.13s;overflow:hidden;
}
.ncell .ic{width:15px;height:15px;stroke-width:1.8}
.ncell span{font-size:7.5px;line-height:1.2;text-align:center;word-break:keep-all;
  letter-spacing:-.04em;max-width:100%}
.ncell:active{transform:scale(.95)}
/* 선택 상태는 색만으로 구분하지 않는다 — 테두리 굵기와 배경도 함께 바뀐다 */
.ncell.on{
  background:var(--accent-bg);border-color:var(--accent);color:var(--accent);
  box-shadow:inset 0 0 0 1px var(--accent);
}
.ncell.on span{font-weight:700}
.nmore{width:100%;justify-content:center;margin-bottom:9px}
/* 좁은 화면에서도 4열을 지킨다 — 셀 글자를 줄이는 편이 열을 깨는 것보다 낫다 */
@media(max-width:359px){ .ncell span{font-size:7px} .ncell .ic{width:14px;height:14px}
  .ncell{min-height:42px} .ngrid{gap:2px} }
/* 넓은 시트에서는 같은 10열이지만 셀이 커지므로 글자도 키운다 */
@media(min-width:560px){ .ncell{min-height:52px} .ncell span{font-size:9.5px}
  .ncell .ic{width:18px;height:18px} .ngrid{gap:5px} }
/* 헤더 버전 표시 — 눌러서 변경 이력으로 간다.
   아직 안 본 버전이면 점이 붙는다(사용자가 갱신을 알 수 있게) */
.ver{
  position:relative;flex:none;font-size:10.5px;font-weight:700;letter-spacing:-.01em;
  color:var(--ink3);padding:0 2px;font-variant-numeric:tabular-nums;
}
.ver::after{
  content:'';position:absolute;right:-2px;top:1px;width:5px;height:5px;border-radius:50%;
  background:var(--accent);opacity:0;transition:.2s;
}
.ver.nw{color:var(--accent)}
.ver.nw::after{opacity:1}
.ver::before{                       /* 히트 영역 */
  content:'';position:absolute;left:-6px;right:-6px;top:50%;transform:translateY(-50%);height:40px;
}
/* 변경 이력 */
.chg{border-left:2px solid var(--line2);padding:0 0 2px 13px;position:relative}
.chg:first-child{border-left-color:var(--accent)}
.chgh{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.chgh b{font-family:var(--serif);font-size:16px;color:var(--ink);letter-spacing:-.01em}
.chgh span{font-size:11px;color:var(--ink3)}
.chgnew{
  font-size:9.5px;font-weight:700;color:var(--accent);background:var(--accent-bg);
  border:1px solid var(--accent-line);border-radius:5px;padding:1px 5px;
}
.chg ul{margin:0;padding-left:17px;display:flex;flex-direction:column;gap:5px}
.chg li{font-size:12.5px;line-height:1.6;color:var(--ink2);word-break:keep-all}

/* ══════════════ 히트 영역 ══════════════
   실측: 40px 미만 컨트롤이 15개였다(보기 전환 33x33, 칩 높이 34, 푸터 링크 20 …).
   Apple 은 44pt, Material 은 48dp 를 권한다.

   두 가지 방법을 상황에 따라 쓴다.
   ① 주위에 여유가 있는 것 → ::before 를 깔아 **누를 수 있는 범위만** 넓힌다.
      보이는 크기와 배치는 그대로다.
   ② `overflow-x:auto` 로 가로 스크롤되는 행(.chips/.segs) 안의 것 →
      ::before 가 세로로 넘치면 그 컨테이너에 **세로 스크롤이 생긴다**
      (한 축이 auto 면 다른 축의 visible 이 auto 로 계산된다). 그래서 여기서는
      실제 높이를 33~34 → 38 로 올린다. 5px 은 눈에 거슬리지 않고 스크롤도 안 생긴다. */

/* ① 히트 영역만 확대 — 헤더·푸터·시트는 가로 스크롤이 없다.
   .sqb 는 38x38 이라 ::before 로 44 를 만든다. 1행은 가로 스크롤이 없어 안전하다. */
.ib, .sqb, .sitem .sdel, .inappbar .x, .flinks a, .flinks .lnkbtn, .cta, .donate{position:relative}
.ib::before, .sqb::before, .sitem .sdel::before, .inappbar .x::before{
  content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:44px;height:44px;
}
/* 가로는 이미 넉넉하므로 세로만 — 좌우로 넓히면 옆 버튼의 탭을 훔친다 */
.flinks a::before, .flinks .lnkbtn::before, .cta::before, .donate::before{
  content:'';position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:44px;
}
.flinks a::before, .flinks .lnkbtn::before{left:-6px;right:-6px;height:40px}

/* ② 실제 높이를 올리는 것들 (가로 스크롤 행 안에 있다) */
.sel{height:38px;background-position:calc(100% - 9px) 16px, calc(100% - 4px) 16px}
.chip{padding:8px 13px}
.seg{padding:9px 10px}
/* 인앱 브라우저 안내 배너 — 헤더 위에 붙어 스크롤과 함께 올라간다.
   sticky 로 두면 좁은 화면에서 목록을 계속 가린다 */
.inappbar{
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  padding:calc(var(--safe-t) + 10px) 16px 10px;
  background:var(--accent-bg);border-bottom:1px solid var(--accent-line);
  font-size:12px;line-height:1.5;color:var(--ink2);
}
.inappbar[hidden]{display:none}
.inappbar b{color:var(--ink)}
.inappbar .txt{flex:1;min-width:150px;word-break:keep-all}
.inappbar .go{
  flex:none;height:31px;padding:0 13px;border-radius:9px;font-size:12px;font-weight:700;
  background:var(--accent);color:var(--on-accent);border:0;text-decoration:none;
  display:inline-flex;align-items:center;gap:5px;
}
.inappbar .x{flex:none;width:26px;height:26px;border-radius:7px;color:var(--ink3);font-size:13px}
@media(min-width:1024px){ .inappbar{padding-left:calc(236px + 24px);padding-right:24px} }
.qacct{
  font-family:var(--serif);font-size:14.5px;color:var(--ink);margin:0;
  text-align:center;letter-spacing:-.01em;word-break:keep-all;
}
.qrbox .qcap{font-size:12px;color:var(--ink2);text-align:center;line-height:1.6}

/* ══════════════ 블라인드 테이스팅 게임 ══════════════
   시트 안에서만 쓰인다. 카드·행·막대 세 모양이 전부다. */
.glist{display:flex;flex-direction:column;gap:9px;margin:11px 0}
.gcard,.grow{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);
  color:var(--ink);
}
.gcard:active{background:var(--surface2)}
.grow{cursor:pointer}
.grow input{flex:none;width:19px;height:19px;margin-top:1px;accent-color:var(--accent)}
/* 고를 수 없는 항목은 숨기지 않고 흐리게 둔다 — 왜 못 고르는지 이유가 같이 보여야 한다 */
.goff{opacity:.5}
.gcard.goff{pointer-events:none}
.gletter{
  flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  background:var(--surface2);border:1px solid var(--line);
  font:700 15px/1 var(--serif);color:var(--ink2);
}
.gletter.on{background:var(--accent-bg);border-color:var(--accent-line);color:var(--accent)}
.gletter svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.gmeta{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.gmeta b{font-size:14px;font-weight:700;word-break:keep-all}
.gmeta b em{font-style:normal;font-size:11px;font-weight:600;color:var(--ink3)}
.gmeta i{font-style:normal;font-size:11.5px;color:var(--accent);font-weight:600}
.gmeta > span{font-size:12px;color:var(--ink2);line-height:1.55;word-break:keep-all}
.gmeta .hint{margin:2px 0 0}
.gmeta .hint b{font-size:12px;color:var(--accent);text-decoration:underline;cursor:pointer}
/* 축별 정답 태그 수. 0 인 축이 왜 문제인지 색으로 먼저 보이게 한다 */
.gtag{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.gtag i{
  font-style:normal;font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:6px;
  background:var(--surface2);border:1px solid var(--line);color:var(--ink2);
}
.gtag i.bad{background:#fdeaea;border-color:#f2c3c3;color:#b2413f}
.gtag i.na{color:var(--ink3)}
.gsum{
  margin:11px 0 0;padding:10px 12px;border-radius:10px;text-align:center;
  background:var(--surface2);font-size:12.5px;color:var(--ink2);
}
.gsum.warn{background:#fdeaea;color:#8f3634;text-align:left;line-height:1.6;word-break:keep-all}
.gsum.warn b{color:#8f3634}
/* 총점 — 결과의 첫 화면. 숫자가 제일 크다 */
.gsc{
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:16px;margin:0 0 13px;
  border-radius:14px;background:var(--accent-bg);border:1px solid var(--accent-line);
}
.gsc b{font:600 42px/1 var(--serif);color:var(--accent)}
.gsc span{font-size:12.5px;color:var(--ink2)}
.gsc i{font-style:normal;font-size:11.5px;color:var(--ink3)}
.gres{padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);margin-bottom:9px}
.grh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grh b{flex:1;min-width:110px;font-size:14px;font-weight:700;word-break:keep-all}
.grh em{font-style:normal;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px}
.grh em.ok{background:var(--accent-bg);color:var(--accent)}
.grh em.no{background:#fdeaea;color:#b2413f}
.grh u{text-decoration:none;font:600 17px/1 var(--serif);color:var(--ink)}
/* 항목별 획득 막대. 라벨 · 막대 · 점수 · 사유가 한 줄이고, 좁아지면 사유만 아래로 떨어진다 */
.gbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:7px;font-size:11.5px}
.gbar i{flex:none;width:64px;font-style:normal;color:var(--ink2)}
.gbar > span{flex:1;min-width:70px;height:7px;border-radius:4px;background:var(--surface2);overflow:hidden}
.gbar > span b{display:block;height:100%;border-radius:4px;background:var(--accent)}
.gbar u{flex:none;text-decoration:none;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.gbar em{flex:none;font-style:normal;color:var(--ink3)}
.gres .gtag i{font-size:10px;line-height:1.5;white-space:normal;word-break:keep-all}
/* 게임 결과 → 시음 기록. 강조색이지만 pri 버튼은 아니다 — 결과 화면의 주 동작은
   `새 판` 이고 이쪽은 선택이다. 폭을 다 쓰게 두어 병 이름이 접히지 않게 한다. */
.gsave{
  width:100%;margin-top:9px;justify-content:center;
  color:var(--accent);border-color:var(--accent-line);background:var(--accent-bg);
  white-space:normal;word-break:keep-all;line-height:1.45;
}
/* 난이도 — 셋업 맨 위. 규칙을 골라 두고 시작하는 것이라 병 목록보다 위에 있어야 한다.
   고른 난이도의 규칙을 바로 아래에 글로 적는다 — 이름만으로는 무엇이 달라지는지 모른다. */
.glv{margin:0 0 13px}
.glvseg{display:flex;gap:6px}
.glvb{
  flex:1;height:36px;border-radius:10px;font-size:13px;font-weight:600;
  background:var(--surface);border:1px solid var(--line);color:var(--ink2);
}
.glvb.on{background:var(--accent-bg);border-color:var(--accent-line);color:var(--accent);font-weight:700}
.glv p{
  margin:8px 0 0;font-size:11.5px;line-height:1.6;color:var(--ink2);
  word-break:keep-all;
}
.glv p b{color:var(--accent)}
/* 직접 설정 — 난이도를 만드는 레버 넷을 그대로 노출한다. `직접` 을 골랐을 때만 나온다.
   위의 요약 한 줄(.glv p)이 지금 조합을 읽어 주므로 여기서는 조작만 한다. */
.gopt{
  margin-top:9px;padding:11px;border-radius:11px;
  background:var(--surface2);display:flex;flex-direction:column;gap:9px;
}
.gopt label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.gopt label input{flex:none;width:17px;height:17px;margin-top:1px;accent-color:var(--accent)}
.gopt label span{font-size:11.5px;line-height:1.5;color:var(--ink2);word-break:keep-all}
.gopt label b{color:var(--ink);font-weight:700}
.gopt label i{display:block;font-style:normal;font-size:10.5px;color:var(--ink3);margin-top:1px}
.gor{display:flex;gap:8px;align-items:center}
.gor > span{flex:none;font-size:11.5px;color:var(--ink2)}
.gor select{
  flex:1;min-width:0;height:31px;padding:0 8px;border-radius:8px;font-size:11.5px;
  background:var(--surface);border:1px solid var(--line);color:var(--ink);
}
/* 맞힐 항목 — 켜고 끄면 배점이 자동으로 다시 나뉜다. 나뉜 결과를 바로 아래에
   숫자로 보여 준다: 켰을 때 무엇이 얼마나 줄어드는지 눈으로 보여야 고를 수 있다. */
.gcats{margin-top:11px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gcats > span{flex:none;width:100%;font-size:11.5px;color:var(--ink2);font-weight:600}
.gcatb{
  flex:none;padding:6px 11px;border-radius:999px;font-size:12px;
  background:var(--surface);border:1px solid var(--line);color:var(--ink3);
}
.gcatb.on{background:var(--accent-bg);border-color:var(--accent-line);color:var(--accent);font-weight:700}
.gcats > i{
  flex:none;width:100%;font-style:normal;font-size:10.5px;line-height:1.5;
  color:var(--ink3);word-break:keep-all;
}
.gcats > i b{color:var(--ink2)}
.gcatw{
  flex:none;width:100%;display:flex;flex-wrap:wrap;gap:4px;
  padding:8px;border-radius:9px;background:var(--surface2);
}
.gcatw em{font-style:normal;font-size:10.5px;color:var(--ink2)}
.gcatw em b{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
/* 지난 기록 — 게임이 아니라 보관함이라 목록 끝에서 모양을 달리한다(강조색 없음) */
.glogb .gletter{background:var(--surface2);color:var(--ink3)}
.glogb .gmeta b em{
  font-style:normal;font-size:10.5px;font-weight:700;padding:1px 6px;margin-left:4px;
  border-radius:5px;background:var(--accent-bg);color:var(--accent);
}
/* 기록 한 줄. 본문을 누르면 열리고 ✕ 로 지운다 — 지우기가 본문 탭을 훔치지 않게
   서로 다른 요소에 둔다 */
.glogr{cursor:default}
.glogr .gmeta{cursor:pointer}
.gdel{
  flex:none;width:28px;height:28px;border-radius:8px;font-size:12px;
  background:var(--surface2);border:1px solid var(--line);color:var(--ink3);
}
.gdel:active{background:#fdeaea;border-color:#f2c3c3;color:#b2413f}
/* 멀티 설정 — 참가자 수와 제한시간. 병 고르기보다 위에 둔다(판의 규칙이 먼저다) */
.gmp{
  margin:0 0 13px;padding:11px;border-radius:11px;
  background:var(--surface2);display:flex;flex-direction:column;gap:9px;
}
.gmp > i{
  font-style:normal;font-size:11px;line-height:1.6;color:var(--ink2);word-break:keep-all;
}
.gmp > i b{color:var(--ink)}
/* 넘겨주기 — 기기를 넘기는 사이 화면. 앞 사람의 입력을 가리는 것이 이 화면의 목적이라
   내용을 비우고 이름만 크게 둔다 */
.ghand{
  display:flex;flex-direction:column;align-items:center;gap:9px;
  padding:26px 16px;margin:0 0 13px;border-radius:14px;
  background:var(--accent-bg);border:1px solid var(--accent-line);text-align:center;
}
.ghand .gletter{width:52px;height:52px;border-radius:14px;font-size:22px}
.ghand b{font:600 22px/1.2 var(--serif);color:var(--ink)}
.ghand p{margin:0;font-size:13px;line-height:1.7;color:var(--ink2);word-break:keep-all}
.ghand p b{font-family:var(--sans);font-size:13px;font-weight:700;color:var(--accent)}
.ghand i{
  font-style:normal;font-size:11px;line-height:1.6;color:var(--ink3);word-break:keep-all;
}
.ghand i b{color:var(--ink2);font-weight:700}
/* 차례 머리 — 잔 입력 맨 위. 누가 하는 차례인지와 남은 시간 */
.gturn{
  display:flex;align-items:center;gap:10px;margin:0 0 11px;padding:9px 11px;
  border-radius:11px;background:var(--surface2);
}
.gturn .gletter{width:32px;height:32px;border-radius:9px;font-size:14px}
.gturn b{flex:1;min-width:0;font-size:14px;font-weight:700;color:var(--ink)}
.gturn u{
  flex:none;text-decoration:none;font:700 17px/1 var(--sans);color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.gturn u.off{font-size:11.5px;font-weight:600;color:var(--ink3)}
.gturn u.warn{color:#b2413f}
/* 힌트 — 축 머리 맨 오른쪽. 대가가 있는 동작이라 강조색을 쓰지 않는다 */
.nhint{
  flex:none;padding:2px 8px;border-radius:6px;font-size:10.5px;font-weight:600;
  background:var(--surface2);border:1px solid var(--line);color:var(--ink2);
}
.nhint:active{background:var(--accent-bg);color:var(--accent)}
</style>
</head>
<body>

<!-- 데스크톱(1024px+) 전용 좌측 사이드바. 모바일에서는 display:none 이므로
     상단의 탭 세그먼트와 주종 칩이 그대로 쓰인다.
     [data-tab]·[data-cat] 버튼은 어디에 있든 같은 핸들러(onNavClick)를 공유하지만
     **문서 위임이 아니다** — 컨테이너마다 따로 붙인다. 네 번째 사본을 만들면
     그 컨테이너에도 붙여야 한다. -->
<aside class="sidebar" id="side">

           상황이라 한 행을 통째로 쓰는 값이 컸다. 개별 해제는 필터 시트에서 한다. -->

/* 점수 = 매칭 방식의 신뢰도. 임계값은 아래 둘이다.
   ≥ MATCH_ON  → 자동으로 켠다
   ≥ MATCH_SUG → 추천만 한다(점선 강조, 켜지지는 않는다) */
const MATCH_ON = 0.75, MATCH_SUG = 0.5;
const MATCH_W = {exact:1, sub:0.9, syn:0.85, fam:0.7};
/** 한 축에서 텍스트에 맞는 디스크립터를 찾는다 → [{name, score, how}] */
function matchTags(ax, raw){
  const s = String(raw || '').toLowerCase();
  if (!s.trim()) return [];
  const list = NOTES[ax].list.map(x => x[0]);
  const parts = new Set(String(raw || '').split(/[,·/\n]/).map(x => x.trim()).filter(Boolean));
  /* 어형 비교용 낱말 — 조사·수식어가 붙은 덩어리를 공백·쉼표로 쪼갠다 */
  const toks = s.split(/[\s,·/\n]+/).map(x => x.replace(/[한의로된]$/, '')).filter(x => x.length >= 2);
  const hit = new Map();
  const put = (n, how) => {
    const sc = MATCH_W[how];
    if (!hit.has(n) || hit.get(n).score < sc) hit.set(n, {name:n, score:sc, how});
  };
  list.forEach(n => {
    if (parts.has(n)) return put(n, 'exact');           // 쉼표 조각과 완전히 같다
    if (s.includes(n.toLowerCase())) return put(n, 'sub');  // 문장 안에 이름이 들어 있다
    const vs = SYN[n];
    if (vs && vs.some(v => s.includes(v.toLowerCase()))) return put(n, 'syn');
    /* 어형 변화 — `스파이시` 와 `스파이스` 처럼 끝 글자만 다른 외래어를 잡는다.
       조건을 좁게 둔다: 둘 다 공백이 없고, 3글자 이상이며, 앞 3글자가 같고,
       길이 차가 1 이하. 공백을 막는 이유는 `다크 체리` / `다크 초콜릿` 이 앞 3글자를
       공유하기 때문이다 — 디스크립터 84개 중 유일한 충돌이고, 이 조건이 그것을 뺀다. */
    if (n.length >= 3 && !n.includes(' ')){
      const head = n.slice(0, 3).toLowerCase();
      if (toks.some(t => t.length >= 3 && !t.includes(' ')
          && t.slice(0, 3) === head && Math.abs(t.length - n.length) <= 1)) put(n, 'syn');
    }
  });
  /* 같은 아이콘 계열까지 넓힌다 — 추천 등급으로만 낸다(자동으로 켜지지 않는다) */
  const fams = new Set([...hit.keys()].map(n => NOTE_FAM[ax + '|' + n]));
  list.forEach(n => { if (!hit.has(n) && fams.has(NOTE_FAM[ax + '|' + n])) put(n, 'fam'); });
  return [...hit.values()].sort((a, b) => b.score - a.score);
}

function noteGrid(axis, raw, open, only, extra){
  const g = NOTES[axis];
  const { picked } = notePicked(axis, raw);
  const set = new Set(picked);
  /* extra: 켜지지는 않지만 **항상 보여야 하는** 이름(문장에서 자동으로 잡힌 것).
     접힌 그리드는 상위 10개만 내는데, 자동으로 잡힌 태그가 그 밖이면 표시할 칸이
     아예 없어 사용자가 무엇이 잡혔는지 볼 수 없다. */
  const ex = new Set(extra || []);
  const list = only
    ? g.list.filter(x => only.includes(x[0]) || set.has(x[0]))
    : g.list;
  const shown = (open || only) ? list
    : list.filter((x, i) => i < NOTE_TOP || set.has(x[0]) || ex.has(x[0]));
  const hidden = list.length - shown.length;
  return `<div class="ngrid" data-naxis="${axis}">${shown.map(([n, , ic2]) =>
      `<button type="button" class="ncell${set.has(n) ? ' on' : ''}" data-npick="${esc(n)}"
        aria-pressed="${set.has(n)}">${ic(ic2)}<span>${esc(n)}</span></button>`).join('')}</div>
    ${hidden > 0 || open
      ? `<button type="button" class="mini nmore" data-nmore="${axis}">${
          open ? '접기' : `전체 보기 (+${hidden})`}</button>`
      : ''}`;
}

function guessFlavors(it){
  const hay = [it.name_ko, it.name_en, it.cask, it.type, it.tags, it.nose, it.taste, it.region]
    .filter(Boolean).join(' ');
  const out = FLAVOR_RULES.filter(([, re]) => re.test(hay)).map(([f]) => f);
  return (out.length ? out : ['과일']).join(',');
}

function parsePrice(v){
  if (v == null || v === '') return '';
  const s = String(v).replace(/[,\s₩원]/g, '');
  const m = s.match(/^(\d+(?:\.\d+)?)만$/);
  if (m) return Math.round(parseFloat(m[1]) * 10000);
  const n = parseFloat(s.replace(/[^\d.]/g, ''));
  return isNaN(n) ? '' : Math.round(n);
}
function parseRange(v){
  if (!v) return ['',''];
  const p = String(v).split(/[~\-–—]/);
  return p.length > 1 ? [parsePrice(p[0]), parsePrice(p[1])] : [parsePrice(p[0]), ''];
}
const won = n => (n === '' || n == null || isNaN(n)) ? '' : Number(n).toLocaleString('ko-KR') + '원';
const wonShort = n => {
  if (n === '' || n == null || isNaN(n)) return '';
  const v = Number(n);
  if (v < 10000) return v.toLocaleString();
  const m = v / 10000;
  /* 100만원 이상은 소수점을 버린다 — 0.5만(5천원)은 시세 추정에서 의미가 없고,
     카드 3번째 줄에서 그 두 글자가 도수를 밀어내는 편이 손해다 */
  return (m >= 100 ? String(Math.round(m))
    : m.toFixed(v % 10000 ? 1 : 0).replace(/\.0$/, '')) + '만';
};

/* UTF-8 ↔ base64 (한글이 섞이므로 TextEncoder 경유) */
function b64enc(str){
  const b = new TextEncoder().encode(str);
  let s = '';
  for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode(...b.subarray(i, i + 0x8000));
  return btoa(s);
}
function b64dec(b64){
  const raw = atob(String(b64).replace(/\s/g, ''));
  const u = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) u[i] = raw.charCodeAt(i);
  return new TextDecoder().decode(u);
}
async function gh(path, opt){
  const r = await fetch('https://api.github.com/repos/' + SYNC.repo + '/contents/' + path +
      (opt?.method === 'PUT' ? '' : '?ref=' + encodeURIComponent(SYNC.branch)), {
    method: opt?.method || 'GET',
    headers: {
      Authorization: 'Bearer ' + ghToken(),
      Accept: 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      ...(opt?.body ? {'Content-Type':'application/json'} : {}),
    },
    body: opt?.body,
  });
  if (r.status === 404) return {missing: true};
  const j = await r.json().catch(() => null);
  if (!r.ok) throw new Error((j && j.message) || ('HTTP ' + r.status));
  return j;
}
/** 원격 파일 읽기.
    Contents API 는 1MB 를 넘으면 content 를 비우고 encoding:'none' 을 돌려준다.
    사진이 늘면 바로 이 한계에 걸리므로, 그 경우 raw 미디어타입으로 본문을 다시 받는다. */
async function ghReadFile(path){
  const meta = await gh(path);
  if (meta.missing) return {missing: true};
  const out = {sha: meta.sha, size: meta.size || 0, encoding: meta.encoding || '', text: ''};
  if (meta.encoding === 'base64' && meta.content){
    try{ out.text = b64dec(meta.content); }catch(e){ out.text = ''; }
  }
  if (!out.text && meta.sha){
    /* 1MB 초과 파일은 Blobs API 로 받는다 (최대 100MB).
       contents 엔드포인트에 raw 미디어타입을 요청하면 서버가 무시하고
       JSON 봉투를 돌려주는 경우가 있어, 그것을 파일 내용으로 오인하게 된다. */
    const r = await fetch('https://api.github.com/repos/' + SYNC.repo + '/git/blobs/' + meta.sha, {
      headers: {Authorization: 'Bearer ' + ghToken(), Accept: 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28'},
    });
    if (r.ok){
      const b = await r.json().catch(() => null);
      if (b && b.encoding === 'base64' && b.content){
        try{ out.text = b64dec(b.content); out.via = 'blob'; }catch(e){}
      }
      out.blobEncoding = b?.encoding || '';
    } else out.rawStatus = r.status;
  }
  /* 그래도 API 봉투가 담겨 있으면 한 겹 더 벗긴다 (예전 버전이 잘못 저장한 경우) */
  if (out.text){
    try{
      const j = JSON.parse(out.text);
      if (j && !Array.isArray(j.items) && typeof j.content === 'string' && j.encoding === 'base64'){
        out.text = b64dec(j.content);
        out.via = (out.via ? out.via + '+' : '') + 'unwrap';
      }
    }catch(e){}
  }
  return out;
}
/** 원격/로컬 병합 — 항목은 updated_at 이 최신인 쪽, 삭제는 툼스톤이 최신이면 삭제 유지 */
function mergeSnapshot(remote){
  const tombs = {...(remote.meta?.tombs || {}), ...(DB.meta.tombs || {})};
  for (const [id, t] of Object.entries(remote.meta?.tombs || {}))
    if ((DB.meta.tombs?.[id] || '') > t) tombs[id] = DB.meta.tombs[id];
  const map = new Map();
  for (const it of (remote.items || [])) map.set(it.id, normalize(it));
  let added = 0, updated = 0;
  for (const it of DB.items){
    const r = map.get(it.id);
    if (!r){ map.set(it.id, it); added++; }
    else if ((it.updated_at || '') > (r.updated_at || '')){ map.set(it.id, it); updated++; }
  }
  const items = [...map.values()].filter(it => {
    const t = tombs[it.id];
    return !(t && t > (it.updated_at || ''));
  });
  const before = DB.items.length;
  DB.items = items;
  DB.meta.tombs = tombs;
  return {pulled: Math.max(0, items.length - before + added), local: added + updated};
}

     매번 "달라졌다"고 판단해 커밋이 무한히 쌓인다. */
  const items = [...DB.items].sort((a, b) => String(a.id).localeCompare(String(b.id)));
  return JSON.stringify({

          throw new Error(`원격 파일 JSON 파싱 실패 (${got.size}바이트, 경로 ${SYNC.path})`

      render();
      const body = snapshot();
      size = Math.round(body.length / 1024);
      if (body.length > 5e6 && !quiet && attempt === 1)
        toast('⚠ 데이터가 ' + Math.round(body.length / 1e6) + 'MB입니다 — 사진이 많으면 동기화가 느려집니다');

        const put = await gh(SYNC.path, {method:'PUT', body: JSON.stringify({

  'ㄷ':'t','ㄸ':'t','ㅌ':'t','ㅂ':'p','ㅃ':'p','ㅍ':'p',
