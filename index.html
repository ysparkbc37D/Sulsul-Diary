  --safe-b:env(safe-area-inset-bottom,0px);
}
/* ── Speakeasy Lounge (다크 토글) ───────────────────────────────
   High-end Speakeasy Lounge · Premium Whisky Collector's Cabinet
   기본 테마는 라이트이며, 사용자가 ⚙️에서 전환할 때 이 팔레트가 적용된다. */
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121214;            /* Dark Slate */
  --surface:#1C1C1F;       /* Dark Charcoal */
  --surface2:#232327;
  --line:#2C2C31;
  --line2:#3A3A41;
  --ink:#FFFFFF;
  --ink2:#C9C9CE;
  --ink3:#8E8E93;          /* Subtitle Gray */
  --accent:#C58B43;        /* Rich Amber Gold */
  --accent2:#D4AF37;       /* Muted Gold */
  --beige:#E5D3B3;         /* Warm Beige */
  --accent-bg:#241B10;
  --accent-line:#4A3620;
  --ok:#6FBF7A; --warn:#D4AF37; --off:#5A5A61; --danger:#c0503c;
  /* 사진 패널은 다크에서도 순백 — normalizeThumb 이 흰 캔버스를 데이터에
     구워 넣으므로, 패널만 따뜻하게 하면 정규화된 썸네일과 색이 어긋난다 */
  --shot:#FFFFFF;
  --sh1:0 1px 2px rgba(0,0,0,.50), 0 8px 24px -14px rgba(0,0,0,.90);
  --sh2:0 8px 20px rgba(0,0,0,.55), 0 30px 60px -30px rgba(0,0,0,1);
}
/* 라이트 테마의 사진 패널은 순백 */
:root{ --shot:#ffffff; --beige:#8a6a2f; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.6;
  min-height:100dvh; -webkit-text-size-adjust:100%;
  /* Cormorant 의 기본 숫자는 올드스타일이라 4·9 가 베이스라인 아래로 내려간다.
     도수·가격·평점처럼 한글과 나란히 읽는 수치에서 들쭉날쭉해 보이므로
     라이닝으로 고정한다. 산세리프는 이미 라이닝이라 영향이 없다. */
  font-variant-numeric:lining-nums;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
a{color:var(--accent);text-underline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ══════════════ header ══════════════ */
header.top{
  position:sticky;top:0;z-index:30;
  padding:calc(var(--safe-t) + 12px) 16px 11px;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:9px}
.brand{flex:1;min-width:0;display:flex;align-items:baseline;gap:9px}
/* 워드마크 — 로마자는 세리프가 잘 어울린다. Diary 만 앰버로 강조 */
.wm{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:-.005em;line-height:1}
.wm b{color:var(--accent);font-weight:600}
.wm2{font-size:9.5px;letter-spacing:.16em;color:var(--ink3);font-weight:600;white-space:nowrap}
.cnt{font-size:11.5px;color:var(--ink3);white-space:nowrap;flex:none}
@media(max-width:420px){ .wm2{display:none} }
.ib{
  width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;
  background:var(--surface);border:1px solid var(--line);color:var(--ink2);font-size:15px;
  box-shadow:var(--sh1);transition:.15s;
}
.ib:active{transform:scale(.94)}
/** 아이콘은 currentColor 로 그린다 — 컬러 이모지는 다크 테마에서 흰 판으로 떠 보였다 */
.ib svg{
  width:18px;height:18px;fill:none;stroke:currentColor;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
}
.ibwrap{position:relative;flex:none;display:inline-flex}
.syncdot{
  position:absolute;top:-1px;right:-1px;width:9px;height:9px;border-radius:50%;
  border:2px solid var(--bg);background:transparent;transition:.2s;pointer-events:none;
}
.syncdot.busy{background:var(--warn);animation:sdp 1.1s ease-in-out infinite}
.syncdot.ok{background:var(--ok)}
.syncdot.err{background:var(--danger)}
@keyframes sdp{50%{opacity:.3}}
.cta{
  height:36px;padding:0 15px;border-radius:11px;flex:none;
  background:var(--ink);color:var(--bg);font-weight:600;font-size:13.5px;letter-spacing:-.01em;
  box-shadow:var(--sh1);transition:.15s;
}
:root[data-theme="dark"] .cta{background:var(--accent);color:#1a1409}
.cta:active{transform:scale(.96)}

/* ══════════════ controls ══════════════ */
.wrap{max-width:1120px;margin:0 auto;padding:0 16px calc(80px + var(--safe-b))}
.controls{padding-top:14px;display:flex;flex-direction:column;gap:10px}
.search{position:relative}
.search input{
  width:100%;height:44px;padding:0 40px;border-radius:13px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh1);
}
.search input::placeholder{color:var(--ink3)}
.search input:focus{outline:none;border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-bg)}
.search .mg{position:absolute;left:14px;top:12px;color:var(--ink3);font-size:15px}
.search .mg svg{
  width:16px;height:16px;display:block;fill:none;stroke:currentColor;
  stroke-width:1.9;stroke-linecap:round;
}
.search .cl{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:8px;color:var(--ink3)}
/* 주종 세그먼트 — 최상위 구분이므로 필터 칩과 형태를 다르게 한다 */
.segs{
  display:flex;gap:3px;padding:3px;border-radius:12px;
  background:var(--surface2);border:1px solid var(--line);
  overflow-x:auto;scrollbar-width:none;
}
.segs::-webkit-scrollbar{display:none}
.segs:empty{display:none}
.seg{
  flex:1 1 auto;min-width:max-content;padding:7px 10px;border-radius:9px;
  font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap;
  letter-spacing:-.02em;transition:.15s;
}
.seg b{font-weight:600;color:var(--ink3);margin-left:4px;font-size:11px}
.seg.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh1)}
.seg.on b{color:var(--accent)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:1px}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:6px 13px;border-radius:999px;font-size:12.5px;
  background:var(--surface);border:1px solid var(--line);color:var(--ink2);white-space:nowrap;
  transition:.15s;
}
.chip b{color:var(--ink3);font-weight:600;margin-left:3px}
.chip.on{background:var(--accent-bg);border-color:var(--accent-line);color:var(--accent);font-weight:600}
.chip.on b{color:var(--accent2)}
/* 필터가 3개로 늘어 폰에서 넘칠 수 있다 — 페이지를 밀지 않고 이 줄만 스크롤되게 한다 */
.rowf{display:flex;gap:7px;align-items:center;overflow-x:auto;scrollbar-width:none;padding:1px}
.rowf::-webkit-scrollbar{display:none}
.rowf > *{flex:none}
.sel{
  height:33px;padding:0 26px 0 10px;border-radius:9px;background:var(--surface);
  border:1px solid var(--line);color:var(--ink2);font-size:12.5px;
  appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),
    linear-gradient(135deg,var(--ink3) 50%,transparent 50%);
  background-position:calc(100% - 14px) 14px, calc(100% - 9px) 14px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
.sline{font-size:11.5px;color:var(--ink3);white-space:nowrap;padding-left:2px}
.sline:empty{display:none}
/* 필터 버튼 — 적용된 개수를 배지로 보여준다 */
.fbtn{background-image:none;padding:0 12px;font-weight:600;color:var(--ink)}
.fbtn b{color:var(--accent);margin-left:5px;font-size:11.5px}
.fbtn b:empty{display:none}
.fbtn.on{background:var(--accent-bg);border-color:var(--accent-line);color:var(--accent)}
/* 리스트/그리드 전환 */
.viewtg{
  width:33px;height:33px;border-radius:9px;flex:none;margin-left:auto;
  background:var(--surface);border:1px solid var(--line);color:var(--ink2);
  display:grid;place-items:center;font-size:14px;
}
.viewtg:active{background:var(--surface2)}
/* 활성 필터 칩 */
#activeChips:empty{display:none}
#activeChips .chip{background:var(--accent-bg);border-color:var(--accent-line);color:var(--accent);font-weight:600}
#activeChips .chip i{font-style:normal;margin-left:5px;color:var(--accent2)}

/* ══════════════ grid ══════════════ */
.grid{display:grid;gap:12px;margin-top:16px;grid-template-columns:repeat(auto-fill,minmax(152px,1fr))}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;display:flex;flex-direction:column;text-align:left;
  box-shadow:var(--sh1);transition:transform .16s, box-shadow .16s;
}
.card:active{transform:scale(.982)}
@media(hover:hover){ .card:hover{box-shadow:var(--sh2);transform:translateY(-2px)} }
.thumb{
  position:relative;aspect-ratio:3/4;background:var(--shot);overflow:hidden;
  display:grid;place-items:center;border-bottom:1px solid var(--line);
}
/* 절대 위치로 빼야 원본 이미지의 내재 높이가 3:4 프레임을 밀어내지 못한다.
   채우기는 normalizeThumb 이 캔버스에 구워 넣는다(사진은 cover, 병 컷은 높이 98%).
   CSS 확대 보정을 쓰지 않으므로 저장된 그림과 보이는 그림이 같다. */
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
/* 정규화 실패(CORS)한 원본은 여백을 알 수 없다 → cover 로 프레임만 채운다 */
.thumb.raw img{inset:0}
.ph{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;
  background:linear-gradient(170deg, var(--phA, #f3efe8), var(--phB, #e9e2d6));
}
.ph span{font-family:var(--serif);font-size:22px;color:var(--phT, #a98b52);letter-spacing:.03em;
  position:relative;z-index:1}
.ph small{font-size:9.5px;color:var(--ink3);letter-spacing:.06em;position:relative;z-index:1}
/* 앰버 글래스 병 실루엣 — SVG 자체가 알파를 가지므로 컨테이너는 거의 불투명하게 둔다 */
.ph svg{position:absolute;width:54%;max-width:96px;height:auto;opacity:.92}
/* 잔량 게이지 */
.lvl{height:3px;border-radius:2px;background:var(--surface2);overflow:hidden;margin-top:7px}
.lvl i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.lvlx{font-size:10.5px;color:var(--ink3);margin-left:auto}
/* 카드 4번째 줄 — 잔량 바는 어떤 병에도 그려진다(미개봉 100% / 비움 0%).
   보유 중이 아닌 경험·위시는 빈 트랙을 흐리게 두어 0% 와 구분한다 */
.lvlrow{display:flex;align-items:center;gap:6px;margin-top:8px}
.lvlrow .lvl{flex:1;min-width:0;margin-top:0}
.lvlrow .lvlx{flex:none;margin-left:0;min-width:26px;text-align:right;font-size:10px}
.lvl.na{opacity:.38}
.lvl.na + .lvlx, .lvlrow .lvl.na ~ .lvlx{opacity:.55}
/* 리스트 뷰 */
.listv{display:flex;flex-direction:column;gap:7px;margin-top:16px}
.rowi{
  display:flex;align-items:center;gap:11px;padding:9px 11px;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:var(--sh1);
}
.rowi:active{background:var(--surface2)}
.rowi .th{width:36px;height:48px;border-radius:7px;overflow:hidden;flex:none;
  background:var(--shot);border:1px solid var(--line);position:relative}
/* 38×47 타일에서 5% 흰 띠는 2px 남짓이라 확대 없이 cover 만으로 충분하다 */
.rowi .th img{width:100%;height:100%;object-fit:cover;display:block}
.rowi .ph span{font-size:13px}
.rowi .ph small{display:none}
.rowi .ph svg{width:52%}
.rowi .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rowi .nm{font-size:13.5px;font-weight:600;letter-spacing:-.015em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowi .sub{font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowi .rt{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
/* 리스트 행의 잔량 바는 짧게 — 넓으면 구분선처럼 보인다 */
.rowi .lvl{max-width:110px}
/* 사진 우상단 표식 — 좌: 상태(미개봉·오픈·비움·경험), 우: 19세 이용 표기.
   주류를 다루므로 19세 표기는 모든 카드에 붙는다. 두 표식은 같은 크기·같은
   유리판 처리로 한 쌍처럼 보이게 하고, 상태색은 안쪽 작은 원이 담당한다
   (칩과 색을 같은 요소에 걸면 background 가 서로를 덮어쓴다). */
.cflags{position:absolute;right:7px;top:7px;z-index:2;display:flex;align-items:center;gap:3px}
.cflags .fl{
  width:17px;height:17px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:color-mix(in srgb, var(--surface) 84%, transparent);
  border:1px solid var(--line2);backdrop-filter:blur(3px);
}
.adult{font-size:8.5px;font-weight:700;letter-spacing:-.04em;color:var(--ink2);
  font-variant-numeric:tabular-nums}
.dot{width:7px;height:7px;border-radius:50%}
.s-sealed{background:var(--ok)} .s-open{background:var(--warn)} .s-empty{background:var(--off)}
/* 보유하지 않은 두 상태는 속이 빈 고리로 — 경험은 앰버, 위시는 회색 */
.s-tried{background:transparent;border:2px solid var(--accent2);width:9px;height:9px}
.s-wish{background:transparent;border:2px solid var(--ink3);width:9px;height:9px}
.trd{font-size:9.5px;color:var(--accent);border:1px solid var(--accent-line);
  padding:0 5px;border-radius:5px;line-height:18px}
.cbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.ctype{font-size:9.5px;letter-spacing:.09em;color:var(--ink3);text-transform:uppercase;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.abv{font-size:11px;color:var(--ink3)}
.cbody h3{margin:0;font-size:13.5px;line-height:1.35;letter-spacing:-.015em;font-weight:600}
/* 카드 3번째 줄 — 평점·기타 배지 / 도수 / 가격.
   좁은 폭에서는 도수부터 줄어들게 하고 평점과 가격은 끝까지 남긴다.
   값이 없어도 min-height 로 자리를 지켜야 카드끼리 줄이 맞는다. */
.cfoot{margin-top:auto;display:flex;align-items:center;gap:4px;padding-top:7px;min-height:24px}
.cbg{display:flex;align-items:center;gap:3px;flex:0 0 auto}
.cbg .sc{padding:0 6px}          /* 좁은 카드에서 도수·가격에 폭을 양보한다 */
/* 상태 표식 — 사진 좌상단. 사진이 밝으므로 반투명 판을 깔아 대비를 확보한다 */
.cmark{
  position:absolute;left:7px;top:7px;z-index:2;display:flex;gap:3px;
  max-width:calc(100% - 30px);flex-wrap:wrap;
}
.cmark .trd, .cmark .dr{
  background:color-mix(in srgb, var(--surface) 86%, transparent);
  backdrop-filter:blur(3px);
}
.abv{font-size:11px;color:var(--ink3);flex:0 1 auto;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc{
  font-family:var(--serif);font-size:12.5px;color:var(--accent);
  border:1px solid var(--accent-line);background:var(--accent-bg);
  padding:0 7px;border-radius:6px;line-height:19px;
}
.dr{
  font-size:9.5px;color:var(--warn);border:1px solid var(--accent-line);
  padding:0 5px;border-radius:5px;line-height:18px;letter-spacing:.02em;
}
.pr{font-size:11.5px;color:var(--ink3);margin-left:auto}
.empty{
  text-align:center;padding:60px 22px;color:var(--ink2);
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:18px;
}
.empty h3{margin:0 0 8px;font-family:var(--serif);font-size:18px;font-weight:400;color:var(--ink)}
/* 빈 상태에서 무엇이 걸러내는지 보여 주는 칩 — 목록이 아니라 설명이므로 가운데 정렬 */
.empty .ecs{justify-content:center;flex-wrap:wrap;margin-top:12px;overflow:visible}
.empty .ebtn{margin:14px auto 0;max-width:200px}
.empty p{margin:0;font-size:13.5px}

/* ══════════════ sheet ══════════════ */
.scrim{
  position:fixed;inset:0;background:rgba(28,24,21,.36);backdrop-filter:blur(2px);z-index:40;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:94dvh;
  display:flex;flex-direction:column;background:var(--surface);
  border-radius:22px 22px 0 0;box-shadow:var(--sh2);
  transform:translateY(101%);transition:transform .26s cubic-bezier(.32,.72,0,1);
}
.sheet.on{transform:translateY(0)}
@media(min-width:760px){
  .sheet{max-width:700px;margin:0 auto;border-radius:20px;bottom:2vh;max-height:92dvh;
    border:1px solid var(--line);transform:translateY(calc(101% + 4vh))}
}

/* ══════════════ 데스크톱 좌측 사이드바 (1024px+) ══════════════
   사이드바는 기본적으로 숨어 있고, 넓은 화면에서만 나타난다.
   헤더는 그대로 두고 main 쪽으로 밀어 '컴팩트 상단바'로 재사용한다 —
   검색·정렬·추가 버튼을 옮기지 않으므로 기존 핸들러가 전부 그대로 동작한다. */
.sidebar{display:none}
@media(min-width:1024px){
  .sidebar{
    display:flex;flex-direction:column;gap:18px;
    position:fixed;left:0;top:0;bottom:0;width:236px;z-index:40;
    padding:calc(var(--safe-t) + 22px) 18px calc(18px + var(--safe-b));
    background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;
  }
  .sidebar-brand{display:flex;flex-direction:column;gap:3px;padding:0 6px}
  .sidebar-brand .wm{font-size:24px}
  .sidebar-brand .wm2{display:block}          /* 좁은 화면에서 숨긴 것을 여기선 되살린다 */
  .sidebar-nav{display:flex;flex-direction:column;gap:2px}
  .sidebar-nav .navsec{
    font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);
    font-weight:600;padding:6px 8px 4px;
  }
  .sidebar-nav .seg{
    display:flex;align-items:center;gap:8px;width:100%;text-align:left;
    padding:8px 10px;border-radius:10px;font-size:13.5px;font-weight:600;
    color:var(--ink2);letter-spacing:-.01em;transition:.13s;
  }
  .sidebar-nav .seg b{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--ink3)}
  .sidebar-nav .seg:hover{background:var(--surface2);color:var(--ink)}
  .sidebar-nav .seg.on{background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-line)}
  .sidebar-nav .seg.on b{color:var(--accent2)}
  /* 선택 항목에 테두리가 생기면서 1px 밀리는 것을 막는다 */
  .sidebar-nav .seg:not(.on){border:1px solid transparent}
  .sidebar-foot{margin-top:auto;display:flex;flex-direction:column;gap:7px;
    padding-top:14px;border-top:1px solid var(--line)}
  .sidebar-foot .sk{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
    font-size:11.5px;color:var(--ink3);padding:0 8px}
  .sidebar-foot .sk b{font-family:var(--serif);font-size:15px;color:var(--ink);font-weight:600}

  /* 넓은 화면에서는 폭을 묶지 않는다 — max-width 를 두면 사이드바 오른쪽에
     빈 띠가 남고 열 수가 고정된다(1180px 상한에서는 늘 5열이었다).
     카드 최소폭(minmax)이 크기를 지키므로 열 수만 화면에 맞춰 늘어난다.
     헤더 콘텐츠 시작점(236+24)과 .wrap 의 콘텐츠 시작점을 일치시켜 둔다. */
  header.top{padding-left:calc(236px + 24px);padding-right:24px}
  .top-in{max-width:none}
  /* 워드마크는 사이드바로 옮겼다. 병 수(#hdCnt)는 상단바에 남겨 둔다 */
  .brand .wm, .brand .wm2{display:none}
  .brand .cnt{font-size:13px}
  .wrap{max-width:none;margin-left:236px;padding-left:24px;padding-right:24px}
  #catSegs{display:none}                    /* 주종 전환은 사이드바가 담당 */
  /* 176px 은 임의값이 아니다 — auto-fill 은 남는 폭을 열에 나눠 주므로 하한이
     높으면 열 수가 하나 줄면서 카드가 확 넓어진다. 176 은 1280~2560px 구간에서
     카드 폭을 183~190px 로 붙잡아 화면 크기와 무관하게 같아 보이게 하는 값이다. */
  .grid{grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:16px}
  /* left 로 밀어야 margin:0 auto 가 사이드바 오른쪽 영역 안에서 중앙을 잡는다.
     margin-left 로 밀면 auto 중앙정렬이 깨져 시트가 왼쪽에 붙는다. */
  .sheet{left:236px}
  .scrim{left:236px}
}
.sh-head{
  position:relative;display:flex;align-items:center;gap:10px;flex:none;
  padding:16px 16px 12px;border-bottom:1px solid var(--line);
}
.grab{position:absolute;left:50%;transform:translateX(-50%);top:7px;width:34px;height:4px;
  border-radius:2px;background:var(--line2)}
.sh-head h2{margin:0;font-size:15.5px;font-weight:600;letter-spacing:-.015em;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(22px + var(--safe-b))}
.sh-foot{
  flex:none;display:flex;gap:8px;padding:11px 16px calc(11px + var(--safe-b));
  border-top:1px solid var(--line);background:var(--surface);
}
.btn{
  flex:1;height:45px;border-radius:12px;font-weight:600;font-size:14px;letter-spacing:-.01em;
  background:var(--surface);border:1px solid var(--line2);color:var(--ink);transition:.15s;
}
.btn:active{transform:scale(.98)}
/* 아이콘을 넣으려면 버튼이 flex 여야 한다 (글자만 있어도 동작은 같다).
   a 는 button 과 달리 내용이 가운데 정렬되지 않으므로 여기서 함께 맞춘다 */
.btn, a.btn{display:flex;align-items:center;justify-content:center;gap:7px;text-decoration:none}
/* 인라인 아이콘 — currentColor 로 그려 버튼 색을 그대로 따른다 */
.ic{
  width:15px;height:15px;flex:none;fill:none;stroke:currentColor;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
}
.mini .ic{width:13px;height:13px;stroke-width:1.8}
.donate .ic{width:14px;height:14px}
.hint .ic{width:12.5px;height:12.5px;stroke-width:1.9;vertical-align:-2px}
.btn.pri{background:var(--ink);color:var(--bg);border:none}
:root[data-theme="dark"] .btn.pri{background:var(--accent);color:#1a1409}
.btn.gold{background:linear-gradient(180deg,#d7a643,#bd8a2a);color:#231803;border:none}
.btn.dgr{flex:none;width:70px;background:transparent;border-color:var(--line2);color:var(--danger)}
.lnk2{width:100%;text-align:center;font-size:13px;color:var(--ink3);padding:10px 0;text-decoration:underline}

/* ══════════════ record card ══════════════ */
.hero{display:flex;gap:14px;margin-bottom:6px}
.hero .im{
  width:104px;flex:none;aspect-ratio:3/4;border-radius:12px;overflow:hidden;position:relative;
  background:var(--shot);border:1px solid var(--line);
}
.hero .im.raw img{inset:6px}
.hero .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.hero .hi{min-width:0;display:flex;flex-direction:column;gap:3px;padding-top:2px}
.hero h3{margin:0;font-size:18px;line-height:1.3;letter-spacing:-.02em;font-weight:600}
.hero .en{margin:0;font-family:var(--serif);font-size:12.5px;color:var(--ink2);line-height:1.4}
.bdgs{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.bdg{
  font-size:10.5px;padding:2.5px 8px;border-radius:999px;background:var(--surface2);
  color:var(--ink2);letter-spacing:.02em;
}
.bdg.am{background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-line);font-weight:600}
.bdg.wn{background:transparent;color:var(--warn);border:1px solid var(--accent-line)}
h4.sec{
  font-size:10px;color:var(--ink3);margin:24px 0 10px;letter-spacing:.14em;font-weight:700;
  text-transform:uppercase;display:flex;align-items:center;gap:10px;
}
h4.sec::after{content:"";flex:1;height:1px;background:var(--line)}
/* 핵심 4개 스탯 스트립 — 11행 표를 매번 훑지 않게 한다 */
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.strip > div{
  background:var(--surface2);border-radius:11px;padding:9px 6px;text-align:center;min-width:0;
}
.strip span{display:block;font-size:9.5px;letter-spacing:.08em;color:var(--ink3);text-transform:uppercase}
.strip b{display:block;font-family:var(--serif);font-size:15px;margin-top:3px;letter-spacing:-.01em}
.caskline{margin:10px 0 0;font-size:12.5px;color:var(--ink2);line-height:1.55}
.caskline span{font-size:9.5px;letter-spacing:.1em;color:var(--ink3);text-transform:uppercase;margin-right:6px}
.more{margin-top:12px}
.more summary{
  cursor:pointer;font-size:12.5px;color:var(--accent);padding:8px 0;
  list-style:none;display:flex;align-items:center;gap:5px;
}
.more summary::-webkit-details-marker{display:none}
.more summary::after{content:'▾';font-size:10px}
.more[open] summary::after{content:'▴'}
table.spec{width:100%;border-collapse:collapse;font-size:13.5px}
table.spec th,table.spec td{padding:9px 2px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.spec th{width:98px;color:var(--ink3);font-weight:500;white-space:nowrap;font-size:12.5px}
table.spec td{color:var(--ink)}
table.spec tr:last-child th,table.spec tr:last-child td{border-bottom:none}
.na{color:var(--ink3)}
.tnote{margin-bottom:14px}
.tnote .lb{
  display:block;font-size:9.5px;letter-spacing:.16em;color:var(--accent);font-weight:700;
  text-transform:uppercase;margin-bottom:3px;
}
.tnote p{margin:0;font-size:13.5px;line-height:1.65}
.rate{display:flex;align-items:flex-end;gap:12px;margin-top:2px}
.rate .big{font-family:var(--serif);font-size:34px;line-height:1;letter-spacing:-.02em}
.rate .rm{font-size:11.5px;color:var(--ink3);line-height:1.45;padding-bottom:3px}
.gauge{height:4px;border-radius:2px;background:var(--surface2);overflow:hidden;margin-top:11px}
.gauge i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.rlist{margin-top:12px;display:flex;flex-direction:column;gap:7px}
.rlist div{display:flex;font-size:12.5px;gap:10px}
.rlist b{width:92px;flex:none;color:var(--ink3);font-weight:500}
/* 잔량 패널 */
.lvlbig{margin-bottom:14px}
.lvlbar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.lvlbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.lvlrow{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;
  font-size:12.5px;color:var(--ink2)}
.lvlrow b{color:var(--accent)}
.lvlbtns{display:flex;gap:5px;margin-left:auto}
/* 시음 기록 */
.sess{display:flex;flex-direction:column;gap:8px}
/* 시음 기록 타임라인 — 세로 레일 + 기록마다 노드 하나.
   레일은 마지막 항목 아래로 이어지지 않아야 '끝'으로 읽힌다 */
.tline{display:flex;flex-direction:column;gap:10px}
.sitem{
  background:var(--surface2);border-radius:12px;padding:10px 12px;
  position:relative;margin-left:15px;
}
.sitem::before{                       /* 노드 */
  content:'';position:absolute;left:-15px;top:15px;width:9px;height:9px;border-radius:50%;
  background:var(--accent);border:2px solid var(--surface);box-sizing:content-box;
}
.sitem::after{                        /* 레일 — 다음 항목까지 */
  content:'';position:absolute;left:-9px;top:28px;bottom:-14px;width:1px;background:var(--line2);
}
.sitem:last-child::after{display:none}
.sitem .sh{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.sitem .sh b{font-size:12.5px;color:var(--ink)}
.sago{font-size:10.5px;color:var(--ink3)}
/* 직전 기록 대비 점수 변화 — 색만으로 구분하지 않고 ▲▼ 기호를 함께 쓴다 */
.sdel2{font-size:10px;font-weight:700;padding:1px 5px;border-radius:5px;letter-spacing:-.02em}
.sdel2.up{color:var(--ok);background:color-mix(in srgb, var(--ok) 14%, transparent)}
.sdel2.dn{color:var(--danger);background:color-mix(in srgb, var(--danger) 12%, transparent)}
.sitem .sdel{margin-left:auto;color:var(--ink3);font-size:12px;width:22px;height:22px;border-radius:6px}
.sitem .sm{font-size:11.5px;color:var(--ink3);margin-top:3px}
.sitem p{margin:6px 0 0;font-size:13px;line-height:1.6;color:var(--ink2)}
pre.csv{
  background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:11px;
  font-size:11px;overflow-x:auto;white-space:pre;color:var(--ink2);margin:0;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
.lrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.lnk{
  font-size:12px;padding:7px 11px;border-radius:9px;background:var(--surface);
  border:1px solid var(--line);color:var(--ink2);text-decoration:none;
}
.credit{font-size:10.5px;color:var(--ink3);margin-top:6px;line-height:1.5;word-break:keep-all}
.credit a{color:var(--ink3);text-decoration:underline;text-underline-offset:2px}
.credit a:hover{color:var(--accent)}

/* ══════════════ wizard ══════════════ */
.wiz{text-align:center;padding:6px 0 2px}
.wiz .wt{font-family:var(--serif);font-size:21px;margin:0 0 4px;letter-spacing:-.01em}
.wiz .ws{font-size:13px;color:var(--ink2);margin:0 0 18px}
.wiz input{
  width:100%;height:50px;text-align:center;font-size:16px;border-radius:13px;
  background:var(--surface);border:1px solid var(--line2);padding:0 14px;
}
.wiz input:focus{outline:none;border-color:var(--accent2);box-shadow:0 0 0 3px var(--accent-bg)}
.exs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.exs[hidden]{display:none}   /* display 지정이 hidden 속성을 덮어쓰지 않도록 */
.ex{font-size:11.5px;padding:5px 10px;border-radius:999px;background:var(--surface2);color:var(--ink2)}
.sugg{margin-top:11px;display:flex;flex-direction:column;gap:6px;text-align:left}
.sg{
  display:flex;flex-direction:column;gap:1px;padding:9px 12px;border-radius:11px;
  background:var(--surface);border:1px solid var(--line);text-align:left;
}
.sg b{font-size:14px;font-weight:600;letter-spacing:-.01em}
.sg span{font-size:11.5px;color:var(--ink3)}
.sg:active{background:var(--accent-bg);border-color:var(--accent-line)}
.sgpick{
  font-size:12px;color:var(--accent);background:var(--accent-bg);border:1px solid var(--accent-line);
  border-radius:10px;padding:8px 11px;text-align:left;
}
.wlog{margin-top:16px;text-align:left;font-size:12.5px}
.hitbox{background:var(--accent-bg);border:1px solid var(--accent-line);border-radius:12px;padding:12px 13px}
.hitbox .t{font-weight:700;color:var(--accent);font-size:12.5px;margin-bottom:6px}
.hitbox ul{margin:0;padding-left:16px;color:var(--ink2)}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line2);
  border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ══════════════ form ══════════════ */
.fg{display:grid;gap:11px;grid-template-columns:1fr 1fr}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.wide{grid-column:1/-1}
.f label{font-size:11px;color:var(--ink3);padding-left:2px;display:flex;align-items:center;gap:5px}
.dpill{font-size:9px;font-style:normal;color:var(--warn);border:1px solid var(--accent-line);
  background:var(--accent-bg);border-radius:4px;padding:0 4px;line-height:15px;letter-spacing:.02em}
.f input,.f select,.f textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:10px 11px;font-size:14px;
}
.f textarea{min-height:62px;resize:vertical;line-height:1.55}
/* 잔량 슬라이더 */
.rng{display:flex;align-items:center;gap:9px}
.rng input[type=range]{flex:1;accent-color:var(--accent);padding:0;background:none;border:none}
.rng output{font-size:12.5px;color:var(--accent);font-weight:700;min-width:38px;text-align:right}
/* 맛 프로필 칩 입력 */
.fchips{padding:2px 0}
.fchips .chip.on{background:var(--accent-bg);border-color:var(--accent-line);color:var(--accent);font-weight:600}
.f input:focus,.f select:focus,.f textarea:focus{
  outline:none;border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-bg)}
.f.drafted input,.f.drafted textarea,.f.drafted select{
  background:var(--accent-bg);box-shadow:inset 2px 0 0 var(--accent2)}
.imgb{display:flex;gap:12px}
.imgb .prev{
  width:88px;flex:none;aspect-ratio:3/4;border-radius:11px;overflow:hidden;position:relative;
  background:var(--shot);border:1px solid var(--line);
}
.imgb .prev.raw img{inset:5px}
.imgb .prev img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.imgb .side{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.mrow{display:flex;gap:5px;flex-wrap:wrap}
.mini{
  font-size:11.5px;padding:6px 10px;border-radius:9px;background:var(--surface);
  border:1px solid var(--line);color:var(--ink2);
  display:inline-flex;align-items:center;gap:5px;
}
.mini.am{color:var(--accent);border-color:var(--accent-line);background:var(--accent-bg)}
.hint{font-size:11px;color:var(--ink3);line-height:1.55;padding-left:1px}
.cands{display:flex;gap:7px;overflow-x:auto;padding:2px;scrollbar-width:none}
.cands::-webkit-scrollbar{display:none}
.cand{
  flex:none;width:58px;aspect-ratio:3/4;border-radius:9px;overflow:hidden;
  background:var(--surface);border:1px solid var(--line);padding:3px;
}
.cand.on{border-color:var(--accent2);box-shadow:0 0 0 2px var(--accent-bg)}
.cand{position:relative}
.cand img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}

/* ══════════════ stats ══════════════ */
.kpis{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px 13px}
.kpi .k{font-size:10px;color:var(--ink3);letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.kpi .v{font-family:var(--serif);font-size:24px;letter-spacing:-.02em;margin-top:3px;line-height:1.15}
.kpi .v u{font-family:var(--sans);font-size:12px;text-decoration:none;color:var(--ink2);margin-left:1px}
.kpi .v.up{color:var(--ok)} .kpi .v.dn{color:var(--danger)}
.kpi .s{font-size:11px;color:var(--ink3);margin-top:3px}
.bars{display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.bar{display:flex;align-items:center;gap:9px}
.bar .nm{width:104px;flex:none;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tr{flex:1;height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.bar .tr i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.bar .n{width:24px;text-align:right;color:var(--ink3);font-size:11.5px;flex:none}

/* ══════════════ misc ══════════════ */
.note{background:var(--accent-bg);border:1px solid var(--accent-line);border-radius:12px;
  padding:11px 13px;font-size:12.5px;color:var(--ink2);line-height:1.6}
.note b{color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:8px}
.stack .btn{flex:none;height:43px}
.darea{
  width:100%;min-height:110px;background:var(--surface);border:1px solid var(--line);
  border-radius:11px;padding:11px;font-size:11.5px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
/* ── 이미지 확대·롤링 ─────────────────────── */
.lightbox{
  position:fixed;inset:0;z-index:80;background:rgba(16,13,10,.94);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s;
  padding:calc(var(--safe-t) + 48px) 12px calc(var(--safe-b) + 56px);
}
.lightbox.on{opacity:1;pointer-events:auto}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;background:#fff}
.lb-x{
  position:absolute;top:calc(var(--safe-t) + 10px);right:12px;width:40px;height:40px;border-radius:12px;
  background:rgba(255,255,255,.14);color:#fff;font-size:17px;display:grid;place-items:center;
}
.lb-nav{
  position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border-radius:12px;
  background:rgba(255,255,255,.12);color:#fff;font-size:30px;line-height:1;display:grid;place-items:center;
}
.lb-prev{left:8px} .lb-next{right:8px}
.lb-nav[hidden]{display:none}
.lb-dots{
  position:absolute;bottom:calc(var(--safe-b) + 18px);left:0;right:0;
  display:flex;gap:7px;justify-content:center;
}
.lb-dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35);display:block}
.lb-dots i.on{background:#fff;transform:scale(1.25)}
/* 상세 화면 사진 묶음 */
.shots{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.shot{
  width:52px;aspect-ratio:3/4;border-radius:9px;overflow:hidden;
  background:var(--shot);border:1px solid var(--line);flex:none;
}
.shot{position:relative}

  font-weight:600;z-index:90;opacity:0;pointer-events:none;transition:.22s;
  box-shadow:var(--sh2);max-width:88vw;text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* ══════════════ 푸터 ══════════════ */
.foot{
  margin-top:34px;padding:20px 0 6px;border-top:1px solid var(--line);

}
.foot small{font-size:10.5px;color:var(--ink3);letter-spacing:.01em;word-break:keep-all}

.flinks{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px}
.flinks a{
  font-size:11.5px;color:var(--ink3);text-decoration:none;
  border-bottom:1px solid var(--line2);padding-bottom:1px;
}
.flinks a:hover{color:var(--accent)}
/* 19세 표기 — 주류를 다루므로 푸터에도 상시 노출한다 */
.agemark{display:inline-flex;align-items:center;gap:6px}
.agemark i{
  font-style:normal;flex:none;width:16px;height:16px;border-radius:50%;
  display:grid;place-items:center;font-size:8.5px;font-weight:700;
  background:var(--surface2);border:1px solid var(--line2);color:var(--ink2);
}
.donate{
  display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 15px;
  border-radius:10px;font-size:12.5px;font-weight:600;letter-spacing:-.01em;
  background:var(--accent-bg);border:1px solid var(--accent-line);color:var(--accent);
  transition:.15s;
}
.donate:active{transform:scale(.96)}
@media(hover:hover){ .donate:hover{background:var(--surface2);border-color:var(--accent)} }
/* QR — 흰 바탕이 필수(다크 테마에서 반전되면 스캐너가 못 읽는다) */
.qrbox{display:flex;flex-direction:column;align-items:center;gap:12px;padding:4px 0 2px}
.qrbox canvas, .qrbox img{
  width:216px;height:216px;image-rendering:pixelated;background:#fff;object-fit:contain;
  padding:12px;border-radius:12px;border:1px solid var(--line);box-shadow:var(--sh1);
}
.qrbox canvas[hidden], .qrbox img[hidden]{display:none}
/* 첫 실행 안내 */
.intro{display:flex;flex-direction:column;gap:12px}
.idots{display:flex;gap:5px;justify-content:center;padding:2px 0 4px}
.idots i{width:6px;height:6px;border-radius:50%;background:var(--line2);transition:.2s}
.idots i.on{background:var(--accent);width:18px;border-radius:3px}
.intro .it{
  font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:-.015em;
  margin:0;line-height:1.32;color:var(--ink);text-align:center;
}
.intro .id{font-size:13.5px;color:var(--ink2);line-height:1.68;margin:0;text-align:center;
  word-break:keep-all}
.intro .id code{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9em;

.intro .ilink{

}

  const hay = [it.name_ko, it.name_en, it.type, it.distillery].filter(Boolean).join(' ');
  if (WHISKY_MARK.test(hay)) return '위스키';
  for (const [re, c] of CAT_RULES) if (re.test(hay)) return c;

  if (/malt|bourbon|rye|irish|whisk|grain|tennessee/i.test(it.type || '')) return '위스키';

function parsePrice(v){
  if (v == null || v === '') return '';
  const s = String(v).replace(/[,\s₩원]/g, '');
  const m = s.match(/^(\d+(?:\.\d+)?)만$/);
  if (m) return Math.round(parseFloat(m[1]) * 10000);
  const n = parseFloat(s.replace(/[^\d.]/g, ''));
  return isNaN(n) ? '' : Math.round(n);
}

  if (!v) return ['',''];

}

  if (n === '' || n == null || isNaN(n)) return '';
  const v = Number(n);
  if (v < 10000) return v.toLocaleString();
  const m = v / 10000;
  /* 100만원 이상은 소수점을 버린다 — 0.5만(5천원)은 시세 추정에서 의미가 없고,

  return (m >= 100 ? String(Math.round(m))
    : m.toFixed(v % 10000 ? 1 : 0).replace(/\.0$/, '')) + '만';
};

async function copy(text){

function normalize(o){
  const it = {id: o.id || uid()};
  KEYS.forEach(k => it[k] = o[k] ?? '');
  EXTRA.forEach(k => it[k] = o[k] ?? '');
  /* image_norm: 크기가 정규화된 대표 썸네일. 구버전 image_data는 여기로 이관 */
  it.image_norm = o.image_norm || '';
  it.image_data = it.image_norm ? '' : (o.image_data ?? '');
  /* images: 최대 5장. 0번이 대표 사진이며 image_norm 과 항상 같게 유지한다 */
  it.images = Array.isArray(o.images) ? o.images.filter(Boolean).slice(0, MAX_SHOTS) : [];
  if (!it.images.length && it.image_norm) it.images = [it.image_norm];
  if (it.images.length) it.image_norm = it.images[0];
  /* 썸네일이 어느 규격으로 저장됐는지 — 없거나 다르면 retrofitThumbs 가 다시 맞춘다.
     KEYS/EXTRA 밖의 필드라 여기서 명시적으로 옮겨야 동기화에서 살아남는다 */
  it.thumb_ar = o.thumb_ar || '';
  it.type ||= 'Single Malt';
  it.cat = CATS.includes(o.cat) ? o.cat
         : (CAT_MIGRATE[o.cat] || guessCat(it));
  /* 기타주류인데 타입이 위스키 계열로 남아 있으면 세부 타입으로 교체 */
  if (it.cat === '기타주류'){
    const st = guessSubtype(it);
    if (st && (!it.type || TYPES.includes(it.type) || it.type === '기타')) it.type = st;
  }
  it.status = STATUS.includes(it.status) ? it.status : '미개봉';
  /* 맛 프로필 — 없으면 캐스크·이름에서 추정 */
  it.flavors = String(o.flavors || '').split(',').map(s => s.trim()).filter(Boolean).join(',')
    || guessFlavors(it);
  it.opened_at = o.opened_at || '';
  it.storage = o.storage || '';
  /* 시음 세션 로그 — [{at, place, mate, score, note}] */
  it.sessions = Array.isArray(o.sessions) ? o.sessions.filter(s => s && s.at) : [];
  /* 오픈 상태면 잔량 기본 100, 비움이면 0 */
  if (it.status === '비움') it.remaining_pct = '0';
  else if (it.status === '오픈' && it.remaining_pct === '') it.remaining_pct = '100';
  it.created_at = o.created_at || nowISO();
  it.updated_at = o.updated_at || it.created_at;
  return it;
}

/** 삭제 기록(툼스톤) — 없으면 다른 기기에서 지운 병이 동기화 때 되살아난다.

function tomb(list){
  DB.meta.tombs ||= {};
  const now = nowISO();
  for (const x of [].concat(list)){
    const id = typeof x === 'string' ? x : x?.id;
    if (!id) continue;
    const upd = (typeof x === 'string' ? '' : x.updated_at) || '';
    DB.meta.tombs[id] = (upd && upd >= now)
      ? new Date(new Date(upd).getTime() + 1000).toISOString()
      : now;
  }
}

   · 토큰은 이 브라우저에만 저장하며 백업 파일에 포함하지 않는다
   ══════════════════════════════════════════ */
let SYNC = {repo:'', path:'collection.json', branch:'main', sha:'', last:'', err:''};
let syncing = false, syncTid = 0, syncDirty = false;

/** 헤더 ⚙️ 위의 상태 점 — 조용한 실패를 눈에 보이게 한다 */
function syncBadge(state){
  const el = $('#syncDot');
  if (el) el.className = 'syncdot' + (state ? ' ' + state : '');
}

function loadSync(){
  try{ Object.assign(SYNC, JSON.parse(localStorage.getItem(LS_SYNC) || '{}')); }catch(e){}
}
function saveSync(){
  try{ localStorage.setItem(LS_SYNC, JSON.stringify(SYNC)); }catch(e){}
}
const ghToken = () => { try{ return localStorage.getItem(LS_TOK) || ''; }catch(e){ return ''; } };
/** HTTP 헤더에는 ASCII 만 넣을 수 있다 — 한글이 섞인 값은 미리 걸러 원시 오류를 막는다 */
const tokenAscii = t => /^[\x21-\x7e]+$/.test(t || '');
const syncOn = () => !!(SYNC.repo && ghToken() && tokenAscii(ghToken()));

/* UTF-8 ↔ base64 (한글이 섞이므로 TextEncoder 경유) */
function b64enc(str){
  const b = new TextEncoder().encode(str);
  let s = '';
  for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode(...b.subarray(i, i + 0x8000));
  return btoa(s);
}
function b64dec(b64){
  const raw = atob(String(b64).replace(/\s/g, ''));
  const u = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) u[i] = raw.charCodeAt(i);
  return new TextDecoder().decode(u);
}
async function gh(path, opt){
  const r = await fetch('https://api.github.com/repos/' + SYNC.repo + '/contents/' + path +
      (opt?.method === 'PUT' ? '' : '?ref=' + encodeURIComponent(SYNC.branch)), {
    method: opt?.method || 'GET',
    headers: {
      Authorization: 'Bearer ' + ghToken(),
      Accept: 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      ...(opt?.body ? {'Content-Type':'application/json'} : {}),
    },
    body: opt?.body,
  });
  if (r.status === 404) return {missing: true};
  const j = await r.json().catch(() => null);
  if (!r.ok) throw new Error((j && j.message) || ('HTTP ' + r.status));
  return j;
}
/** 원격 파일 읽기.
    Contents API 는 1MB 를 넘으면 content 를 비우고 encoding:'none' 을 돌려준다.
    사진이 늘면 바로 이 한계에 걸리므로, 그 경우 raw 미디어타입으로 본문을 다시 받는다. */
async function ghReadFile(path){
  const meta = await gh(path);
  if (meta.missing) return {missing: true};
  const out = {sha: meta.sha, size: meta.size || 0, encoding: meta.encoding || '', text: ''};
  if (meta.encoding === 'base64' && meta.content){
    try{ out.text = b64dec(meta.content); }catch(e){ out.text = ''; }
  }
  if (!out.text && meta.sha){
    /* 1MB 초과 파일은 Blobs API 로 받는다 (최대 100MB).
       contents 엔드포인트에 raw 미디어타입을 요청하면 서버가 무시하고
       JSON 봉투를 돌려주는 경우가 있어, 그것을 파일 내용으로 오인하게 된다. */
    const r = await fetch('https://api.github.com/repos/' + SYNC.repo + '/git/blobs/' + meta.sha, {
      headers: {Authorization: 'Bearer ' + ghToken(), Accept: 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28'},
    });
    if (r.ok){
      const b = await r.json().catch(() => null);
      if (b && b.encoding === 'base64' && b.content){
        try{ out.text = b64dec(b.content); out.via = 'blob'; }catch(e){}
      }
      out.blobEncoding = b?.encoding || '';
    } else out.rawStatus = r.status;
  }
  /* 그래도 API 봉투가 담겨 있으면 한 겹 더 벗긴다 (예전 버전이 잘못 저장한 경우) */
  if (out.text){
    try{
      const j = JSON.parse(out.text);
      if (j && !Array.isArray(j.items) && typeof j.content === 'string' && j.encoding === 'base64'){
        out.text = b64dec(j.content);
        out.via = (out.via ? out.via + '+' : '') + 'unwrap';
      }
    }catch(e){}
  }
  return out;
}
/** 원격/로컬 병합 — 항목은 updated_at 이 최신인 쪽, 삭제는 툼스톤이 최신이면 삭제 유지 */
function mergeSnapshot(remote){
  const tombs = {...(remote.meta?.tombs || {}), ...(DB.meta.tombs || {})};
  for (const [id, t] of Object.entries(remote.meta?.tombs || {}))
    if ((DB.meta.tombs?.[id] || '') > t) tombs[id] = DB.meta.tombs[id];
  const map = new Map();
  for (const it of (remote.items || [])) map.set(it.id, normalize(it));
  let added = 0, updated = 0;
  for (const it of DB.items){
    const r = map.get(it.id);
    if (!r){ map.set(it.id, it); added++; }
    else if ((it.updated_at || '') > (r.updated_at || '')){ map.set(it.id, it); updated++; }
  }
  const items = [...map.values()].filter(it => {
    const t = tombs[it.id];
    return !(t && t > (it.updated_at || ''));
  });
  const before = DB.items.length;
  DB.items = items;
  DB.meta.tombs = tombs;
  return {pulled: Math.max(0, items.length - before + added), local: added + updated};
}
function snapshot(){
  /* 항목 순서를 id 기준으로 고정한다. 기기마다 순서가 달라지면 내용이 같아도
     매번 "달라졌다"고 판단해 커밋이 무한히 쌓인다. */
  const items = [...DB.items].sort((a, b) => String(a.id).localeCompare(String(b.id)));
  return JSON.stringify({
    _app: 'sulsul-diary', _updated: nowISO(),
    items, meta: {tombs: DB.meta.tombs || {}, seeded: DB.meta.seeded},
  }, null, 1);
}
/** sha 충돌인가? GitHub 은 "<경로> does not match <sha>" 로 알려 준다 */
const isShaConflict = m => /does not match|but expected|conflict/i.test(String(m));
const SYNC_TRIES = 3;
/** 원격을 읽어 병합하고, 달라졌으면 다시 올린다.
    sha 충돌은 오류가 아니라 "그 사이 다른 기기가 먼저 올렸다"는 신호다.
    다시 읽어 병합하고 재시도한다 — 실패로 두면 두 기기의 데이터가 영구히 갈라진다. */
async function syncNow(quiet){
  if (!syncOn()) return null;
  if (syncing){ syncDirty = true; return null; }   // 진행 중 변경은 놓치지 않고 다시 돌린다
  syncing = true; syncDirty = false;
  syncBadge('busy');
  try{
    /* 시각 필드만 다른 경우는 올리지 않는다 (pretty-print 공백까지 감안해 제거) */
    const bare = s => String(s).replace(/"_updated":\s*"[^"]*"/, '');
    let res = null, size = 0, retried = 0;
    for (let attempt = 1; ; attempt++){
      const got = await ghReadFile(SYNC.path);
      let remote = {items: [], meta: {}};
      if (got.missing){
        /* 원격에 파일이 없으면 sha 를 보내지 않는다 — 지난 세션에서 저장된
           sha 를 그대로 붙이면 "does not match" 로 거절당한다 */
        SYNC.sha = '';
      } else {
        SYNC.sha = got.sha;
        if (!got.text) throw new Error(`원격 파일을 읽지 못했습니다 (${got.size}바이트, encoding=${got.encoding})`);
        try{ remote = JSON.parse(got.text); }
        catch(e){
          throw new Error(`원격 파일 JSON 파싱 실패 (${got.size}바이트, 경로 ${SYNC.path})`
            + ' — ⚙️ 진단에서 "원격 덮어쓰기"로 복구할 수 있습니다');
        }
        if (!Array.isArray(remote.items))
          throw new Error('원격 파일에 items 배열이 없습니다 — 다른 파일을 가리키고 있는지 확인하세요');
      }
      res = mergeSnapshot(remote);
      save();
      render();
      const body = snapshot();
      size = Math.round(body.length / 1024);
      if (body.length > 5e6 && !quiet && attempt === 1)
        toast('⚠ 데이터가 ' + Math.round(body.length / 1e6) + 'MB입니다 — 사진이 많으면 동기화가 느려집니다');
      if (bare(body) === bare(got.missing ? '' : (got.text || ''))) break;   // 올릴 것이 없다
      try{
        const put = await gh(SYNC.path, {method:'PUT', body: JSON.stringify({
          message: '컬렉션 동기화 (' + DB.items.length + '병)',
          content: b64enc(body), branch: SYNC.branch,
          ...(SYNC.sha ? {sha: SYNC.sha} : {}),
        })});
        SYNC.sha = put.content?.sha || '';
        break;
      }catch(e){
        if (attempt >= SYNC_TRIES || !isShaConflict(e.message || e)) throw e;
        retried = attempt;
        SYNC.sha = '';                                  // 다음 회차의 읽기로 새로 받는다
        await new Promise(r => setTimeout(r, 500 * attempt));
      }
    }
    SYNC.last = nowISO(); SYNC.err = ''; saveSync();
    syncBadge('ok');
    if (!quiet) toast(`동기화 완료 — ${DB.items.length}병`
      + (retried ? ` (다른 기기와 겹쳐 ${retried}회 재시도)` : ''));
    return {ok: true, ...res, size, retried};
  }catch(e){
    const m = String(e.message || e);
    SYNC.err = m.slice(0, 200); saveSync();
    syncBadge('err');
    /* 조용한 동기화라도 실패는 알린다 — 모르는 채로 두면 데이터가 갈라진다 */
    toast('동기화 실패 — ' + (
      m.includes('Bad credentials') ? '토큰이 무효합니다'
      : m.includes('not accessible by personal access token') ? '토큰에 이 저장소 권한이 없습니다'
      : m.includes('Not Found') ? '저장소·브랜치를 확인하세요'
      : isShaConflict(m) ? '다른 기기가 계속 먼저 올리고 있습니다 — 잠시 후 다시 시도하세요'
      : m).slice(0, 60) + ' · ⚙️ 진단을 확인하세요');
    return {ok: false, error: m};
  }finally{
    syncing = false;
    if (syncDirty) setTimeout(() => syncNow(true), 800);
  }
}
/** 저장 후 잠깐 모아서 한 번만 올린다 */
function syncSoon(){
  if (!syncOn()) return;
  syncBadge('busy');
  clearTimeout(syncTid);
  syncTid = setTimeout(() => syncNow(true), 1500);
}
/** 대기 중인 업로드를 지금 실행.
    모바일은 앱을 벗어나면 타이머를 정지시키므로, 화면을 떠날 때 반드시 밀어내야 한다. */
function syncFlush(){
  if (!syncOn()) return;
  if (syncTid){ clearTimeout(syncTid); syncTid = 0; syncNow(true); }
}

/* ══════════════════════════════════════════
   자동 초안 엔진
   ══════════════════════════════════════════ */
/* ══════════════════════════════════════════
   발음 골격(phonetic skeleton) 매칭
   한글과 영문을 같은 자음 클래스 문자열로 바꿔 표기 차이·오타를 흡수한다.
   예) 글렌드로낙 · 글렌드로나크 · Glendronach → 모두 "krntrnk"
   ══════════════════════════════════════════ */
const CHO  = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const JONG = ' ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ';
const JAMO_CLASS = {
  'ㄱ':'k','ㄲ':'k','ㅋ':'k',
  'ㅈ':'c','ㅉ':'c','ㅊ':'c',              // j·z·ch·ts 계열
  'ㄷ':'t','ㄸ':'t','ㅌ':'t','ㅂ':'p','ㅃ':'p','ㅍ':'p',
  'ㅅ':'s','ㅆ':'s','ㄴ':'n','ㅁ':'m','ㄹ':'r','ㅎ':'h','ㅇ':'n',
  'ㄳ':'ks','ㄵ':'nc','ㄶ':'n','ㄺ':'rk','ㄻ':'rm','ㄼ':'rp','ㄽ':'rs',
  'ㄾ':'rt','ㄿ':'rp','ㅀ':'r','ㅄ':'ps',
};
const LAT_CLASS = {g:'k',k:'k',q:'k',c:'k',x:'ks',d:'t',t:'t',
  b:'p',p:'p',f:'p',v:'p',s:'s',n:'n',m:'m',l:'r',r:'r',h:'h'};
/** 문자열 → 자음 클래스 골격 (모음·w·y 무시, 연속 중복 축약) */
function phonKey(s){
  let out = '';
  const t = String(s).toLowerCase()
    // ①은 ㅈ·ㅊ 계열(j·z·ch·ts) 임시 표식 — 뒤의 c→k 치환에 휩쓸리지 않게 한다
    .replace(/ch|ts|tz|sch/g, '1').replace(/[jz]/g, '1')
    .replace(/sh|ss/g, 's').replace(/th/g, 't').replace(/ph/g, 'p')
    .replace(/gh/g, '')                    // High·Highland 등에서 묵음
    .replace(/ck|qu/g, 'k')
    .replace(/c(?=[eiy])/g, 's')           // ce·ci·cy 는 /s/
    .replace(/c/g, 'k');                   // 그 밖의 c 는 경음 /k/ (Cardhu·Cotswolds)
  for (const ch of t){
    const code = ch.charCodeAt(0);
    if (code >= 0xAC00 && code <= 0xD7A3){          // 완성형 한글
      const i = code - 0xAC00;
      const cho = CHO[Math.floor(i / 588)];
      out += (cho === 'ㅇ' ? '' : (JAMO_CLASS[cho] || ''));   // 초성 ㅇ은 음가 없음
      out += (JAMO_CLASS[JONG[i % 28]] || '');
    } else if (ch === '1'){
      out += 'c';
    } else if (ch >= 'a' && ch <= 'z'){
      out += (LAT_CLASS[ch] || '');
    }
  }
  return out.replace(/(.)\1+/g, '$1');
}
/** 한글 표기는 음절 끝 r 과 묵음 h 를 흔히 생략한다 → 그 둘을 지운 보조 키 */
const softKey = k => k.replace(/[rh]/g, '').replace(/(.)\1+/g, '$1');
/** 보조 키가 같아 동점이 나는 경우가 많아, 1차 골격 점수를 타이브레이커로 섞는다 */
function keySim(a, b){
  if (!a || !b) return 0;
  const p = simKey(a, b);
  const s = simKey(softKey(a), softKey(b));
  return Math.max(p, s * 0.94) * 0.95 + p * 0.05;
}
function lev(a, b){
  if (a === b) return 0;
  if (!a.length || !b.length) return Math.max(a.length, b.length);
  let prev = Array.from({length: b.length + 1}, (_, i) => i);
  for (let i = 1; i <= a.length; i++){
    const cur = [i];
    for (let j = 1; j <= b.length; j++)
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i-1] === b[j-1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
}
const simKey = (a, b) => (!a || !b) ? 0 : 1 - lev(a, b) / Math.max(a.length, b.length);

/** 질의에서 숙성/도수/캐스크 표기를 걷어내고, 앞쪽 1~3단어 조합을 후보 키로 만든다 */
function queryKeys(q){
  const cleaned = String(q)
    .replace(/\d+\s*(?:년|yo\b|y\.?o\.?\b|years?\b)/gi, ' ')
    .replace(/캐스크\s*스트렝스|cask\s*strength|\bcs\b/gi, ' ')
    .replace(/\d+(?:\.\d+)?\s*%/g, ' ')
    .replace(/\b(?:single|malt|whisky|whiskey|scotch|bourbon|년|배치|batch)\b/gi, ' ')
    .trim();
  const w = cleaned.split(/\s+/).filter(Boolean);
  const keys = new Set([cleaned.replace(/\s+/g, '')]);
  for (let n = 1; n <= Math.min(3, w.length); n++) keys.add(w.slice(0, n).join(''));
  return [...keys].filter(Boolean);
}
/** 이름 후보들과 질의를 비교 → {s: 점수, exact: 표기가 그대로 일치했는지}
    exact 는 "우연한 발음 유사"와 "명시적 이름 일치"를 가르는 데 쓴다.
    (블루라벨↔Balblair 은 발음이 0.99로 우연히 붙지만 exact 가 아니다) */
function nameScore(nq, qk, names, opts){
  let s = 0, exact = false;
  for (const nm of names){
    if (!nm) continue;
    const nn = squish(nm);
    if (!nn || nn.length < 2) continue;
    if (opts?.skipNumeric && /^\d+$/.test(nn)) continue;   // '12' 같은 숫자는 식별력이 없다
    if (nq.includes(nn)){ s = Math.max(s, 1.1 + Math.min(nn.length, 20) / 100); exact = true; }
    /* 입력 중인 접두 일치. 한글은 한 글자에도 정보량이 많아(맥→맥캘란) 1글자부터 인정 */
    if (nn.startsWith(nq) && (nq.length >= 2 || /[가-힣]/.test(nq))){ s = Math.max(s, 1.0); exact = true; }
    if (nn.includes(nq) && nq.length >= 3){ s = Math.max(s, 0.9); exact = true; }
    const nk = phonKey(nm);
    if (!nk) continue;
    for (const x of qk){
      if (!x.key || x.key.length < 2) continue;
      if (nk === x.key){ s = Math.max(s, 0.99); continue; }
      if (nk.startsWith(x.key) && x.key.length >= 3 && nk.length - x.key.length <= 3)
        s = Math.max(s, 0.92);
      s = Math.max(s, keySim(x.key, nk));
    }
  }
  return {s, exact};
}
const qKeysOf = q => queryKeys(q).map(k => ({key: phonKey(k)}));
/** 증류소 추천 목록 (점수 내림차순) */
function brandCandidates(q, limit = 8){
  const nq = squish(q); if (!nq) return [];
  const qk = qKeysOf(q), out = [];
  for (const b of BRANDS){
    const r = nameScore(nq, qk, [b.ko, b.en, ...(b.alias || [])]);
    if (r.s >= 0.62) out.push({b, s: r.s, exact: r.exact});
  }
  return out
    .sort((x, y) => y.s - x.s || (y.b.pri || 0) - (x.b.pri || 0) || x.b.en.length - y.b.en.length)
    .slice(0, limit);
}
/** 제품명에서 증류소명을 뗀 "표현명" (Ardbeg Uigeadail → Uigeadail) */
function exprOf(p, b){
  return String(p.name_en)
    .replace(new RegExp('^(the\\s+)?' + String(b.en).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i'), '')
    .replace(/\(.*?\)/g, ' ').replace(/\s+/g, ' ').trim();
}
/** 표현명(제품) 추천 목록 — 증류소를 말하지 않고 "아부나흐"만 부르는 경우를 잡는다 */
function productCandidates(q, limit = 8){
  const nq = squish(q); if (!nq) return [];
  const qk = qKeysOf(q), out = [];
  for (const p of PRODUCTS){
    const b = BRAND_BY_KEY[p.b]; if (!b) continue;
    const r = nameScore(nq, qk, [p.name_en, exprOf(p, b), ...(p.m || [])], {skipNumeric: true});
    if (r.s >= 0.82) out.push({p, b, s: r.s, exact: r.exact});
  }
  return out.sort((x, y) => y.s - x.s || x.p.name_en.length - y.p.name_en.length).slice(0, limit);
}
function matchBrand(q){
  const c = brandCandidates(q, 1);
  return (c.length && c[0].s >= 0.78) ? c[0].b : null;
}
/** 표현명에 흔히 붙는 표기에서 캐스크·도수·주의사항을 읽어낸다.

function expressionHints(q){
  const out = {cask:'', abv:'', notes:[], labels:[]};
  for (const r of EXPR_RULES){
    if (!r.re.test(q)) continue;
    out.labels.push(r.label);
    if (r.cask && !out.cask) out.cask = r.cask;
    if (r.abv && !out.abv) out.abv = r.abv;
    if (r.note) out.notes.push(r.note);
  }
  return out;
}
/** 질의 하나로 증류소·제품을 함께 판정. 표기 일치(exact)가 발음 유사보다 우선한다. */
function resolve(q){
  const bc = brandCandidates(q, 1)[0] || null;
  const pcs = productCandidates(q, 3);
  const pc = pcs[0] || null;
  let brand = (bc && bc.s >= 0.78) ? bc.b : null;
  let product = null, ambiguous = null;
  if (pc && (pc.exact || pc.s >= 0.93)){
    /* 제품의 증류소도 질의에 명시돼 있으면(스타워드 라가불린캐스크) 제품을 믿는다.
       그렇지 않고 다른 증류소만 명시됐다면 증류소를 믿는다. */
    const nq2 = squish(q), qk2 = qKeysOf(q);
    const pcBrandNamed = nameScore(nq2, qk2,
      [pc.b.ko, pc.b.en, ...(pc.b.alias || [])]).exact;
    const conflict = bc?.exact && pc.b.k !== bc.b.k && !pcBrandNamed;
    /* 다른 증류소 제품이 '완전 동점'일 때만 자동 확정을 피한다(스몰배치 등).
       점수 차 0.02 는 더 구체적인 별칭이 일치했다는 뜻이므로 동점이 아니다. */
    const tie = pcs[1] && pcs[1].exact && pcs[1].b.k !== pc.b.k && (pc.s - pcs[1].s) <= 0.001;
    if (!conflict && !tie){ brand = pc.b; product = pc.p; }
    else if (!conflict) ambiguous = pcs.slice(0, 3);
  }
  return {brand, product, ambiguous};
}
function parseAge(s){
  let m = String(s).match(/(\d{1,2})\s*(?:년|yo\b|y\.?o\.?\b|years?\b|y\b)/i);
  if (m) return m[1];
  m = String(s).match(/(?:^|\s)(\d{1,2})(?:\s|$)/);
  return (m && +m[1] >= 3 && +m[1] <= 40) ? m[1] : '';
}
function matchBottler(q){
  const n = squish(q);
  for (const b of BOTTLERS)
    for (const a of [b.ko, b.en, ...(b.alias || [])])
      if (a && n.includes(squish(a))) return b;
  return null;
}
function matchProduct(bk, q, age){
  const n = squish(q); let best = null;
  for (const p of PRODUCTS){
    if (p.b !== bk) continue;
    let s = 0;
    for (const t of (p.m || [])){
      const tn = squish(t);
      if (!tn) continue;
      if (/^\d+$/.test(tn)){
        // 숙성 연수(12년)로 쓰이거나, 제품명 숫자(101·105)로 쓰이는 두 경우를 모두 인정
        if (age && age === tn) s += 12;
        else if (new RegExp('(?:^|\\D)' + tn + '(?:\\D|$)').test(n)) s += 8;
      }
      else if (n.includes(tn)) s += 7;
    }
    if (age && String(p.age) === age) s += 5;
    if (s > 0 && (!best || s > best.s)) best = {p, s};
  }
  return best && best.s >= 7 ? best.p : null;
}
/** 이름 문자열 → 초안 { fields, keys(자동채움 키), brand, product, lines(요약) } */
function draftFrom(raw){
  const q = String(raw).trim();
  const F = {}, keys = new Set(), lines = [];
  const put = (k, v) => { if (v !== '' && v != null && !F[k]){ F[k] = String(v); keys.add(k); } };

  F.name_ko = q; F.status = '미개봉'; F.size_ml = '700'; F.remaining_pct = '100';
  F.purchase_date = today(); F.bottler = 'Official (OB)';

  const rs = resolve(q);
  const brand = rs.brand;
  const age = parseAge(q);
  const abvIn = (q.match(/(\d{2}(?:\.\d)?)\s*%/) || [])[1];
  const ib = matchBottler(q);
  const isCS = /cs$|cs\s|캐스크스트렝스|caskstrength/.test(squish(q) + ' ');
  if (ib){ F.bottler = ib.en; keys.add('bottler'); }
  if (!brand){
    if (age) put('age', age);
    if (abvIn) put('abv', abvIn);
    /* 표기에서 읽어낸 정보라도 채워 준다 (배럴프루프·셰리 피니시 등) */
    const hint = expressionHints(q);
    if (hint.cask) put('cask', hint.cask);
    if (hint.abv) put('abv', hint.abv);
    if (hint.notes.length){ F.notes = hint.notes.join('\n'); keys.add('notes'); }
    const lines = rs.ambiguous
      ? ['이 표현명은 여러 증류소에 있습니다 — 어느 것인지 골라 주세요:',
         ...rs.ambiguous.map(x => `<b>${esc(x.b.ko || x.b.en)} ${esc(exprOf(x.p, x.b))}</b> · ${esc(x.p.abv)}%`),
         '이름 칸에 증류소를 함께 적으면 바로 채워집니다 (예: 포로지스 스몰배치).']
      : ['내장 DB에서 증류소를 찾지 못했습니다.',
         '<b>영문명으로 다시 시도</b>하면 정확도가 올라갑니다 (예: <b>Longmorn 23</b>).',
         '또는 아래 항목을 직접 입력하고 <b>사진 다시 찾기</b>를 눌러 주세요.'];
    if (hint.labels.length)
      lines.push('표기에서 읽어낸 정보: <b>' + hint.labels.map(esc).join(' · ') + '</b>');
    return {fields:F, keys, brand:null, product:null, lines};
  }

  put('distillery', brand.en);
  put('country', brand.country);
  put('region', brand.region === 'Blend' ? '' : brand.region);
  put('type', brand.type || 'Single Malt');
  lines.push(`증류소 <b>${esc(brand.en)}</b> · ${esc(brand.country)}${brand.region !== 'Blend' ? ' / ' + esc(brand.region) : ''} · ${esc(brand.type || 'Single Malt')}`);

  /* 증류소가 정해진 뒤의 매칭이 숙성 연수를 함께 보므로 이쪽을 우선한다.
     (노마드 10년 → 표현명 색인은 '노마드'만 보고 NAS 제품을 고르기 때문) */
  const p = matchProduct(brand.k, q, age) || rs.product;
  if (rs.ambiguous)
    lines.push('표현명이 여러 증류소와 겹칩니다 — 추천 목록에서 정확한 제품을 골라 주세요: '
      + rs.ambiguous.map(x => `<b>${esc(x.b.ko || x.b.en)} ${esc(exprOf(x.p, x.b))}</b>`).join(' / '));
  if (p){
    put('name_en', p.name_en);
    put('age', p.age);
    put('abv', p.abv);
    put('cask', p.cask || brand.cask);
    if (p.type) F.type = p.type;
    put('nose', p.nose || brand.house?.nose);
    put('taste', p.taste || brand.house?.taste);
    put('finish', p.finish || brand.house?.finish);
    if (p.wb) put('rating_wb', '≈' + p.wb + ' (참고)');
    if (p.bible) put('rating_bible', p.bible);
    if (p.lo) put('market_low', p.lo);
    if (p.hi) put('market_high', p.hi);
    if (p.note) put('notes', p.note);
    lines.push(`제품 <b>${esc(p.name_en)}</b> 매칭 — 도수 ${esc(p.abv)}% · ${p.age === 'NAS' ? '숙성 미표기' : esc(p.age) + '년'}`);
    lines.push('캐스크 · 테이스팅 노트 3종' + (p.wb ? ' · 참고 평점' : '') + (p.lo ? ' · 추정 시장가' : '') + ' 채움');
  } else {
    if (age) put('age', age);
    /* 표현명 자체가 정보를 담고 있다 — "배럴프루프"면 캐스크 스트렝스, "셰리 피니시"면 캐스크가 정해진다 */
    const hint = expressionHints(q);
    put('cask', hint.cask || brand.cask);
    if (hint.abv) put('abv', hint.abv);
    const h = brand.house || REGION_STYLE[brand.region] || REGION_STYLE.default;
    put('nose', h.nose); put('taste', h.taste); put('finish', h.finish);
    if (hint.notes.length){
      F.notes = [F.notes, ...hint.notes].filter(Boolean).join('\n'); keys.add('notes');
    }
    lines.push('개별 제품이 DB에 없어 <b>증류소 하우스 스타일</b>로 테이스팅 노트 초안을 채웠습니다.');
    if (hint.labels.length)
      lines.push('표기에서 읽어낸 정보: <b>' + hint.labels.map(esc).join(' · ') + '</b>');
    lines.push('도수 · 캐스크 · 시장가는 실제 라벨을 확인해 수정해 주세요.');
  }
  if (abvIn) { F.abv = abvIn; keys.add('abv'); }
  if (!F.name_en && brand) put('name_en', brand.en + (age ? ' ' + age + ' Year Old' : ''));
  if (ib){
    F.notes = ['⚠ 독립 병입(IB) 제품 — 캐스크·도수·숙성은 병마다 달라 라벨 확인이 필요합니다.',
      F.notes].filter(Boolean).join('\n');
    keys.add('notes');
    lines.push(`독립 병입자 <b>${esc(ib.en)}</b> 감지 — 보틀러를 채웠습니다.`);
  }
  if (isCS && !abvIn){
    F.notes = [F.notes, '⚠ 캐스크 스트렝스 — 도수는 배치/병별로 다릅니다. 라벨 확인 후 수정하세요.']
      .filter(Boolean).join('\n');
    keys.add('notes');
  }
  return {fields:F, keys, brand, product:p, lines};
}

/* ── Wikipedia / Commons 보강 ─────────────── */
function jget(url, ms = 7000){
  const c = new AbortController(); const t = setTimeout(() => c.abort(), ms);
  return fetch(url, {signal:c.signal, referrerPolicy:'origin-when-cross-origin'})
    .then(r => r.ok ? r.json() : null).catch(() => null).finally(() => clearTimeout(t));
}
async function commonsImages(q, limit = 8){
  const u = 'https://commons.wikimedia.org/w/api.php?format=json&origin=*&action=query'
    + '&generator=search&gsrnamespace=6&gsrlimit=' + limit
    + '&prop=imageinfo&iiprop=url|size&iiurlwidth=420&gsrsearch=' + encodeURIComponent(q);
  const j = await jget(u);
  return Object.values(j?.query?.pages || {})
    .filter(p => p.imageinfo?.[0]?.thumburl && /\.(jpe?g|png|webp)$/i.test(p.title))
    .map(p => ({
      title: p.title.replace(/^File:/, ''),
      url: p.imageinfo[0].thumburl,
      ar: p.imageinfo[0].width ? p.imageinfo[0].height / p.imageinfo[0].width : 1,
    }));
}
async function wikiSummary(title){
  const j = await jget('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title));
  if (!j || j.type === 'https://mediawiki.org/wiki/HyperSwitch/errors/not_found') return null;
  return {title: j.title, extract: j.extract, url: j.content_urls?.desktop?.page, thumb: j.thumbnail?.source};
}
/* 커먼즈 검색은 단어를 AND로 묶어, 제품 풀네임으로는 결과가 0건이 된다.
   → 브랜드 중심 질의를 좁은 것부터 넓은 것 순으로 시도하고 결과에 순위를 매긴다. */
const IMG_BAD = /distiller|brennerei|warehouse|panoramio|geograph|\bbay\b|\bpoint\b|conservation|park|ring|market|mall|castle|highway|barrel|exi?bition|tasting|products|various|whiskies|collection|shelf|verpackung|packaging|carton|label|leer|empty|glass|\bbar\b|logo|sign/i;
function rankCands(list, brandEn, age){
  const bt = squish(brandEn);
  return list.map(x => {
    let s = 0;
    if (bt && squish(x.title).includes(bt)) s += 4;
    if (/bottle|flasche|voll/i.test(x.title)) s += 3;
    if (age && new RegExp('(?:^|\\D)' + age + '(?:\\D|$)').test(x.title)) s += 3;
    if (IMG_BAD.test(x.title)) s -= 5;
    /* 세로로 긴 사진은 병 사진일 확률이 높고, 가로로 넓으면 건물·풍경일 확률이 높다 */
    if (x.ar >= 1.25) s += 4; else if (x.ar && x.ar <= 0.78) s -= 3;
    return {...x, s};
  }).sort((a, b) => b.s - a.s);
}
async function enrich(d){
  const out = {images: [], wiki: null};
  if (!navigator.onLine) return out;
  const b = d.brand;
  const age = d.fields.age && d.fields.age !== 'NAS' ? d.fields.age : '';
  /* "Port Charlotte (Bruichladdich)" 같은 괄호 표기는 검색에 방해가 된다 */
  const core = String(b?.en || d.fields.distillery || '').replace(/\(.*?\)/g, '').trim();
  const toks = core.toLowerCase().replace(/[^a-z0-9 ]/g, ' ').split(/\s+/)
    .filter(w => w.length >= 4 && !['the','distillery','whisky','single','malt','reserve'].includes(w));
  const wikiP = b?.wiki ? wikiSummary(b.wiki) : Promise.resolve(null);
  /* 표현명(Uigeadail·Quarter Cask 등)이 있으면 그 병 사진을 먼저 찾는다 */
  const expr = (d.product && b) ? exprOf(d.product, b).replace(/\d+\s*year old/i, '').trim() : '';
  const queries = core
    ? [expr ? `${core} ${expr}` : null,
       `${core} whisky bottle`, `${core} bottle`,
       age ? `${core} ${age} whisky` : null, `${core} whisky`].filter(Boolean)
    : [(d.fields.name_en || d.fields.name_ko || '') + ' whisky bottle'];
  const seen = new Set(); const all = [];
  for (const q of queries){
    for (const x of await commonsImages(q, 8))
      if (!seen.has(x.url)){ seen.add(x.url); all.push(x); }
    if (all.filter(x => !IMG_BAD.test(x.title)).length >= 6) break;
  }
  out.wiki = await wikiP;
  const ranked = rankCands(all, core, age);
  /* 브랜드명이 파일명에 없는 후보는 엉뚱한 사진(다른 술·풍경)일 가능성이 높다 */
  const strict = toks.length
    ? ranked.filter(x => toks.some(t => x.title.toLowerCase().includes(t)))
    : ranked;
  out.images = strict.slice(0, 8);
  if (!out.images.length && out.wiki?.thumb)
    out.images = [{title: out.wiki.title + ' (증류소 사진)', url: out.wiki.thumb, s:0, ar:1}];
  return out;
}

function visible(){
  const q = V.q.trim().toLowerCase();

    else if (V.status === '__owned'){ if (!OWNED.includes(it.status)) return false; }
    else if (V.status !== 'all' && it.status !== V.status) return false;
    if (!band[2](ageNum(it))) return false;
    if (V.flavor !== 'all' && !String(it.flavors || '').split(',').includes(V.flavor)) return false;
    if (!q) return true;
    return ['name_ko','name_en','distillery','cask','region','country','tags','type','notes']
      .some(k => String(it[k] ?? '').toLowerCase().includes(q));
  });
  const S = {
    recent: (x, y) => (y.created_at || '').localeCompare(x.created_at || ''),
    bought: (x, y) => (y.purchase_date || '').localeCompare(x.purchase_date || ''),
    name:   (x, y) => fullName(x).localeCompare(fullName(y), 'ko'),
    score:  (x, y) => bestScore(y) - bestScore(x),
    price:  (x, y) => marketMid(y) - marketMid(x),
    abv:    (x, y) => (Number(y.abv) || 0) - (Number(x.abv) || 0),
    left:   (x, y) => (Number(x.remaining_pct) || 0) - (Number(y.remaining_pct) || 0),
    opened: (x, y) => (y.opened_at || '').localeCompare(x.opened_at || ''),
  };
  return a.sort(S[V.sort] || S.recent);
}

/* ── render list ──────────────────────────── */
function render(){
  const items = visible();
  $('#hdCnt').textContent = DB.items.length ? DB.items.length + '병' : '';

  /* 주종 세그먼트 — 데이터가 1건 이상인 주종만, CATS 정의 순서로 */
  const catCount = {};
  DB.items.forEach(i => { catCount[i.cat] = (catCount[i.cat] || 0) + 1; });
  const cats = CATS.filter(c => catCount[c]);
  const segHTML = c =>
    `<button class="seg${V.cat === c ? ' on' : ''}" data-cat="${esc(c)}">${
      c === 'all' ? '전체' : esc(c)}<b>${c === 'all' ? DB.items.length : catCount[c]}</b></button>`;
  $('#catSegs').innerHTML = cats.length > 1 ? [...cats, 'all'].map(segHTML).join('') : '';
  /* 사이드바(데스크톱)는 주종이 하나뿐일 때도 '전체'를 보여 준다 — 화면이
     비어 보이지 않도록, 그리고 병 수를 항상 읽을 수 있도록 */
  $('#sideCats').innerHTML = '<div class="navsec">주종</div>'

  /* 선택된 주종이 사라졌으면 전체로 되돌린다 */
  if (V.cat !== 'all' && !catCount[V.cat]) V.cat = 'all';
  /* 타입 칩 — 선택된 주종 안에서만 집계한다 */

  $('#typeChips').innerHTML = used.length > 1

        t === 'all' ? '전체' : esc(t)}<b>${t === 'all' ? inCat.length : inCat.filter(i => i.type === t).length}</b></button>`).join('')
    : '';

  /* 적용된 필터 개수를 버튼 배지로, 각 필터를 지울 수 있는 칩으로 보여준다 */
  const act = [];
  if (V.status !== 'all') act.push(['status', (STATUS_OPTS.find(o => o[0] === V.status) || [, V.status])[1]]);
  if (V.age !== 'all')    act.push(['age', (AGE_BANDS.find(b => b[0] === V.age) || [, V.age])[1]]);
  if (V.flavor !== 'all') act.push(['flavor', V.flavor]);
  $('#fCount').textContent = act.length || '';
  $('#btnFilter').classList.toggle('on', act.length > 0);
  $('#activeChips').innerHTML = act.map(([k, t]) =>
    `<button class="chip" data-clr="${k}">${esc(t)}<i>✕</i></button>`).join('');
  $('#statLine').textContent = (V.q.trim() || act.length) ? items.length + '병' : '';

  /* 사이드바 하단 요약 — 데스크톱에서만 보이지만 계산은 가벼우니 항상 갱신한다 */
  const opened = DB.items.filter(i => i.status === '오픈').length;
  const sealed = DB.items.filter(i => i.status === '미개봉').length;
  const spent = DB.items.reduce((s, i) => s + (Number(i.purchase_price) || 0), 0);
  $('#sideStats').innerHTML =
      `<span class="sk">보유 <b>${DB.items.length}</b></span>`
    + `<span class="sk">미개봉 <b>${sealed}</b></span>`
    + `<span class="sk">오픈 <b>${opened}</b></span>`
    + (spent ? `<span class="sk">구매 합계 <b>${Math.round(spent / 10000)}만</b></span>` : '');
  $('#btnView').textContent = V.view === 'grid' ? '☰' : '▦';
  $('#btnView').title = V.view === 'grid' ? '리스트로 보기' : '그리드로 보기';

  $('#grid').className = V.view === 'list' ? 'listv' : 'grid';
  $('#grid').innerHTML = items.map(V.view === 'list' ? rowHTML : cardHTML).join('');
  /* 결과가 없을 때 "다른 걸 시도해 보세요"는 도움이 안 된다 —
     지금 무엇이 걸러내고 있는지 보여 주고 한 번에 풀 수 있게 한다 */
  const narrowing = [];
  if (V.q.trim())         narrowing.push(`검색어 "${esc(V.q.trim())}"`);
  if (V.cat !== 'all')    narrowing.push(`주종 ${esc(V.cat)}`);
  if (V.type !== 'all')   narrowing.push(`타입 ${esc(V.type)}`);
  act.forEach(([, t]) => narrowing.push(esc(t)));
  $('#emptyBox').innerHTML = items.length ? '' : (DB.items.length
    ? `<div class="empty"><h3>조건에 맞는 병이 없습니다</h3>
       <p>${DB.items.length}병 중 ${narrowing.length ? '아래 조건으로' : ''} 걸러낸 결과가 0건입니다.</p>
       ${narrowing.length ? `<div class="chips ecs">${
         narrowing.map(t => `<span class="chip">${t}</span>`).join('')}</div>
       <button class="btn gold ebtn" data-clrall="1">조건 모두 해제</button>` : ''}</div>`
    : `<div class="empty"><h3>첫 병을 등록해 보세요</h3>
       <p>우측 상단 <b>＋ 추가</b>에 이름만 입력하면<br>사양·테이스팅 노트 초안이 자동으로 채워집니다.</p></div>`);
}
/* 주종별 플레이스홀더 색조 — [배경 시작, 배경 끝, 유리·글자 색]
   테마에 따라 다른 세트를 쓴다 (라이트는 밝은 진열장, 다크는 캐비닛 조명) */
/* 라이트의 유리 색은 채도를 낮춰 둔다 — 원색에 가까우면 흰 배경 위에서
   유리가 아니라 사탕처럼 보였다 (다크는 어두운 판에 얹혀 그럴 일이 없다) */
const PH_LIGHT = {
  '위스키': ['#f5f0e6','#e8dfcd','#a9853f'],
  '리큐르': ['#f8f1f2','#eee3e6','#b28d95'],
  '기타주류': ['#f0f3f4','#e2e8ea','#8399a1'],
  '와인': ['#f5eff2','#e8dde3','#a1808d'],
};
const PH_DARK = {
  '위스키': ['#262229','#17171A','#C58B43'],
  '리큐르': ['#2A2126','#1A171A','#D9A2B0'],
  '기타주류': ['#1E2428','#15181A','#7FA6B4'],
  '와인': ['#2A1F26','#181418','#C08098'],
};
const phTone = it => {
  const set = document.documentElement.dataset.theme === 'dark' ? PH_DARK : PH_LIGHT;
  return set[it.cat] || set['위스키'];
};
/** 앰버 글래스 병 실루엣 — id 충돌을 피하려고 매번 고유 접미사를 붙인다 */
let phSeq = 0;
function bottleSVG(t){
  const u = 'p' + (++phSeq);
  return `<svg viewBox="0 0 120 190" aria-hidden="true">
    <defs>
      <linearGradient id="g${u}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="${t}" stop-opacity=".46"/>
        <stop offset=".45" stop-color="${t}" stop-opacity=".18"/>
        <stop offset="1" stop-color="${t}" stop-opacity=".40"/></linearGradient>
      <linearGradient id="l${u}" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="${t}" stop-opacity=".62"/>
        <stop offset="1" stop-color="${t}" stop-opacity="0"/></linearGradient>
    </defs>
    <path d="M48 8h24v34c0 7 22 14 22 40v88a12 12 0 0 1-12 12H38a12 12 0 0 1-12-12V82c0-26 22-33 22-40V8z"
      fill="url(#g${u})" stroke="${t}" stroke-opacity=".34" stroke-width="1.2"/>
    <path d="M28 118h64v50a10 10 0 0 1-10 10H38a10 10 0 0 1-10-10z" fill="url(#l${u})"/>
    <rect x="40" y="96" width="40" height="26" rx="3" fill="${t}" fill-opacity=".12"
      stroke="${t}" stroke-opacity=".26" stroke-width="1"/>
    <path d="M40 20h10v150" stroke="#fff" stroke-opacity=".14" stroke-width="2" fill="none"/>
  </svg>`;
}
/** small: 리스트용 축약 · hide: 사진 로드 실패 시에만 보이는 대체 블록 */
function phHTML(it, small, hide){
  const [a, b, t] = phTone(it);
  return `<div class="ph" style="${hide ? 'display:none;' : ''}--phA:${a};--phB:${b};--phT:${t}">`
    + `${bottleSVG(t)}<span>${esc(initials(it))}</span>`
    + `${small ? '' : '<small>이미지 없음</small>'}</div>`;
}
/** 오픈한 병의 잔량 (0~100) — 표시 대상이 아니면 null */
const levelOf = it => (it.status === '오픈' && it.remaining_pct !== '' && !isNaN(it.remaining_pct))
  ? Math.max(0, Math.min(100, Number(it.remaining_pct))) : null;
/** 카드 4번째 줄의 잔량 바 값. 상태에서 곧바로 정해지므로 어떤 병이든 값이 있다:
    미개봉 100 / 비움 0 / 오픈은 기록된 잔량(미기록이면 100).
    경험·위시는 보유 중이 아니라서 null — 빈 트랙으로 그려 줄 높이만 지킨다.
    levelOf 는 정렬·리스트가 함께 쓰므로 의미를 바꾸지 않고 따로 둔다. */
const barOf = it =>
    it.status === '미개봉' ? 100
  : it.status === '비움'   ? 0
  : it.status === '오픈'   ? (levelOf(it) === null ? 100 : levelOf(it))
  : null;

function badges(it, sc){
  return `${sc ? `<span class="sc">${sc}</span>` : ''}`
    + `${it.status === '경험' ? `<span class="trd">경험</span>` : ''}`
    + `${it.status === '위시' ? `<span class="trd">위시</span>` : ''}`
    + `${it.draft === '1' ? `<span class="dr">초안</span>` : ''}`;
}
/** 카드용 표식(경험·위시·초안) — 사진 좌상단에 얹는다.
    3번째 줄에 함께 두면 360px 기기에서 폭이 모자라 도수가 잘렸다:
    평점 4자 + 칩 + 도수 5자 + 가격 5자 = 132px 를 넘는다(실측). 평점·도수·가격은
    비교하며 읽는 값이라 줄에 남기고, 상태 표식만 여백이 있는 사진 위로 옮겼다. */
function cardMarks(it){
  const m = (it.status === '경험' ? '<span class="trd">경험</span>' : '')
    + (it.status === '위시' ? '<span class="trd">위시</span>' : '')
    + (it.draft === '1' ? '<span class="dr">초안</span>' : '');
  return m ? `<span class="cmark">${m}</span>` : '';
}
function cardHTML(it){
  const src = imgOf(it);
  const sc = bestScore(it), price = marketMid(it);
  /* 카드는 늘 네 줄이다 — 1) 타입·년산  2) 이름  3) 평점·기타·도수·가격
     4) 잔량 바. 어느 줄도 조건부로 사라지지 않아야 카드끼리 줄이 맞는다.
     3줄에 네 값이 다 들어가므로 폭이 빡빡하다: 넘칠 때는 도수부터 줄어들게
     .cfoot 안의 우선순위를 flex-shrink 로 잡아 뒀다(가격·평점은 고정). */
  const sub = [it.type, it.age && it.age !== 'NAS' ? it.age + 'Y' : ''].filter(Boolean).join(' · ');
  const bar = barOf(it);
  return `<button class="card" data-open="${it.id}">
    <div class="thumb${isRaw(it) ? ' raw' : ''}">
      ${src
        ? `<img src="${esc(src)}" alt="" loading="lazy" decoding="async"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
           ${phHTML(it, false, true)}`
        : phHTML(it)}
      <span class="cflags">
        <span class="fl" title="${esc(it.status)}" aria-label="${esc(it.status)}"
          ><span class="dot ${statusCls(it.status)}"></span></span>
        <span class="fl adult" title="19세 이상 이용" aria-label="19세 이상 이용">19</span>
      </span>
      ${cardMarks(it)}
    </div>
    <div class="cbody">
      <div class="ctype">${esc(sub)}</div>
      <h3>${esc(fullName(it))}</h3>
      <div class="cfoot">
        <span class="cbg">${sc ? `<span class="sc">${sc}</span>` : ''}</span>
        <span class="abv">${it.abv ? esc(it.abv) + '%' : ''}</span>
        <span class="pr">${price ? wonShort(price) : ''}</span>
      </div>
      <div class="lvlrow" title="${bar === null ? '보유 중이 아님' : '잔량 ' + bar + '%'}">
        <span class="lvl${bar === null ? ' na' : ''}"><i style="width:${bar === null ? 0 : bar}%"></i></span>
        <span class="lvlx">${bar === null ? '—' : bar + '%'}</span>
      </div>
    </div>
  </button>`;
}
/** 리스트 뷰 한 줄 — 133병을 훑을 때 그리드보다 빠르다 */
function rowHTML(it){
  const src = imgOf(it);
  const sc = bestScore(it), price = marketMid(it), lv = levelOf(it);
  const sub = [it.distillery || it.type, it.age && it.age !== 'NAS' ? it.age + '년' : '',
    it.abv ? it.abv + '%' : '', it.flavors].filter(Boolean).join(' · ');
  return `<button class="rowi" data-open="${it.id}">
    <span class="th">${src
      ? `<img src="${esc(src)}" alt="" loading="lazy" decoding="async"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
         ${phHTML(it, true, true)}`
      : phHTML(it, true)}</span>
    <span class="mid">
      <span class="nm">${esc(fullName(it))}</span>
      <span class="sub">${esc(sub)}</span>
      ${lv !== null ? `<span class="lvl" style="margin-top:4px"><i style="width:${lv}%"></i></span>` : ''}
    </span>
    <span class="rt">
      ${badges(it, sc)}
      ${price ? `<span class="pr">${wonShort(price)}</span>` : ''}
      ${lv !== null ? `<span class="lvlx">${lv}%</span>` : ''}
    </span>
  </button>`;
}

/* ══════════════════════════════════════════
   안드로이드 뒤로가기 처리
   ① 시트가 열려 있으면 시트만 닫는다
   ② 목록에서 누르면 "한 번 더 누르면 종료" 안내 후, 2초 안에 다시 누를 때만 나간다
   ══════════════════════════════════════════ */
let backArmed = false, backTid = 0;
function pushGuard(kind){
  try{ history.pushState({wc: kind}, ''); }catch(e){}
}
window.addEventListener('popstate', () => {
  if ($('#lightbox')?.classList.contains('on')){ closeLightbox(); pushGuard('root'); return; }
  if ($('#sheet').classList.contains('on')){ closeSheet(true); pushGuard('root'); return; }
  if (backArmed){ backArmed = false; history.back(); return; }   // 두 번째 → 실제로 나감
  backArmed = true;
  toast('뒤로가기를 한 번 더 누르면 앱이 닫힙니다');
  clearTimeout(backTid);
  backTid = setTimeout(() => { backArmed = false; }, 2000);
  pushGuard('root');
});

/* 후원 정보 — 바꿀 일이 생기면 이 한 곳만 고치면 된다.
   QR 과 '링크 열기' 는 목적이 다르므로 값을 분리해 둔다:
   QR 은 계좌이체(송금)로, 링크 열기는 소개 페이지로 간다. 둘을 같은 값으로
   두면 QR 을 찍어도 버튼과 똑같은 곳으로 가서 QR 이 있을 이유가 없어진다. */
const DONATE = {
  /* '링크 열기' 전용 — 후원 안내 블로그 글 */
  page: 'https://blog.naver.com/ysparkbc37/224365856849',
  /* QR 로 만들 송금 링크(토스·카카오페이 등). 비어 있으면 아래 이미지를 쓴다 */
  transfer: '',
  /* 직접 만든 QR 이미지 경로. 저장할 때 확장자가 달라도 되도록 후보를 순서대로
     시도한다 — 하나라도 로드되면 그것을 쓰고, 전부 없으면 QR 영역을 숨긴다 */
  image: ['./donate-qr.png', './donate-qr.jpg', './donate-qr.jpeg', './donate-qr.webp'],
  /* 계좌를 글자로도 보여 준다 — QR 을 못 쓰는 상황의 대비책 */
  bank: '', account: '', holder: '',
};
/** 후원 시트. QR 은 그 자리에서 생성한다 — 외부 QR API 는 오프라인에서 빈칸이 된다 */
function openDonate(){
  const acct = DONATE.bank && DONATE.account
    ? `${DONATE.bank} ${DONATE.account}${DONATE.holder ? ' · ' + DONATE.holder : ''}` : '';
  openSheet('술술다이어리 후원', `
    <div class="qrbox">
      <canvas id="qrCv" hidden role="img" aria-label="계좌이체 QR 코드"></canvas>
      <img id="qrImg" hidden alt="계좌이체 QR 코드">
      <p class="qcap">코바의 술술다이어리 후원<br>
        <span id="qrHow" style="color:var(--ink3);font-size:11px"></span></p>
      ${acct ? `<p class="qacct" id="qrAcct">${esc(acct)}</p>
        <button class="mini" id="acctCopy">계좌번호 복사</button>` : ''}
    </div>`,
    `<button class="btn" id="qrCopy">링크 복사</button>
     <button class="btn gold" id="qrOpen">링크 열기</button>`);
  const cv = $('#qrCv'), img = $('#qrImg'), how = $('#qrHow');
  if (DONATE.transfer && qrDraw(cv, DONATE.transfer, 'M')){
    cv.hidden = false;
    how.textContent = '폰 카메라로 QR 을 비추면 계좌이체로 연결됩니다';
  } else if (DONATE.image && DONATE.image.length){
    /* 후보를 차례로 시도하고, 전부 없으면 조용히 숨긴다 — 깨진 아이콘을 보이지 않는다 */
    const cands = [].concat(DONATE.image);
    let k = 0;
    img.onload = () => { img.hidden = false;
      how.textContent = '폰 카메라로 QR 을 비추면 계좌이체로 연결됩니다'; };
    img.onerror = () => {
      if (++k < cands.length){ img.src = cands[k]; return; }
      how.textContent = acct
        ? '아래 계좌로 이체해 주세요' : '아래 링크에서 후원 방법을 확인해 주세요';
    };
